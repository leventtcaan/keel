openapi: 3.1.0
info:
  title: keel API
  version: 1.0.0
  description: |
    Contract-first API (anayasa K3, ADR-006, ADR-024). The backend implements this file; the mobile client's types are
    generated from it, never hand-written. Rules the contract keeps, each checked by backend ContractTests:
    - The Decision is the engine's Decision field for field (U3). Actions are a tagged union on `type`.
    - Every calorie estimate is a range, `KcalRange` / `KcalBalance` (U5). A target and a decision's step may be one
      number (U5); a device's own reading is passed through as given.
    - The engine's fat estimate never appears, in any form (U4) — except as the stored snapshot in the user's own export (/v1/account/export, ADR-063 #1). Error messages never carry health data (V3).
    Conventions: everything but health and sign-in is under /v1 and needs a session. Records the phone creates
    offline carry a `clientId` (a UUID the phone makes): sending one twice stores it once and answers 200 with the
    stored record instead of 201. Days are `date` (the user's local calendar day); moments are `date-time` with offset.
    Lists page backwards: `limit` and `before` (the cursor of the last item seen).
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - session: []
tags:
  - name: system
  - name: auth
  - name: account
  - name: profile
  - name: consent
  - name: measurement
  - name: nutrition
  - name: training
  - name: check-in
  - name: decision
  - name: coach
  - name: subscription

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        "200":
          description: The service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"

  # ── auth (K-203, ADR-011) ──────────────────────────────────────────────────────────────────────────────────
  /v1/auth/apple:
    post:
      tags: [auth]
      operationId: signInWithApple
      summary: Sign in with Apple; creates the account on first sign-in
      description: |
        The identity token is checked against Apple's public keys (signature, issuer, audience, expiry) and the nonce
        the phone sent to Apple. Answers a session; `newAccount` tells the app to start onboarding.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleSignIn"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Trade a refresh token for a new session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new session; the old refresh token no longer works
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/sign-out:
    post:
      tags: [auth]
      operationId: signOut
      summary: End the session and revoke its refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Error"

  # ── account (K-214, V6) ────────────────────────────────────────────────────────────────────────────────────
  /v1/account:
    delete:
      tags: [account]
      operationId: deleteAccount
      summary: Delete the account and every record of it, in every module
      responses:
        "202":
          description: |
            Deletion started; every module removes its own data (AccountDeletionRequested). The account is gone at once:
            from this answer on, its tokens get 401 — the phone signs out and drops its offline queue.
        default:
          $ref: "#/components/responses/Error"
  /v1/account/apple-revocation:
    post:
      tags: [account]
      operationId: revokeAppleSignIn
      summary: End Sign in with Apple for this app, before the account is deleted
      description: |
        K-812, ADR-062. The phone asks Apple for a fresh authorization code (Sign in with Apple again) and sends it here just
        before DELETE /v1/account. The server trades it at Apple's /auth/token, checks the identity token is this account's,
        and revokes the refresh token at /auth/revoke. Nothing of Apple's is kept. Whatever this answers, the phone goes on
        with the deletion (V6): 400 the code is not good or not this account's; 503 revocation is not set up or Apple did not
        answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleRevocationRequest"
      responses:
        "204":
          description: Apple revoked this app's sign-in for the person
        default:
          $ref: "#/components/responses/Error"
  /v1/account/export:
    get:
      tags: [account]
      operationId: exportAccount
      summary: Everything held about the user, as JSON
      responses:
        "200":
          description: The export, one section per module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        default:
          $ref: "#/components/responses/Error"

  # ── subscription (K-705, ADR-012, ADR-056) ─────────────────────────────────────────────────────────────────
  /v1/subscription:
    get:
      tags: [subscription]
      operationId: getSubscription
      summary: The user's subscription as the server keeps it, from the store's events
      description: |
        What the paywall and the settings screen show (K-705): whether the subscription is active and what kind of state it is.
        Read only from what the server keeps of RevenueCat's events (ADR-056) — never from the phone; a purchase the store
        has not told the server about yet (its webhook comes 5-60 seconds later) is not here yet, so the phone asks again
        for a short while after a purchase. No price: prices are the store's (ADR-012, K2). An account that never
        subscribed is not an error: 200, `active: false` and the id to buy under. Reading never changes anything.
      responses:
        "200":
          description: The subscription, or that there is none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        default:
          $ref: "#/components/responses/Error"

  # ── profile (K-205) ────────────────────────────────────────────────────────────────────────────────────────
  /v1/profile:
    get:
      tags: [profile]
      operationId: getProfile
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [profile]
      operationId: putProfile
      summary: Set the whole profile (onboarding and settings)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Profile"
      responses:
        "200":
          description: The stored profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"

  # ── consent (K-204, ADR-007) ───────────────────────────────────────────────────────────────────────────────
  /v1/consents:
    get:
      tags: [consent]
      operationId: listConsents
      summary: The current state of each of the three consents
      responses:
        "200":
          description: One entry per kind
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Consent"
        default:
          $ref: "#/components/responses/Error"
  /v1/consents/{kind}:
    parameters:
      - $ref: "#/components/parameters/ConsentKind"
    put:
      tags: [consent]
      operationId: grantConsent
      summary: Grant a consent to the version of its text the user saw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentGrant"
      responses:
        "200":
          description: Granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [consent]
      operationId: withdrawConsent
      summary: Withdraw a consent; the features it covers stop and the data it covered is deleted
      description: |
        The features behind the consent stop at once. Withdrawing HEALTH_DATA also deletes, irreversibly and in the
        same request, every health record it covered — weigh-ins, waist measurements, photo checks, looks, activity
        days, meals, weekly calls and the plan, and the foods to avoid (K-231, ADR-028 #21); training and the profile
        stay. Because of that it must be confirmed (`confirmDataDeletion=true`, otherwise VALIDATION_FAILED); the app
        offers the export first. APPLE_HEALTH and THIRD_PARTY_AI cover no stored data and need no confirmation.
        Withdrawing a consent that is not given changes nothing.
      parameters:
        - name: confirmDataDeletion
          in: query
          required: false
          description: The user confirmed that the data the consent covered will be deleted. Required for HEALTH_DATA.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        default:
          $ref: "#/components/responses/Error"

  # ── measurement (K-206) ────────────────────────────────────────────────────────────────────────────────────
  /v1/weigh-ins:
    get:
      tags: [measurement]
      operationId: listWeighIns
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Weigh-ins in the range, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeighIn"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [measurement]
      operationId: recordWeighIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewWeighIn"
      responses:
        "201":
          $ref: "#/components/responses/WeighInCreated"
        "200":
          $ref: "#/components/responses/WeighInCreated"
        default:
          $ref: "#/components/responses/Error"
  /v1/weigh-ins/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [measurement]
      operationId: deleteWeighIn
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /v1/weight-trend:
    get:
      tags: [measurement]
      operationId: getWeightTrend
      summary: The trend weight per day (7-day average, the engine's WeightTrend)
      description: |
        One point per day, up to today in the user's time zone, whose 7 days hold at least one weigh-in (the day's first
        counts), imported ones too (the history is to be seen, ADR-053). Needs the profile (NOT_FOUND without one). At most
        400 days per request.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: One point per day that has a trend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendPoint"
        default:
          $ref: "#/components/responses/Error"
  /v1/waist-measurements:
    get:
      tags: [measurement]
      operationId: listWaistMeasurements
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Waist measurements in the range, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WaistMeasurement"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [measurement]
      operationId: recordWaistMeasurement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewWaistMeasurement"
      responses:
        "201":
          $ref: "#/components/responses/WaistMeasurementCreated"
        "200":
          $ref: "#/components/responses/WaistMeasurementCreated"
        default:
          $ref: "#/components/responses/Error"
  /v1/photo-checks:
    post:
      tags: [measurement]
      operationId: recordPhotoCheck
      summary: What the phone concluded from a progress photo; the photo itself never leaves the phone (V1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPhotoCheck"
      responses:
        "201":
          $ref: "#/components/responses/PhotoCheckCreated"
        "200":
          $ref: "#/components/responses/PhotoCheckCreated"
        default:
          $ref: "#/components/responses/Error"
  /v1/body-looks:
    post:
      tags: [measurement]
      operationId: recordBodyLook
      summary: The reference look closest to the user's own, as a level (K-224); never a percent in or out (U4)
      description: |
        The app shows reference looks (the belly test, Ö-4) and sends the level picked, 1 to look_levels (7). The engine
        reads it, with the waist, as its internal estimate; no response anywhere carries a percent. Health data:
        CONSENT_REQUIRED without the HEALTH_DATA consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBodyLook"
      responses:
        "201":
          $ref: "#/components/responses/BodyLookCreated"
        "200":
          $ref: "#/components/responses/BodyLookCreated"
        default:
          $ref: "#/components/responses/Error"
  /v1/activity-days:
    put:
      tags: [measurement]
      operationId: putActivityDay
      summary: A day's steps, sleep and active energy from Apple Health (replaces that day's values)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityDay"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDay"
        default:
          $ref: "#/components/responses/Error"

  # ── nutrition (K-208, K-209, ADR-008) ──────────────────────────────────────────────────────────────────────
  /v1/foods/search:
    post:
      tags: [nutrition]
      operationId: searchFoods
      summary: Search the food database by name
      description: A POST so the search words stay out of URLs and access logs (V3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodSearch"
      responses:
        "200":
          description: Best matches first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Food"
        default:
          $ref: "#/components/responses/Error"
  /v1/foods/barcode-lookup:
    post:
      tags: [nutrition]
      operationId: lookUpBarcode
      summary: The product with this barcode (USDA FDC Branded Foods, ADR-008)
      description: A POST so the barcode stays out of URLs and access logs (V3). NOT_FOUND when FDC has no such product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarcodeLookup"
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Food"
        default:
          $ref: "#/components/responses/Error"
  /v1/food-estimates:
    post:
      tags: [nutrition]
      operationId: estimateFood
      summary: Match food and amounts to the database and answer ranges (U1, U5); nothing is stored
      description: |
        The estimate comes from the database, never from a language model's numbers. When one item dominates the
        range, `question` asks the one thing that would narrow it (at most one question).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodEstimateRequest"
      responses:
        "200":
          description: The estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEstimate"
        default:
          $ref: "#/components/responses/Error"
  /v1/meals:
    get:
      tags: [nutrition]
      operationId: listMeals
      parameters:
        - $ref: "#/components/parameters/Day"
      responses:
        "200":
          description: The day's meals, in time order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meal"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [nutrition]
      operationId: logMeal
      summary: Log a meal from items, or repeat an earlier meal ("same as yesterday")
      description: |
        Stored with the ranges as estimated now, on the user's local day at eatenAt (the profile's time zone). repeatOf
        is one of the user's own meals (else NOT_FOUND); its items are logged again as they were.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMeal"
      responses:
        "201":
          $ref: "#/components/responses/MealCreated"
        "200":
          $ref: "#/components/responses/MealCreated"
        default:
          $ref: "#/components/responses/Error"
  /v1/meals/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [nutrition]
      operationId: deleteMeal
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /v1/days/{day}/budget:
    parameters:
      - name: day
        in: path
        required: true
        schema:
          type: string
          format: date
    get:
      tags: [nutrition]
      operationId: getDayBudget
      summary: What is left of the day's target, as a range (target minus the logged range)
      description: |
        The target in force (set by calls, K-216); before the first call, the starting target the first call will start
        the plan with (GET /v1/targets/starting, K-997, ADR-072 Ek 1): the first week has "Food today" and "Food left" too,
        worked out here, never on the phone. NOT_FOUND with neither (no weigh-in yet, no profile, or a plan begun without
        a weigh-in). Health data: CONSENT_REQUIRED without the HEALTH_DATA consent, as for every /v1/meals route.
      responses:
        "200":
          description: The budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayBudget"
        default:
          $ref: "#/components/responses/Error"
  /v1/days/{day}/suggestions:
    parameters:
      - name: day
        in: path
        required: true
        schema:
          type: string
          format: date
    get:
      tags: [nutrition]
      operationId: getDaySuggestions
      summary: What the day can still hold — foods the user eats, in their usual amounts, that fit what is likely left (K-507)
      description: |
        From the user's own meals of the last weeks, each in the amount they have most often, estimated from the database
        now (U1, U5); never a food in the profile's foods to avoid; kept while its high end fits the middle of what is
        left; a few at most, the most eaten first. Empty when nothing fits (a day past its target says nothing of it, U7).
        NOT_FOUND until the user has a target; CONSENT_REQUIRED without the HEALTH_DATA consent.
      responses:
        "200":
          description: The suggestions, in order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Suggestion"
        default:
          $ref: "#/components/responses/Error"
  /v1/recipes:
    get:
      tags: [nutrition]
      operationId: listRecipes
      summary: The user's recipes, by name, each with its ranges per portion as the database gives them now (ADR-034)
      description: Health data, as meals are (HEALTH_DATA consent; deleted when it is withdrawn).
      responses:
        "200":
          description: Every recipe of the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recipe"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [nutrition]
      operationId: saveRecipe
      summary: Keep a recipe — entered once, logged by the portion (K-413)
      description: |
        Only the ingredients are kept, never a number: the ranges are estimated again from the database whenever the
        recipe is read or logged (U1). A meal logs a recipe as one item, foodId "recipe:<id>", unit "portion". At most
        100 recipes a user (keel.nutrition.max-recipes): past that, VALIDATION_FAILED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRecipe"
      responses:
        "201":
          $ref: "#/components/responses/RecipeSaved"
        "200":
          $ref: "#/components/responses/RecipeSaved"
        default:
          $ref: "#/components/responses/Error"
  /v1/recipes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [nutrition]
      operationId: deleteRecipe
      summary: Forget a recipe; meals that logged it keep what they logged
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"

  # ── training (K-210, K-211, K-218, K-219) ──────────────────────────────────────────────────────────────────
  /v1/exercises:
    get:
      tags: [training]
      operationId: listExercises
      summary: The exercise catalog
      responses:
        "200":
          description: Every exercise
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercise"
        default:
          $ref: "#/components/responses/Error"
  /v1/program:
    get:
      tags: [training]
      operationId: getProgram
      summary: The current program with this week's targets
      responses:
        "200":
          description: The program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [training]
      operationId: putOwnProgram
      summary: Bring your own program; the engine coaches on top of it. Replaces the current one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnProgram"
      responses:
        "200":
          description: The stored program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [training]
      operationId: editProgram
      summary: Edit the program in place by its day and move ids; it keeps its source, rows and targets (K-995)
      description: |
        The program edited (ADR-073 #4, Ek 7): the program as the user wants it, every day in order. A day with `id` is that day
        of the program (its id and, without `name`, its name stay); a day without one is new and needs `name`; a day left
        out goes. `name` on a day renames it (a generated day then has the user's name). Each weekday once, none for a day on
        no weekday. A move with `id` (PlannedExercise.id, of any day: a move can go to another day) keeps its row and next
        target while it is the same move with the same rep range, other sets or not; another rep range keeps the row
        without its target (it was for the old range); another move in its place is a new row without a target (the new
        move has its own history). A move without `id` is new. Each id once. The program keeps its id and source: an
        edited GENERATED program stays GENERATED. The edit is a change of the change log (`Program.review.edits`), undone
        with POST /v1/program/review/undo as a suggestion is; the review runs again on the program edited.
        This week's sessions re-lay: a day the edit puts on another weekday, or takes out, loses this week's change, and the
        sessions its move pushed on go back to their days; today's swaps keep only a planned move swapped for one the day
        does not plan. A move's starting weight stays with its row while its range does. Nothing different from the program,
        nothing changes and nothing is logged. CONFLICT (409), nothing changed: a day or move id the program does not have
        (it changed since; read it again), or a day whose workout was started today put on another weekday or taken out
        (as a move or a skip: a session done is done; its moves may change). VALIDATION_FAILED as PUT. NOT_FOUND: no
        program.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramEdit"
      responses:
        "200":
          description: The program edited, reviewed again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        default:
          $ref: "#/components/responses/Error"
  /v1/program/generate:
    post:
      tags: [training]
      operationId: generateProgram
      summary: Build a program for the days the user has (4-day upper/lower by default); replaces the current one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramRequest"
      responses:
        "200":
          description: The new program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        default:
          $ref: "#/components/responses/Error"
  /v1/program/starting-weights:
    put:
      tags: [training]
      operationId: putStartingWeights
      summary: The loads the user knows; each becomes its move's first target in the current program
      description: |
        Replaces the starting weights given before (ADR-072 #5). A target a session already set is never changed, and a move
        left out has no target until its first session: none is derived from another. No current program: NOT_FOUND.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartingWeights"
      responses:
        "200":
          description: The program with the starting weights as targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        default:
          $ref: "#/components/responses/Error"
  /v1/program/review:
    get:
      tags: [training]
      operationId: getProgramReview
      summary: The current program reviewed against the coaching rules, with the review's changes in force
      description: |
        ADR-073 #2-#3. The user picks any of the suggestions, or none: "Keep mine as is" sends nothing and changes nothing.
        The same review rides on every Program the server answers (`Program.review`), so it runs again whenever the
        program changes. No current program: NOT_FOUND.
      responses:
        "200":
          description: The review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramReview"
        default:
          $ref: "#/components/responses/Error"
  /v1/program/review/apply:
    post:
      tags: [training]
      operationId: applyProgramReview
      summary: Apply the suggestions the user picked; the program keeps its source
      description: |
        In the review's order, one change each, each kept in the change log with the program before and after it. The
        review runs again after each: a later pick an earlier one already fixed is not applied, and one whose fix moved
        applies the fix the review holds now. A move the change leaves keeps its next target (a starting weight or a
        session's), except a move whose rep range changed: its target was for the old range. A GENERATED program stays
        GENERATED (ADR-073 #4). CONFLICT (409), nothing changed: the program is not the one `reviewId` names (it changed
        since the review; fetch it again), a suggestion id the review does not hold now, or the change would put a day
        whose workout was started today on another weekday or take it out (ADR-073 Ek 7). NOT_FOUND without a program.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewApply"
      responses:
        "200":
          description: The program with the changes, reviewed again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        default:
          $ref: "#/components/responses/Error"
  /v1/program/review/undo:
    post:
      tags: [training]
      operationId: undoProgramReview
      summary: Undo one applied change, or all of them ("N changes applied · Undo")
      description: |
        With `changeId`, that change, a suggestion applied or an edit (PATCH /v1/program, K-995): the program as it was
        before it, with the changes after it applied again. A later change that can no longer be applied (its finding is
        gone without the undone change; an edit, made to a program that is no more) is undone with it and named in
        `alsoUndone`, so the app can say how many changes went. Without `changeId`, every suggestion in force ("N changes
        applied · Undo"): the program as it was before the first of them; an edit made before it stays, one made after it
        is applied again or undone with them and named in `alsoUndone`. Moves keep their next targets as in apply. This
        week's sessions re-lay as for an edit. An undone change stays in the log, no longer in force; undone twice, or
        nothing to undo, nothing changes. NOT_FOUND: no program, or no such change. CONFLICT (409), nothing changed: the
        program changed another way since its last change, or the undo would put a day whose workout was started today on
        another weekday or take it out (ADR-073 Ek 7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewUndo"
      responses:
        "200":
          description: The program after the undo, reviewed again, and the later changes undone with it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewUndone"
        default:
          $ref: "#/components/responses/Error"
  /v1/program/cardio:
    put:
      tags: [training]
      operationId: putProgramCardio
      summary: The user's own cardio (ADR-074 #4); the engine never overwrites it, a new program and a new phase keep it
      description: |
        Replaces the engine's default cardio (and any the user set before) with this one: its sessions are the user's
        days and places, none turns cardio off. No current program: NOT_FOUND.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardioPlan"
      responses:
        "200":
          description: The program with the user's cardio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [training]
      operationId: deleteProgramCardio
      summary: Back to the coach's default cardio (ADR-074 Ek 1); the user's own is removed
      description: |
        The program's cardio is the engine's default again, following the phase in force. Harmless twice: without the
        user's own cardio it answers the program as it is. No current program: NOT_FOUND.
      responses:
        "200":
          description: The program with the default cardio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        default:
          $ref: "#/components/responses/Error"
  /v1/cardio-sessions:
    post:
      tags: [training]
      operationId: logCardioSession
      summary: A cardio session done, typed or read from Apple Health (ADR-074 #6)
      description: |
        Counted in its week's cardio (Program.cardio.doneThisWeek); never in the food budget nor in the weekly consistency,
        which counts weight sessions (ADR-074 #5, #6). Active energy needs the health data consent (CONSENT_REQUIRED).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCardioSession"
      responses:
        "201":
          $ref: "#/components/responses/CardioSessionCreated"
        "200":
          $ref: "#/components/responses/CardioSessionCreated"
        default:
          $ref: "#/components/responses/Error"
  /v1/program/today:
    post:
      tags: [training]
      operationId: changeToday
      summary: Change today's session ("Short on time", "Move it", "Skip today"), or change it back
      description: |
        Today's session as the user wants it (K-964, ADR-073 #5), on the user's calendar (`Program.today`): `programDayId`
        names it (the session `Program.week` puts on today). SHORT: the first short_session_moves moves in the program's
        order; the session counts for the week as any other. FULL: the short version off again, every exercise back (K-995).
        MOVE: to tomorrow, within the week (never past Sunday); a session already on that day moves on a day with it, and so
        on (the week re-lays itself); a moved session is a fresh one on its new day: neither the short version nor today's
        swaps go with it. SKIP: not done; no catch-up is added and nothing is planned again (U7, ADR-071 #3). UNDO (K-995):
        today's move or skip of that day's session undone, the session as it was before it (its day, the short version,
        today's swaps) and every session the move pushed on back on its day; `programDayId` names the session moved or
        skipped (`WeekSession.undoable`). Nothing to undo, nothing changes (harmless twice). Only this week's session
        changes, never the program. CONFLICT (409), nothing changed: that day's session is not on today (SHORT, FULL, MOVE,
        SKIP), a move would pass Sunday (`WeekSession.movePreview` says so beforehand), or (MOVE, SKIP, UNDO) a workout of that day was started today, under way or
        finished. NOT_FOUND: no program.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodayChange"
      responses:
        "200":
          description: The program with this week's sessions as changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        default:
          $ref: "#/components/responses/Error"
  /v1/program/swap:
    post:
      tags: [training]
      operationId: swapMove
      summary: Swap a move of a program day, today only or from now on
      description: |
        A move of a program day for one of its `swapOptions` (K-964, ADR-073 #6). TODAY: only in this week's session of
        that day, which must be on today and not started (CONFLICT otherwise: a workout of that day started today, under way
        or finished, swaps in the session itself); `to` is checked against the session's moves after today's earlier swaps,
        and the planned move again undoes the swap. FROM_NOW_ON: the
        program changes: the move's row gets the new move with the same sets and rep range, and no target (the new move
        has its own history and target, double progression per move); every other move keeps its row and target, the
        program its source and days. This week's swap for today of that move, or to the new move, ends (the plan is the
        swap now). The review's change log is cleared (the edit is the program now: "N changes applied · Undo" goes). VALIDATION_FAILED: `to` is not among the move's swap options (the user's own move has none).
        NOT_FOUND: no program, or no such day or move.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveSwap"
      responses:
        "200":
          description: The program after the swap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        default:
          $ref: "#/components/responses/Error"
  /v1/gyms:
    get:
      tags: [training]
      operationId: listGyms
      summary: The user's gyms and their equipment
      responses:
        "200":
          description: Every gym (empty when none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gym"
        default:
          $ref: "#/components/responses/Error"
  /v1/gyms/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [training]
      operationId: putGym
      summary: Store a gym under the id the phone made (created or replaced whole)
      description: |
        A new gym beyond 10 per account is 400 VALIDATION_FAILED (delete one first); an id that is another account's gym
        is 409 CONFLICT. Either way nothing is changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymInput"
      responses:
        "200":
          description: The stored gym
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gym"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [training]
      operationId: deleteGym
      responses:
        "204":
          description: Deleted (or there was none)
        default:
          $ref: "#/components/responses/Error"
  /v1/custom-exercises:
    get:
      tags: [training]
      operationId: listCustomExercises
      summary: The user's own moves, by name (K-424, ADR-035)
      responses:
        "200":
          description: Every move of the user's own
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomExercise"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [training]
      operationId: saveCustomExercise
      summary: Keep a move the catalog does not have
      description: |
        The engine needs what the catalog says of a move, so the user answers it (L3 §1 #10): compound or isolation, the
        load model, the equipment, one side at a time or not. A set names it by its id ("custom:<uuid>"); only its owner
        can. It may be in the user's own program (PUT /v1/program; ADR-035 Ek 1), where the engine applies no rule to it: no
        target, not counted by the program review, no swap options. A generated program is made of catalog moves only. At
        most 100 a user (keel.training.custom-exercise.max-count).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCustomExercise"
      responses:
        "201":
          $ref: "#/components/responses/CustomExerciseSaved"
        "200":
          $ref: "#/components/responses/CustomExerciseSaved"
        default:
          $ref: "#/components/responses/Error"
  /v1/workouts:
    get:
      tags: [training]
      operationId: listWorkouts
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Workouts in the range, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workout"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [training]
      operationId: startWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewWorkout"
      responses:
        "201":
          $ref: "#/components/responses/WorkoutCreated"
        "200":
          $ref: "#/components/responses/WorkoutCreated"
        default:
          $ref: "#/components/responses/Error"
  /v1/workouts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [training]
      operationId: getWorkout
      responses:
        "200":
          description: The workout with its sets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [training]
      operationId: deleteWorkout
      summary: Discard a workout and its sets (K-998, ADR-075 #5)
      description: |
        The workout and every set of it are gone: the week no longer counts it, progress and records no longer read it,
        and a target it set (a finished session of the program, or one closed by itself) comes again from the day's newest
        finished session left, as if it had not been (K-432 the same for an edit leaving a move no set); a target a newer
        session set stays. A set or a finish sent meanwhile is NOT_FOUND. NOT_FOUND for a workout not the user's, or one
        already discarded: a repeat changes nothing.
      responses:
        "204":
          description: Discarded
        default:
          $ref: "#/components/responses/Error"
  /v1/workouts/{id}/finish:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [training]
      operationId: finishWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutFinish"
      responses:
        "200":
          description: The finished workout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"
        default:
          $ref: "#/components/responses/Error"
  /v1/workouts/{id}/sets:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [training]
      operationId: logSet
      description: A clientId already used for a set of another workout is 409 CONFLICT, not a replay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSet"
      responses:
        "201":
          $ref: "#/components/responses/SetCreated"
        "200":
          $ref: "#/components/responses/SetCreated"
        default:
          $ref: "#/components/responses/Error"
  /v1/workouts/{id}/sets/{setId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: setId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [training]
      operationId: deleteSet
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"

  /v1/workouts/{id}/summary:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [training]
      operationId: getWorkoutSummary
      summary: The end of a workout in facts (K-965, ADR-075 #7); the phone fills its templates and computes nothing
      description: |
        Working sets only: a warm-up, a drop or a set to failure never counts (SetType). Imported sessions are history
        too: a session's earlier sets include them (ADR-053). NOT_FOUND for a workout not the user's.
      responses:
        "200":
          description: The workout's summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSummary"
        default:
          $ref: "#/components/responses/Error"
  /v1/training-progress:
    get:
      tags: [training]
      operationId: getTrainingProgress
      summary: The progress screen's training facts (K-965, ADR-078 #2, #4)
      description: |
        This Monday week's sets per primary muscle, and each move of the current program that has a working set: its
        baseline, its best set, its weekly best sets and its effort line; how many of them are stronger. No estimated max
        (B10). Without a program, no lifts and nothing planned. The weight trend (/v1/weight-trend) and the weeks on
        track (/v1/consistency) are their own.
      responses:
        "200":
          description: The training progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingProgress"
        default:
          $ref: "#/components/responses/Error"

  /v1/workout-imports:
    post:
      tags: [training]
      operationId: importWorkouts
      description: |
        Past sessions from another app's export (K-615, ADR-053), read on the phone (the file never leaves it). Each session
        is stored finished and marked with where it came from (Workout.importedFrom): it shows in the lists and the strength
        chart, and is never read by the engine — no call, check-in, consistency or training status counts it; nor does it
        move a program target or reach Apple Health. Needs the health data consent (CONSENT_REQUIRED without it). All or nothing:
        one invalid session or set is VALIDATION_FAILED for the whole request. A session whose clientId is already stored
        is skipped (a retry is safe). A set's side is not known from such a file and is not stored (absent), on a
        unilateral move too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutImport"
      responses:
        "200":
          description: How many sessions were stored now and how many were already there
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutImportResult"
        default:
          $ref: "#/components/responses/Error"

  # ── check-in (K-213) ───────────────────────────────────────────────────────────────────────────────────────
  /v1/check-ins/current:
    get:
      tags: [check-in]
      operationId: getCurrentCheckIn
      summary: This week's check-in and the few questions it needs (question budget, U9)
      description: |
        Only what the data does not already say is asked: weight, steps, sleep hours and training arrive on their own;
        how it looks comes from the week's photo check (from seven days before the check-in day) and the waist from its
        measurements. A question is asked only when
        the engine would wait for its answer this week (found by running it on the data and on each possible answer), at
        most question_budget_per_week (question_budget_per_week_anomaly when the photo or waist disagrees with the phase).
        No questions, and `answered`, once the week has its call — or once the last call's week overlaps it (the check-in
        day moved). NOT_FOUND before the first call's day (FirstWeeks.firstCallOn, K-990): the first week, from the day
        onboarding finished, is watched before it is decided on (U8, ADR-077 Ek 2). Choice texts:
        checkIn.choice.<kind>.<choice lowercased>.
      responses:
        "200":
          description: The check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"
        default:
          $ref: "#/components/responses/Error"
  /v1/check-ins/current/answers:
    post:
      tags: [check-in]
      operationId: answerCheckIn
      summary: Answer the check-in; the engine makes this week's call
      description: |
        The answers name their week (`weekOf`). Sent again with the same clientId, the stored call comes back (200) and
        the engine does not run twice; answers for a week that is not the current one, a second call this week, a user
        without a profile yet, or answers before the first call's day (K-990) are 409 CONFLICT. A goal of DECIDE_FOR_ME starts where the phase gate puts the fat estimate,
        a cut without one. Health data: CONSENT_REQUIRED without the HEALTH_DATA consent, as for every /v1/decisions route.
        Taken: TRAINING and RECOVERY, the questions the engine can wait for — also when the data has changed since they
        were asked, so a question shown is never refused —, APPETITE (NORMAL/GONE: asked on a long bulk when GONE would
        change the call, inside the week's budget; a gone appetite is the mini cut's reason) and CYCLE_STOPPED (YES/NO)
        from a woman: asked in the low energy band or when the call would wait for it after a hard stop, never kept, a
        man's is VALIDATION_FAILED. STATE_STILL (YES/NO, K-516): asked once a state has been declared on a day of each of the
        last state_still_after_paused_weeks weeks and is in force today; NO ends it yesterday (this week, declared, still
        waits). WEEK1_FEEL (TOO_MUCH/ABOUT_RIGHT/COULD_DO_MORE, ADR-077 #4): asked at the call that closes the first week,
        only when COULD_DO_MORE would change it (every planned session done, not a beginner, fewer training days than the
        ideal), inside the week's budget. Any other kind is VALIDATION_FAILED (400): how it looks and the waist come from the
        data, the rest are read with their own questions later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInAnswers"
      responses:
        "200":
          description: This week's call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        default:
          $ref: "#/components/responses/Error"

  /v1/state:
    get:
      tags: [check-in]
      operationId: getState
      summary: The state the user declared, in force today (K-516, ADR-038)
      description: |
        What life brought, declared by the user — never asked for (U9). NOT_FOUND when none is in force today. Sickness and
        pain are health data: CONSENT_REQUIRED without the HEALTH_DATA consent, as every /v1/decisions route; CONFLICT
        without a profile (no calendar to read today on).
      responses:
        "200":
          description: The state in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredState"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [check-in]
      operationId: declareState
      summary: Declare a state from today
      description: |
        From today on the user's calendar, until `until` (included) or until they are back. A state in force ends
        yesterday; one begun today is replaced whole. `until` before today, or more than max-range-days on, is
        VALIDATION_FAILED. While a week holds a declared day the week is paused — neither on track nor missed — and the
        week's call waits (NO_DECISION_YET); safety calls never wait (ADR-038).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDeclaredState"
      responses:
        "200":
          description: The state declared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredState"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [check-in]
      operationId: endState
      summary: Back — the state in force ends yesterday
      description: A state begun today is taken back. Nothing in force is nothing to do (204 all the same).
      responses:
        "204":
          description: Back
        default:
          $ref: "#/components/responses/Error"

  /v1/prompts:
    get:
      tags: [check-in]
      operationId: getPrompts
      summary: The coach's own questions today, not answered yet (K-512, ADR-039)
      description: |
        The coaching triggers (G5 §2) read from the user's logs, asked in the app — never pushed (ADR-036): steps under the
        target after a week on it (T-13), the planned sessions missed in a row (T-4), the loads below last week's (T-5), a
        cut's first days (T-2). Most pressing first; none in a week with a declared state (ADR-038). Each once per
        occurrence (`key`). Words: `copyKey`.title/.body, choices `copyKey`.choice.<choice lowercased>. Health data:
        CONSENT_REQUIRED without the HEALTH_DATA consent; CONFLICT without a profile.
      responses:
        "200":
          description: Today's questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prompt"
        default:
          $ref: "#/components/responses/Error"
  /v1/prompts/{rule}/answers:
    post:
      tags: [check-in]
      operationId: answerPrompt
      summary: Answer one of the coach's questions
      description: |
        Kept once per question and occurrence — the same answer again gets the same reply, a different one changes
        nothing. It never changes a call (U1, U2). A rule that is no question, a choice it does not have, or a key that
        is no day is VALIDATION_FAILED. Some answers get words back (`replyCopyKey`); the others take the user somewhere
        on the phone.
      parameters:
        - name: rule
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptAnswer"
      responses:
        "200":
          description: The answer kept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptReply"
        default:
          $ref: "#/components/responses/Error"

  /v1/first-weeks:
    get:
      tags: [check-in]
      operationId: getFirstWeeks
      summary: This week of the first eight (K-513, ADR-040)
      description: |
        The user's own week since the day onboarding finished (04 §7.5, I1 F2; K-990, ADR-077 Ek 2; an account onboarded
        before that day was kept counts from its first sign-in): week 1 has no words ("no comment, no score"), weeks
        2-8 have `contentKey`.title/.body (a version without lifting when no training is planned). Once the user's week
        just over is week 5 to 8 (G2 K-63), `risk` lists that week's signals, each with its source — any one is a risk,
        none weighed; empty when none, or when the week was paused (a declared state, the ladder's week off). Week 9 is
        open for week 8's risk alone, without words. `firstCallOn` until the first call is made: the day the plan, the
        paywall and Today name for it. NOT_FOUND once the flow is over. Health data: CONSENT_REQUIRED
        without the HEALTH_DATA consent; CONFLICT without a profile. It never changes a call (U1).
      responses:
        "200":
          description: This week of the flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirstWeeks"
        default:
          $ref: "#/components/responses/Error"

  # ── decision (K-212, K-216, K-217, ADR-003) ────────────────────────────────────────────────────────────────
  /v1/decisions:
    get:
      tags: [decision]
      operationId: listDecisions
      summary: Every call so far, newest first (the call ledger)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Before"
      responses:
        "200":
          description: A page of calls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionPage"
        default:
          $ref: "#/components/responses/Error"
  /v1/decisions/current:
    get:
      tags: [decision]
      operationId: getCurrentDecision
      summary: The call in force and the targets it set
      description: NOT_FOUND before the first check-in has produced a call.
      responses:
        "200":
          description: The current call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        default:
          $ref: "#/components/responses/Error"
  /v1/decisions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [decision]
      operationId: getDecision
      responses:
        "200":
          description: The call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        default:
          $ref: "#/components/responses/Error"
  /v1/decisions/{id}/basis:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [decision]
      operationId: getDecisionBasis
      description: |
        What the call read, as the rows "Why this call" shows (K-519, Ö-25): from the call's own stored snapshot, nothing
        else. Never a fat estimate (U4), never the cycle answer (never kept). Health data: CONSENT_REQUIRED without the
        HEALTH_DATA consent, as every /v1/decisions route; NOT_FOUND for a call that is not the user's.
      responses:
        "200":
          description: The call's basis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionBasis"
        default:
          $ref: "#/components/responses/Error"
  /v1/decisions/{id}/what-if:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [decision]
      operationId: getDecisionWhatIf
      description: |
        "What would change the call" (K-610, L3 Y3): the same rules run on example data a week from the call — every
        combination of next week's trend, plan kept and training. Example data, never the user's own, and labelled so.
        NOT_FOUND for a safety call (it says nothing of why, ADR-028 #24) and for a call that is not the user's;
        CONSENT_REQUIRED without the HEALTH_DATA consent.
      responses:
        "200":
          description: The example weeks and what the rules would call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatIf"
        default:
          $ref: "#/components/responses/Error"
  /v1/projection:
    get:
      tags: [decision]
      operationId: getProjection
      description: |
        The shape projection's numbers (K-613, U12, ADR-050, ADR-052): where the weight goes by `on` (projection_horizon_weeks
        from today) if the plan is kept 60 %, 80 % or 95 % of the time — the energy balance model (Hall 2011, ADR-051), each a
        range, only toward the goal (the end of a range that would go the other way stops at today's weight). Never a fat
        number (U4). The phone keeps it off by default and asks the SCOFF questions first; that answer never reaches here.
        Not shown → `shown: false` and the reason by name. CONSENT_REQUIRED without the HEALTH_DATA consent.
      responses:
        "200":
          description: The scenarios, or why there are none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Projection"
        default:
          $ref: "#/components/responses/Error"
  /v1/decisions/{id}/apply:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [decision]
      operationId: applyDecision
      summary: Apply the call; only the one thing it changes moves, everything else stays (U3)
      description: |
        Only the latest call, only while PENDING or DECLINED, and only on the plan target it judged (else 409: another call
        moved the plan while this one was being made). From DECLINED it is "Use this call" (K-963, ADR-077 #3): the call
        last week's plan was kept over is applied after all. Applied twice (or by two requests at once), the targets move once. A
        calorie call moves the calorie target (and restarts its wait); more movement raises the step target. A change of
        phase (the hard stop's too, marked `safety`) starts the new direction today at the maintenance estimate, watched;
        the hard stop never under maintenance and is not undone. A mini cut is a cut from today at the engine's target
        (one cut step under maintenance, or maintenance under a safety floor), not watched, until its longest length is
        over; the engine turns it back to building on that day. CONFLICT (409): an older call, one that changes nothing
        (NOT_NEEDED), one undone, a training call without a program to change. The deload ladder's calls change the
        program (K-217): hold the load from today; a lighter week or a week off from today to the day before the call's
        nextReview. NOT_FOUND for an unknown id. Health data: CONSENT_REQUIRED without the HEALTH_DATA consent.
      responses:
        "200":
          description: The targets after the call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Targets"
        default:
          $ref: "#/components/responses/Error"
  /v1/decisions/{id}/undo:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [decision]
      operationId: undoDecision
      summary: Put the targets back as they were before the call was applied (kept in the audit trail)
      description: |
        Only the latest call, and only once APPLIED; undone twice, nothing more changes. An undone call is not applied
        again (CONFLICT). The call keeps appliedAt and undoneAt.
      responses:
        "200":
          description: The targets after the undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Targets"
        default:
          $ref: "#/components/responses/Error"
  /v1/decisions/{id}/decline:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [decision]
      operationId: declineDecision
      summary: Keep last week's plan; the call stays on record, not applied (U2)
      description: |
        "Keep last week's plan" (K-963, B11): the latest call, PENDING or APPLIED, becomes DECLINED. The plan is last
        week's: a pending call changes nothing, an applied one is put back exactly as an undo would (its planBefore, and
        the program change it made). The call itself does not change (U2): it stays on record, and the next week's call
        reads the plan as not applied. "Use this call" is POST /v1/decisions/{id}/apply. Declined twice, nothing more
        changes. CONFLICT (409): a call resting on the safety net (marked `safety`, or a reason among its rules; U13) is
        never declined; nor an older call, one that changes nothing (NOT_NEEDED), or one undone. NOT_FOUND for an unknown
        id. Health data: CONSENT_REQUIRED without the HEALTH_DATA consent.
      responses:
        "200":
          description: The targets after the decline (last week's)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Targets"
        default:
          $ref: "#/components/responses/Error"
  /v1/consistency:
    get:
      tags: [decision]
      operationId: getConsistency
      summary: This week's consistency, its four kinds of action, and the weeks on track
      description: |
        The Today screen's number (K-420, K-111, U15): this week, Monday to today on the user's calendar, counted from
        the logs. Today is not over, so a protein or step day is judged from yesterday back; a session or a weigh-in done
        today is done. The record counts the weeks over since the first call and is never reset (U7). Health data
        (weigh-ins, protein): CONSENT_REQUIRED without the consent. NOT_FOUND before the first call (nothing planned yet).
      responses:
        "200":
          description: This week and the record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consistency"
        default:
          $ref: "#/components/responses/Error"
  /v1/targets:
    get:
      tags: [decision]
      operationId: getTargets
      summary: The targets the user follows today
      description: |
        NOT_FOUND before the first estimate (no plan, or no weigh-in when it began). The macros split the calorie target
        at today's trend weight, or the last weight known however old. The food budget (/v1/days/{day}/budget) reads the
        same targets.
      responses:
        "200":
          description: The targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Targets"
        default:
          $ref: "#/components/responses/Error"
  /v1/targets/starting:
    get:
      tags: [decision]
      operationId: getStartingTarget
      summary: The calorie target the first call starts the plan with, before it is made (K-989)
      description: |
        The plan-ready screen's food row (ADR-072 #6): the engine's starting estimate on today's inputs, the same computation
        the first weekly call starts the plan with (U1), so with the same inputs the same number. Nothing is stored: it is
        not a call. Health data: CONSENT_REQUIRED without the HEALTH_DATA consent; CONFLICT without a profile, and once the
        first call has started the plan (use GET /v1/targets, or none yet: a first call made without a weigh-in starts a
        plan with no target, which a later weigh-in gives it); NOT_FOUND without a weigh-in in the evaluation window, as
        the first call would then start without a target. In each case the app shows no row.
      responses:
        "200":
          description: The starting target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartingTarget"
        default:
          $ref: "#/components/responses/Error"

  # ── coach (M5, ADR-004) ────────────────────────────────────────────────────────────────────────────────────
  /v1/coach/messages:
    post:
      tags: [coach]
      operationId: askCoach
      summary: Ask about a call or the plan; the coach explains, it does not decide (U1)
      description: |
        About the call `decisionId` names, or the latest. The question and the call's facts go to a third-party language
        model, so they need the THIRD_PARTY_AI consent to that provider and that data (V2); without it the answer is 403
        CONSENT_REQUIRED. The call is health data: HEALTH_DATA consent. The model's words are shown only when they are the
        call told — its numbers only, no concession, no contradiction, no forbidden phrase (K-505); otherwise the answer is
        the engine's own words (DETERMINISTIC). When there is no call yet, or for a call only the engine tells (the safety
        label, a call waiting for the cycle question, the safety net's), nothing is sent anywhere. Every answer
        about a call carries the call as it stands: the coach explains, it never changes it (U1, U2). Unknown decisionId:
        404. Daily limit: coach_messages_per_day (data/parameters/quota.yaml, the user's day; K-508) — past it the answer
        is the engine's words (DETERMINISTIC, copyKey coach.answer.daily_limit), never an error and nothing to buy.
        Subscription (K-703, ADR-056): a question the model would be asked needs an active subscription — without one,
        403 ENTITLEMENT_REQUIRED before the consents are looked at, and nothing is counted or sent. The engine's own words
        (no call yet, a call only the engine tells) need none; nor do the call, the log and every other route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachQuestion"
      responses:
        "200":
          description: The answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachAnswer"
        default:
          $ref: "#/components/responses/Error"

  /v1/meals/parse:
    post:
      tags: [coach]
      operationId: parseMeal
      summary: A meal said in words, as a draft of the database's foods to confirm (K-504)
      description: |
        The words go to a third-party language model, which reads which foods and how much (grams) — never what a food
        holds (U1). A meal is health data: HEALTH_DATA consent (ADR-026); and the THIRD_PARTY_AI consent to that provider and
        the meal note (V2) — without either, 403 CONSENT_REQUIRED and nothing is sent. The foods are the database's: sure when a food holds every word the model gave, otherwise the
        foods of each word, one tap away (U5), or none. Nothing is logged: the app estimates with /v1/food-estimates and
        logs with /v1/meals once the user confirms. A reply off its schema, or past the day's limit
        (coach_messages_per_day, K-508), gives an empty DETERMINISTIC draft: the user searches. Needs an active
        subscription (K-703): without one, 403 ENTITLEMENT_REQUIRED before anything else, nothing counted or sent — the
        user searches and logs as always.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealWords"
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealDraft"
        default:
          $ref: "#/components/responses/Error"
  /v1/meals/photo:
    post:
      tags: [coach]
      operationId: readMealPhoto
      summary: A meal photo, as a draft of the database's foods with grams by eye (K-514)
      description: |
        A JPEG or PNG of at most 1024 px a side (the app shrinks it and drops its metadata, V1); a larger one is 400, a
        body longer than such a photo can be 413. The server sends on only a JPEG it writes from the pixels — nothing the
        file carried besides them — and keeps nothing. The photo goes to a third-party language model, which reads which
        foods and how many grams by eye — never what a food holds (U1). HEALTH_DATA consent (ADR-026) and the
        THIRD_PARTY_AI consent to that provider and the meal photo (V2) — without either, 403 CONSENT_REQUIRED and nothing
        is sent. Every amount is grams with certainty ESTIMATED: the app sends it as it is to /v1/food-estimates, whose
        range is wide for an estimate and whose gram question narrows it (U5). Nothing is logged until the user confirms
        with /v1/meals. A reply off its schema, or past the day's photo analyses (photo_analyses_per_day), gives an empty
        DETERMINISTIC draft: the user searches. Needs an active subscription (K-703): without one, 403
        ENTITLEMENT_REQUIRED before the photo is read, nothing counted or sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealPhoto"
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealDraft"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token of a Session (K-203).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsentKind:
      name: kind
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ConsentKind"
    From:
      name: from
      in: query
      required: true
      description: First day, inclusive (local day). A range is at most 400 days.
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      required: true
      description: Last day, inclusive
      schema:
        type: string
        format: date
    Day:
      name: day
      in: query
      required: true
      schema:
        type: string
        format: date
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Before:
      name: before
      in: query
      description: The cursor of the last item already seen; omitted for the newest page
      schema:
        type: string

  responses:
    Error:
      description: Any error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WeighInCreated:
      description: Stored (201), or already stored with this clientId (200)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WeighIn"
    WaistMeasurementCreated:
      description: Stored (201), or already stored with this clientId (200)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WaistMeasurement"
    BodyLookCreated:
      description: Stored (201), or already stored with this clientId (200)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BodyLook"
    PhotoCheckCreated:
      description: Stored (201), or already stored with this clientId (200)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PhotoCheck"
    CustomExerciseSaved:
      description: Stored (201), or already stored with this clientId (200)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CustomExercise"
    RecipeSaved:
      description: Stored (201), or already stored with this clientId (200)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Recipe"
    MealCreated:
      description: Stored (201), or already stored with this clientId (200)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Meal"
    WorkoutCreated:
      description: Started (201), or already started with this clientId (200)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Workout"
    CardioSessionCreated:
      description: Stored (201), or already stored with this clientId (200)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CardioSession"
    SetCreated:
      description: Stored (201), or already stored with this clientId (200)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoggedSet"

  schemas:
    # ── shared ───────────────────────────────────────────────────────────────────────────────────────────────
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
    Error:
      type: object
      description: Shared error body. Messages never contain health data (anayasa V3).
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable code, e.g. VALIDATION_FAILED, NOT_FOUND, CONSENT_REQUIRED, ENTITLEMENT_REQUIRED (403: the
            subscription pays for this — the coach's model and the meal photo; the rest of the app works without it).
        message:
          type: string
          description: English, safe to show to the user.
    Subscription:
      type: object
      required: [active, appUserId]
      description: |
        The user's subscription (K-705, ADR-056 #5). Access is `active` alone — the server's own answer, from `accessUntil`;
        `status` only says what kind of state it is, for the app to tell. Without a subscription ever kept: `active` and
        `appUserId` only.
      properties:
        appUserId:
          type: string
          format: uuid
          description: |
            The id the store must know this account's purchases by — RevenueCat's app user id (ADR-056 #3): the account's
            opaque id, nothing else of the user. The phone logs in to RevenueCat with it before a purchase; a purchase made
            under another id never reaches this account.
        active:
          type: boolean
          description: Whether the subscription pays for the coach's model and the meal photo now.
        status:
          type: string
          description: |
            Only when a subscription was ever kept. TRIAL (the free week) · ACTIVE · CANCELLED (will not renew; paid until
            accessUntil) · BILLING_ISSUE (the store could not charge; access until the grace period's end) · PAUSED · EXPIRED ·
            REFUNDED.
          enum: [TRIAL, ACTIVE, CANCELLED, BILLING_ISSUE, PAUSED, EXPIRED, REFUNDED]
        accessUntil:
          type: string
          format: date-time
          description: |
            Only with `status`. The moment access ends (or ended): a trial's or a period's end, a cancelled subscription's
            last paid moment, the moment an expiry or a refund took it away.
    KcalRange:
      type: object
      description: An energy estimate, kcal a day or a meal, as a range (U5). low ≤ high.
      required: [low, high]
      properties:
        low:
          type: integer
          minimum: 0
        high:
          type: integer
          minimum: 0
    GramRange:
      type: object
      description: A macro estimate in grams, as a range (U5). low ≤ high.
      required: [low, high]
      properties:
        low:
          type: integer
          minimum: 0
        high:
          type: integer
          minimum: 0
    KcalBalance:
      type: object
      description: What is left of a target, as a range; negative when the day went past it. low ≤ high.
      required: [low, high]
      properties:
        low:
          type: integer
        high:
          type: integer
    GramBalance:
      type: object
      description: Grams left of a target, as a range; negative past it. low ≤ high.
      required: [low, high]
      properties:
        low:
          type: integer
        high:
          type: integer
    Left:
      type: object
      required: [kcal, proteinG]
      properties:
        kcal:
          $ref: "#/components/schemas/KcalBalance"
        proteinG:
          $ref: "#/components/schemas/GramBalance"
    ClientId:
      type: string
      format: uuid
      description: Made by the phone when the record is created; the same record sent again is stored once.

    # ── auth ─────────────────────────────────────────────────────────────────────────────────────────────────
    AppleSignIn:
      type: object
      required: [identityToken, nonce]
      properties:
        identityToken:
          type: string
          description: The JWT Apple gave the phone.
        nonce:
          type: string
          description: The raw nonce the phone hashed into its Apple request.
        authorizationCode:
          type: string
          description: |
            Apple's one-time code, exchanged on the server for the refresh token that account deletion must revoke
            (K-214; Apple's rule on deleting accounts that use Sign in with Apple — verified in K-203).
    AppleRevocationRequest:
      type: object
      required: [authorizationCode]
      properties:
        authorizationCode:
          type: string
          minLength: 1
          description: Sign in with Apple's authorization code from a sign-in just made; single use, valid five minutes.
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    Session:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, newAccount]
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        newAccount:
          type: boolean
          description: True on the first sign-in; the app starts onboarding.

    # ── account ──────────────────────────────────────────────────────────────────────────────────────────────
    AccountExport:
      type: object
      description: Everything held about the user, one section per module; the shape of each section is that module's.
      required: [exportedAt, sections]
      properties:
        exportedAt:
          type: string
          format: date-time
        sections:
          type: object
          additionalProperties: true

    # ── profile ──────────────────────────────────────────────────────────────────────────────────────────────
    Profile:
      type: object
      required: [goal, sex, heightCm, birthYear, programChoice, schedule, units]
      properties:
        goal:
          type: string
          enum: [LOSE_FAT, BUILD_MUSCLE, DECIDE_FOR_ME]
          description: What the user wants; the phase itself is the engine's call (K-105).
        sex:
          $ref: "#/components/schemas/Sex"
        heightCm:
          type: integer
          minimum: 100
          maximum: 250
        birthYear:
          type: integer
          description: |
            Adults only (K-225): only the year is kept, so this year minus birthYear must be at least 19 on the user's
            calendar — certainly 18 on every day of the year. Younger is VALIDATION_FAILED.
          minimum: 1900
        activityLevel:
          $ref: "#/components/schemas/ActivityLevel"
        experience:
          $ref: "#/components/schemas/Experience"
        programChoice:
          type: string
          enum: [BUILD_ONE_FOR_ME, BRING_MY_OWN]
        schedule:
          $ref: "#/components/schemas/Schedule"
        food:
          $ref: "#/components/schemas/FoodPreferences"
        units:
          type: string
          enum: [METRIC, IMPERIAL]
    Sex:
      type: string
      enum: [MALE, FEMALE]
    ActivityLevel:
      type: string
      description: The whole day's activity, training included (K-114). Absent until asked.
      enum: [INACTIVE, LOW_ACTIVE, ACTIVE, VERY_ACTIVE]
    Experience:
      type: string
      description: |
        How long the user has trained (ADR-072 #3): it changes what the onboarding asks and how many hints the app shows,
        and one engine rule: the first week's "add a day" is only for someone not just starting (ADR-077 #4); absent, the
        engine does not suggest it. Absent on a profile made before it was asked.
      enum: [NEW, UNDER_1Y, Y1_3, Y3_PLUS]
    Weekday:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
    Schedule:
      type: object
      required: [trainingDays, checkInDay, timeZone]
      properties:
        trainingDays:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Weekday"
        usualTrainingTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local time, HH:mm; reminders follow it. Optional; no longer asked (ADR-072 #4), kept where given.
        sessionsLastMonth:
          type: string
          description: Optional; no longer asked (ADR-072 #4), kept where given; nothing reads it.
          enum: [NONE_OR_ONE, TWO_TO_THREE, FOUR, FIVE_OR_MORE]
        checkInDay:
          $ref: "#/components/schemas/Weekday"
        timeZone:
          type: string
          description: IANA zone, e.g. Europe/Istanbul; the check-in day is the user's local day.
    FoodPreferences:
      type: object
      properties:
        avoid:
          type: array
          description: |
            Foods the user does not eat or cannot eat, in their own words. May be health data (an allergy, coeliac
            disease; GDPR Art. 9): kept only with the HEALTH_DATA consent (CONSENT_REQUIRED without it), and absent from
            responses while the consent is not given (K-225). While it is not given, a PUT leaves the stored list as it
            is (the user cannot see it, so its absence is not a wish to empty it); withdrawing the consent deletes it
            (K-231, ADR-030 #27).
          items:
            type: string
        budgetNote:
          type: string

    # ── consent ──────────────────────────────────────────────────────────────────────────────────────────────
    ConsentKind:
      type: string
      enum: [HEALTH_DATA, APPLE_HEALTH, THIRD_PARTY_AI]
    ConsentGrant:
      type: object
      required: [textVersion]
      properties:
        textVersion:
          type: string
          description: The version of the consent text the user saw.
        provider:
          type: string
          description: THIRD_PARTY_AI only — the company the data goes to, as named on the screen (Apple 5.1.2(i)).
        dataTypes:
          type: array
          description: THIRD_PARTY_AI only — what is sent, as named on the screen.
          items:
            type: string
    Consent:
      type: object
      required: [kind, status]
      properties:
        kind:
          $ref: "#/components/schemas/ConsentKind"
        status:
          type: string
          enum: [GRANTED, WITHDRAWN, NEVER_ASKED]
        textVersion:
          type: string
        provider:
          type: string
        dataTypes:
          type: array
          items:
            type: string
        grantedAt:
          type: string
          format: date-time
        withdrawnAt:
          type: string
          format: date-time

    # ── measurement ──────────────────────────────────────────────────────────────────────────────────────────
    MeasurementSource:
      type: string
      description: |
        IMPORT is history brought in once (K-616, Apple Health's older weigh-ins): listed and in the trend, never read by
        the engine — no call, check-in or tally counts it (ADR-053).
      enum: [MANUAL, APPLE_HEALTH, IMPORT]
    NewWeighIn:
      type: object
      required: [clientId, measuredAt, kg, source]
      properties:
        clientId:
          $ref: "#/components/schemas/ClientId"
        measuredAt:
          type: string
          format: date-time
        kg:
          type: number
          exclusiveMinimum: 0
          maximum: 500
          description: At most 2 decimals (the store keeps 2; a finer value is a validation error, not a silent rounding).
        source:
          $ref: "#/components/schemas/MeasurementSource"
    WeighIn:
      allOf:
        - $ref: "#/components/schemas/NewWeighIn"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    TrendPoint:
      type: object
      required: [day, kg]
      properties:
        day:
          type: string
          format: date
        kg:
          type: number
    NewWaistMeasurement:
      type: object
      required: [clientId, measuredOn, cm]
      properties:
        clientId:
          $ref: "#/components/schemas/ClientId"
        measuredOn:
          type: string
          format: date
        cm:
          type: number
          exclusiveMinimum: 0
          maximum: 300
          description: At most 1 decimal.
    WaistMeasurement:
      allOf:
        - $ref: "#/components/schemas/NewWaistMeasurement"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    Look:
      type: string
      description: The photo compared with the last one, judged on the phone.
      enum: [BETTER, SAME, WORSE]
    NewBodyLook:
      type: object
      required: [clientId, takenOn, level]
      properties:
        clientId:
          $ref: "#/components/schemas/ClientId"
        takenOn:
          type: string
          format: date
        level:
          type: integer
          minimum: 1
          maximum: 7
          description: The reference look picked, leanest first; what it means is the engine's (U4).
    BodyLook:
      allOf:
        - $ref: "#/components/schemas/NewBodyLook"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    NewPhotoCheck:
      type: object
      description: Derived on the phone; no image, no measurement of the body leaves it (V1).
      required: [clientId, takenOn, look]
      properties:
        clientId:
          $ref: "#/components/schemas/ClientId"
        takenOn:
          type: string
          format: date
        look:
          $ref: "#/components/schemas/Look"
    PhotoCheck:
      allOf:
        - $ref: "#/components/schemas/NewPhotoCheck"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    ActivityDay:
      type: object
      required: [day]
      properties:
        day:
          type: string
          format: date
        steps:
          type: integer
          minimum: 0
        sleepMinutes:
          type: integer
          minimum: 0
        activeEnergyKcal:
          type: integer
          minimum: 0
          description: Apple Health's own figure, passed through as given; any range around it is made on the server.

    # ── nutrition ────────────────────────────────────────────────────────────────────────────────────────────
    Food:
      type: object
      required: [id, name, per100g]
      properties:
        id:
          type: string
          description: The database's identifier (USDA FoodData Central, ADR-008).
        name:
          type: string
        brand:
          type: string
        per100g:
          $ref: "#/components/schemas/Nutrients"
        servings:
          type: array
          items:
            $ref: "#/components/schemas/Serving"
    Nutrients:
      type: object
      required: [kcal, proteinG, carbsG, fatG]
      properties:
        kcal:
          $ref: "#/components/schemas/KcalRange"
        proteinG:
          $ref: "#/components/schemas/GramRange"
        carbsG:
          $ref: "#/components/schemas/GramRange"
        fatG:
          $ref: "#/components/schemas/GramRange"
    Serving:
      type: object
      required: [name, grams]
      properties:
        name:
          type: string
          description: e.g. "1 cup", "1 large".
        grams:
          type: number
          exclusiveMinimum: 0
    Amount:
      type: object
      required: [quantity, unit]
      properties:
        quantity:
          type: number
          exclusiveMinimum: 0
          description: At most 2 decimals; the amount it makes is at most 5000 g.
        unit:
          type: string
          description: |
            grams (g), millilitres (ml: only for a food with a known density) or the name of one of the food's servings
            (a serving is a measure: its own range, whatever certainty says).
        certainty:
          type: string
          enum: [WEIGHED, ESTIMATED]
          description: A weighed amount narrows the range; an estimated one (the default) widens it.
    FoodSearch:
      type: object
      required: [q]
      properties:
        q:
          type: string
          minLength: 2
          maxLength: 100
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
    BarcodeLookup:
      type: object
      required: [gtin]
      properties:
        gtin:
          type: string
          pattern: "^[0-9]{8,14}$"
          description: As scanned — EAN-8, UPC-E (expanded by the server), UPC-A, EAN-13 or GTIN-14. A wrong check digit is 400.
    FoodEstimateRequest:
      type: object
      description: |
        Structured items only. Free text and meal photos need a language model, which only comes with the third-party
        AI consent (M5, V2) — added then, in a later contract version.
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/ItemRequest"
    ItemRequest:
      type: object
      required: [foodId, amount]
      properties:
        foodId:
          type: string
          description: |
            A food of the database, or one of the user's recipes as "recipe:<id>" (ADR-034) — then the unit is "portion"
            and the quantity is the portions eaten, at most the portions the recipe makes. A recipe's ingredients are
            database foods only.
        amount:
          $ref: "#/components/schemas/Amount"
    Suggestion:
      type: object
      description: A food the user eats, in their usual amount, as the database estimates it now (K-507).
      required: [foodId, name, amount, kcal, proteinG]
      properties:
        foodId:
          type: string
        name:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        kcal:
          $ref: "#/components/schemas/KcalRange"
        proteinG:
          $ref: "#/components/schemas/GramRange"
    EstimatedItem:
      type: object
      required: [foodId, name, amount, kcal, proteinG]
      properties:
        foodId:
          type: string
        name:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        kcal:
          $ref: "#/components/schemas/KcalRange"
        proteinG:
          $ref: "#/components/schemas/GramRange"
        carbsG:
          $ref: "#/components/schemas/GramRange"
        fatG:
          $ref: "#/components/schemas/GramRange"
    FoodEstimate:
      type: object
      required: [items, kcal, proteinG]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EstimatedItem"
        kcal:
          $ref: "#/components/schemas/KcalRange"
        proteinG:
          $ref: "#/components/schemas/GramRange"
        question:
          $ref: "#/components/schemas/AmountQuestion"
    AmountQuestion:
      type: object
      description: The one question that would narrow the range most, about the item that dominates it.
      required: [foodId, copyKey]
      properties:
        foodId:
          type: string
        copyKey:
          type: string
    MealSlot:
      type: string
      enum: [BREAKFAST, LUNCH, DINNER, SNACK]
    NewMeal:
      type: object
      description: Either items, or repeatOf (an earlier meal logged again) — exactly one.
      required: [clientId, eatenAt, slot]
      oneOf:
        - required: [items]
          not:
            required: [repeatOf]
        - required: [repeatOf]
          not:
            required: [items]
      properties:
        clientId:
          $ref: "#/components/schemas/ClientId"
        eatenAt:
          type: string
          format: date-time
        slot:
          $ref: "#/components/schemas/MealSlot"
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/ItemRequest"
        repeatOf:
          type: string
          format: uuid
    Meal:
      type: object
      required: [id, clientId, eatenAt, slot, items, kcal, proteinG]
      properties:
        id:
          type: string
          format: uuid
        clientId:
          $ref: "#/components/schemas/ClientId"
        eatenAt:
          type: string
          format: date-time
        slot:
          $ref: "#/components/schemas/MealSlot"
        items:
          type: array
          items:
            $ref: "#/components/schemas/EstimatedItem"
        kcal:
          $ref: "#/components/schemas/KcalRange"
        proteinG:
          $ref: "#/components/schemas/GramRange"
    NewRecipe:
      type: object
      required: [clientId, name, portions, items]
      properties:
        clientId:
          $ref: "#/components/schemas/ClientId"
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed; at most 80 code points.
        portions:
          type: integer
          minimum: 1
          maximum: 50
          description: How many portions the whole recipe makes.
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: The ingredients, as a meal's items (database foods only; ≤ 5000 g each).
          items:
            $ref: "#/components/schemas/ItemRequest"
    Recipe:
      type: object
      required: [id, clientId, name, portions, items]
      properties:
        id:
          type: string
          format: uuid
        clientId:
          $ref: "#/components/schemas/ClientId"
        name:
          type: string
        portions:
          type: integer
        items:
          type: array
          description: The ingredients as the database matches them now (those it still can).
          items:
            $ref: "#/components/schemas/EstimatedItem"
        perPortion:
          $ref: "#/components/schemas/Nutrients"
          description: Absent when an ingredient is unavailable.
        unavailable:
          type: array
          description: |
            Ingredients the database can no longer estimate (a food a later FDC release dropped), by foodId. The recipe
            cannot be logged until it is entered again; it can be deleted.
          items:
            type: string
    DayBudget:
      type: object
      required: [day, targetKcal, eaten, left]
      properties:
        day:
          type: string
          format: date
        targetKcal:
          type: integer
          description: The day's target (a plan number, one figure); before the first call, the starting target (K-997).
        eaten:
          $ref: "#/components/schemas/Nutrients"
        left:
          $ref: "#/components/schemas/Left"

    # ── training ─────────────────────────────────────────────────────────────────────────────────────────────
    Exercise:
      type: object
      required: [id, nameKey, kind, muscles, alternatives, load, equipment, unilateral, setupFields]
      properties:
        id:
          type: string
        nameKey:
          type: string
          description: |
            Copy key of the name (en.json, exercises.<id>.name). The search aliases are the app's text too:
            exercises.<id>.aliases, comma-separated.
        kind:
          type: string
          enum: [COMPOUND, ISOLATION]
        muscles:
          type: array
          items:
            type: string
        alternatives:
          type: array
          description: Exercise ids that can take its place.
          items:
            type: string
        load:
          type: string
          enum: [EXTERNAL, BODYWEIGHT, BODYWEIGHT_PLUS_EXTERNAL]
        equipment:
          $ref: "#/components/schemas/Equipment"
        unilateral:
          type: boolean
        setupFields:
          type: array
          description: |
            What the user sets on the machine and keeps on the phone (seat, pad, grip; ADR-017). Labels:
            exerciseSetup.<field>.label.
          items:
            type: string
        clips:
          $ref: "#/components/schemas/ExerciseClips"
          description: Absent until the clips passed the filming checklist; the app then shows no demonstration.
    ExerciseClips:
      type: object
      description: |
        The two demonstration clips (ADR-017) — the first rep and the last rep near the target RIR. Paths in the app's
        assets (clips/<id>/first-rep.mp4, clips/<id>/last-rep.mp4).
      required: [firstRep, lastRep]
      properties:
        firstRep:
          type: string
        lastRep:
          type: string
    Program:
      type: object
      description: |
        The program as it is this week: the deload ladder's calls in force today on the user's calendar (K-217) — a
        lighter week (`deload`, the sets of each exercise lowered), a week off (`restUntil`), the load held since a day
        (`loadHeldSince`: no load is added until the next rung). `review`: the program as it is now, reviewed (K-956); this
        server always sends it.
      required: [id, source, days]
      properties:
        deload:
          $ref: "#/components/schemas/DeloadWeek"
        restUntil:
          type: string
          format: date
          description: A week off in force; ends on its own after this day.
        loadHeldSince:
          type: string
          format: date
        backAfterBreak:
          type: boolean
          description: |
            Back after a long break (K-531, ADR-043 #75): a target from a session return_step_back_after_weeks or more ago is
            shown one engine step lighter, from the bottom of its range; present (true) only then.
        id:
          type: string
          format: uuid
        source:
          type: string
          enum: [GENERATED, OWN]
        days:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDay"
        cardio:
          $ref: "#/components/schemas/ProgramCardio"
        review:
          $ref: "#/components/schemas/ProgramReview"
        today:
          type: string
          format: date
          description: |
            Today on the user's calendar (the profile's time zone, UTC without one; K-995): the day `week` and
            POST /v1/program/today read. The app takes today from here, not from the phone's clock. This server always sends it.
        weekOf:
          type: string
          format: date
          description: |
            The Monday of `today`'s week (the consistency week, Monday to Sunday; K-995): the week `week` lays out. The app
            takes the week from here, never works it out. This server always sends it.
        week:
          type: array
          description: |
            This week's sessions on the user's calendar, Monday to Sunday by date (K-964): each program day put on a weekday,
            or moved to a day; a day on no weekday is not on the calendar. This server always sends it.
          items:
            $ref: "#/components/schemas/WeekSession"
    ProgramReview:
      type: object
      description: |
        The program reviewed (K-956, ADR-073 #2): at most review_max_suggestions suggestions, in priority order (training
        days, too many sets, too few sets, once a week, rep range). `id` names the program as reviewed (its moves, sets,
        rep ranges and day order; not names or weekdays): an apply names it. `applied`: the review's changes in force,
        oldest first. `edits`: the user's edits in force (PATCH /v1/program, K-995), oldest first, this server always sends
        it; both are undone with POST /v1/program/review/undo by their id. The user's own moves (not in the catalog) are not reviewed: they count for no muscle and no change
        touches them; `notReviewedMoves` says how many there are (this server always sends it).
      required: [id, suggestions, applied]
      properties:
        id:
          type: string
        notReviewedMoves:
          type: integer
          minimum: 0
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ReviewSuggestion"
        applied:
          type: array
          items:
            $ref: "#/components/schemas/AppliedReviewChange"
        edits:
          type: array
          items:
            $ref: "#/components/schemas/ProgramEditChange"
    ProgramEditChange:
      type: object
      description: An edit of the program in force (K-995), one change of the log, undone as a review change is.
      required: [id, editedAt]
      properties:
        id:
          type: string
          format: uuid
        editedAt:
          type: string
          format: date-time
    ReviewSuggestion:
      type: object
      description: |
        A finding with its fix. `id` is the finding and what it is about, the same while the program is. The words are the
        app's: data/copy/en.json › `copyKey` (title, body), with `numbers` as its placeholders and the muscle's or the
        move's name; `reason` is the coaching rule.
      required: [id, finding, numbers, copyKey, reason]
      properties:
        id:
          type: string
        finding:
          type: string
          enum: [TOO_MANY_DAYS, TOO_MANY_SETS, TOO_FEW_SETS, ONCE_A_WEEK, REP_RANGE]
        muscle:
          type: string
          description: The muscle (data/muscles.yaml) a sets or frequency finding is about.
        exerciseId:
          type: string
          description: The move a rep range finding is about.
        numbers:
          type: object
          additionalProperties:
            type: integer
        copyKey:
          type: string
        reason:
          $ref: "#/components/schemas/Reason"
    AppliedReviewChange:
      type: object
      description: A suggestion applied to the program, as it was shown when applied.
      required: [id, appliedAt, suggestion]
      properties:
        id:
          type: string
          format: uuid
        appliedAt:
          type: string
          format: date-time
        suggestion:
          $ref: "#/components/schemas/ReviewSuggestion"
    ReviewApply:
      type: object
      required: [reviewId, suggestionIds]
      properties:
        reviewId:
          type: string
          description: ProgramReview.id of the review the user picked from.
        suggestionIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
    ReviewUndone:
      type: object
      required: [program, alsoUndone]
      properties:
        program:
          $ref: "#/components/schemas/Program"
        alsoUndone:
          type: array
          description: |
            The id (AppliedReviewChange.id or ProgramEditChange.id) of each later change undone with the ones asked for, in
            order.
          items:
            type: string
            format: uuid
    ReviewUndo:
      type: object
      properties:
        changeId:
          type: string
          format: uuid
          description: AppliedReviewChange.id or ProgramEditChange.id; absent to undo every suggestion in force (edits stay, K-995).
    ProgramCardio:
      type: object
      description: |
        This week's cardio (ADR-074): the engine's default for the phase in force, the training days and the activity
        (GENERATED; cardio.yaml), or the user's own (USER), which neither a new program nor a new phase changes. Absent
        when there is neither: very active work, a gaining phase without training days, no profile yet. Each session is
        after the weights on a training day or at a very low pace on an off day, never before the weights (G2 K-35).
        `doneThisWeek` is the days of this week (Monday to Sunday, the user's calendar) with a cardio session logged: the
        "1 of 3 this week". Cardio is not in the food budget and not in the weekly consistency, which counts weight
        sessions (ADR-074 #5, #6).
      required: [source, minutes, sessionsPerWeek, sessions, doneThisWeek, afterLiftOverLine]
      properties:
        afterLiftOverLine:
          type: boolean
          description: |
            True when a session after the weights runs past cardio_after_lift_max_minutes (G2 K-35): the app shows one line
            of information (copy cardio_after_lift_over_line), never a block (ADR-074 #4). Set by the server; the phone runs
            no rule.
        source:
          $ref: "#/components/schemas/CardioSource"
        minutes:
          type: integer
          minimum: 1
          description: Each session's length.
        sessionsPerWeek:
          type: integer
          minimum: 0
          description: The week's target, the number of sessions; 0 is cardio the user turned off.
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/PlannedCardio"
        doneThisWeek:
          type: integer
          minimum: 0
    CardioSource:
      type: string
      description: GENERATED is the engine's default; USER the user's own, never overwritten by the engine (ADR-074 #4).
      enum: [GENERATED, USER]
    PlannedCardio:
      type: object
      description: One cardio session of the week, one a day at most.
      required: [weekday, place]
      properties:
        weekday:
          $ref: "#/components/schemas/Weekday"
        place:
          $ref: "#/components/schemas/CardioPlace"
    CardioPlace:
      type: string
      description: After the weights on a training day, or on a day without weights at a very low pace (G2 K-35, K-36). Never before the weights.
      enum: [AFTER_LIFT, OFF_DAY_LOW_INTENSITY]
    CardioPlan:
      type: object
      description: The user's own cardio (ADR-074 #4); an empty list turns cardio off.
      required: [minutes, sessions]
      properties:
        minutes:
          type: integer
          minimum: 1
          maximum: 600
        sessions:
          type: array
          maxItems: 7
          description: One a weekday at most.
          items:
            $ref: "#/components/schemas/PlannedCardio"
    NewCardioSession:
      type: object
      required: [clientId, day, minutes, source]
      properties:
        clientId:
          $ref: "#/components/schemas/ClientId"
        day:
          type: string
          format: date
        minutes:
          type: integer
          minimum: 1
          maximum: 600
        source:
          $ref: "#/components/schemas/CardioLogSource"
        activeEnergyKcal:
          type: integer
          minimum: 0
          maximum: 5000
          description: |
            What an Apple Watch measured during the session (HealthKit active energy), passed through as given; only with
            APPLE_HEALTH, absent without a watch. Never estimated, never added to the food budget (ADR-074 #5).
    CardioSession:
      allOf:
        - $ref: "#/components/schemas/NewCardioSession"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    CardioLogSource:
      type: string
      description: Typed in the app, or read from an Apple Health workout (the same word as MeasurementSource).
      enum: [MANUAL, APPLE_HEALTH]
    TodayChange:
      type: object
      required: [programDayId, change]
      properties:
        programDayId:
          type: string
          format: uuid
        change:
          type: string
          enum: [SHORT, FULL, MOVE, SKIP, UNDO]
    MoveSwap:
      type: object
      required: [programDayId, exerciseId, to, scope]
      properties:
        programDayId:
          type: string
          format: uuid
        exerciseId:
          type: string
          description: The planned move swapped.
        to:
          type: string
          description: One of the planned move's swapOptions (or, TODAY, the planned move again).
        scope:
          type: string
          enum: [TODAY, FROM_NOW_ON]
    WeekSession:
      type: object
      description: |
        A program day's session this week (K-964): on `date`, its weekday's unless moved (`moved` true); `skipped` true when
        the user skipped it (not done, nothing planned again); `short` true for the short version. `exerciseIds`: the
        session's moves that day in order, the short version's first short_session_moves and today's swaps applied.
      required: [programDayId, date, exerciseIds]
      properties:
        programDayId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        moved:
          type: boolean
        movedFrom:
          type: string
          format: date
          description: A moved session's own day in the program (its weekday's this week), present only when moved (K-995).
        undoable:
          type: boolean
          description: |
            Present (true) only when today's move or skip of this session can be undone (POST /v1/program/today UNDO, K-995):
            moved or skipped today and no workout of it started today.
        workout:
          $ref: "#/components/schemas/SessionWorkout"
        movePreview:
          $ref: "#/components/schemas/MovePreview"
        skipped:
          type: boolean
        short:
          type: boolean
        exerciseIds:
          type: array
          items:
            type: string
        swaps:
          type: array
          description: |
            Today's swaps in force (K-964, ADR-073 #6): each planned move swapped for today only (`insteadOf`) and the move in
            its place as a planned exercise of its own: the planned move's sets and rep range, no target, its own history
            (`lastBestSet`) and in-session table (ADR-075 #3), like a move swapped from now on. Absent when there is none.
          items:
            $ref: "#/components/schemas/TodaySwap"
    MovePreview:
      type: object
      description: |
        What "Move it" (POST /v1/program/today MOVE) would do to today's session now (K-995, ADR-073 Ek 6): present only on
        the session on today, not skipped. `shifts`: each session the move puts on a new day, by date — today's on tomorrow,
        then any it pushes on a day (the week re-lays itself); the app shows them and works none out. `conflict`: the move
        would be refused (409), `shifts` empty: PAST_SUNDAY, a session would pass Sunday; STARTED, a workout of the day was
        started today.
      required: [shifts]
      properties:
        shifts:
          type: array
          items:
            $ref: "#/components/schemas/MoveShift"
        conflict:
          type: string
          enum: [PAST_SUNDAY, STARTED]
    MoveShift:
      type: object
      required: [programDayId, date]
      properties:
        programDayId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: The day the session would be on.
    SessionWorkout:
      type: object
      description: |
        The workout of a week's session (K-995): of its program day, the latest started this week on the user's calendar.
        OPEN: under way, not finished (ADR-075 #5: it closes by itself later); the app continues it (`id`), never starts
        another. DONE: finished; the app does not offer to start it again.
      required: [id, state]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [OPEN, DONE]
    TodaySwap:
      type: object
      required: [insteadOf, exercise]
      properties:
        insteadOf:
          type: string
          description: The planned move swapped.
        exercise:
          $ref: "#/components/schemas/PlannedExercise"
    DeloadWeek:
      type: object
      description: A lighter week in force (K-217); ends on its own after `until`.
      required: [setsFactor, until]
      properties:
        setsFactor:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        until:
          type: string
          format: date
    ProgramDay:
      type: object
      description: A generated day names itself by nameKey (programDays.<day>.name, "Upper A"); a day of the user's own program by name.
      required: [id, exercises]
      properties:
        id:
          type: string
          format: uuid
        nameKey:
          type: string
        name:
          type: string
        weekday:
          $ref: "#/components/schemas/Weekday"
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/PlannedExercise"
    Equipment:
      type: string
      description: |
        What an exercise's load is made of, and so what loadKg means (ADR-032): BARBELL the bar with its plates (total);
        DUMBBELL one dumbbell's weight; MACHINE and CABLE the stack's reading; PLATE_LOADED the plates loaded (not the
        sled); BODYWEIGHT the added load (one plate or one dumbbell; see Exercise.load).
      enum: [BARBELL, DUMBBELL, MACHINE, CABLE, PLATE_LOADED, BODYWEIGHT]
    GymMachine:
      type: object
      description: A machine or cable exercise in this gym with its own stack step.
      required: [exerciseId, stepKg]
      properties:
        exerciseId:
          type: string
        stepKg:
          type: number
          exclusiveMinimum: 0
          maximum: 100
    GymInput:
      type: object
      description: |
        A gym's equipment (K-414, ADR-032), in kg (ADR-029; the phone converts). The next session's load is rounded to
        what the current gym can make. platesKg: the plate sizes, each assumed in enough pairs; dumbbellsKg: every
        dumbbell on the rack (one dumbbell's weight); stackStepKg: the stack step of a machine or cable not listed in
        machines. Loads at most 2 decimals; lists without repeats. current true makes it the gym in use (the others stop
        being).
      required: [name, current, platesKg, dumbbellsKg, machines]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        current:
          type: boolean
        barKg:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          description: The bar's weight; absent when the gym has no barbell.
        platesKg:
          type: array
          maxItems: 20
          items:
            type: number
            exclusiveMinimum: 0
            maximum: 100
        dumbbellsKg:
          type: array
          maxItems: 100
          items:
            type: number
            exclusiveMinimum: 0
            maximum: 200
        stackStepKg:
          type: number
          exclusiveMinimum: 0
          maximum: 100
        machines:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/GymMachine"
    Gym:
      allOf:
        - $ref: "#/components/schemas/GymInput"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    PlannedExercise:
      type: object
      required: [exerciseId, baseSets, sets, reps, targetRir]
      properties:
        id:
          type: string
          format: uuid
          description: |
            The program's row of the move (K-995): an edit (PATCH /v1/program) names it to keep the move's row and target. Sent
            for every move of a program day; absent on a move swapped in for today (TodaySwap), which is no row.
        exerciseId:
          type: string
        baseSets:
          type: integer
          minimum: 1
          description: The program's sets.
        sets:
          type: integer
          minimum: 1
          description: This week's sets (baseSets, or fewer in a deload).
        reps:
          $ref: "#/components/schemas/RepRange"
        targetRir:
          type: integer
          minimum: 0
        nextLoadKg:
          type: number
          minimum: 0
          description: |
            The load for the next session after progression and deload (K-217), or a starting weight until the first
            session (ADR-072 #5); absent until known.
        nextReps:
          type: integer
          minimum: 1
          description: The reps to aim for next session (double progression, K-217); absent until known.
        rackEnds:
          type: boolean
          description: |
            The next reps stopped at the ceiling (K-534, ADR-045 #73): the gym has no next load for this move the user can
            reach (none heavier, or too far to take yet). Present (true) only then; not while a deload hold or a return after
            a break shows another target.
        lighterLoadKg:
          type: number
          exclusiveMinimum: 0
          description: |
            The in-session table (K-960, ADR-075 #3), worked out on the server so the phone only picks a value in the gym,
            offline. "Too heavy?" (G1 decision #61): one load step (the region's, H3 B4) under the load the session starts
            from (nextLoadKg, else lastBestSet.loadKg) as the current gym makes it (ADR-032) — the lightest it makes within
            the step, and where it makes none inside the step, its next load down. Absent with no load to start from, or
            nothing lighter (the bottom of the rack or the bar).
        heavierLoadKg:
          type: number
          exclusiveMinimum: 0
          description: |
            The counterpart of lighterLoadKg: one load step over the load the session starts from, the heaviest the current
            gym makes within that step, never past it. Absent with no load to start from, or nothing heavier inside the
            step. First-session calibration on a move with no nextLoadKg does not use it: see calibrationStepKg.
        calibrationStepKg:
          type: number
          exclusiveMinimum: 0
          description: |
            First-session calibration on a move with no nextLoadKg (K-960, ADR-075 Ek 1): the region's load step (H3 B4).
            After a set logged with calibration_rir_min reps left or more (2+), the phone offers the load just logged plus
            this step, rounded to the gym with the shared load steps (the warm-ups' path, K-417). Present only while the
            move has no nextLoadKg.
        lastBestSet:
          type: object
          description: |
            The best working set of this move's last session before today (heaviest, then most reps, then fewest left):
            "Beat last time". Absent before the move's first session.
          required: [loadKg, reps]
          properties:
            loadKg:
              type: number
              minimum: 0
            reps:
              type: integer
              minimum: 1
            rir:
              type: integer
              minimum: 0
        nextLoadAtTopKg:
          type: number
          exclusiveMinimum: 0
          description: |
            The load the next session gets once every set reaches the top of the range (double progression, K-109), as
            the gym makes it: "2 more and it's 105 kg". Absent with no nextLoadKg, on a move not load-tracked, while the
            load is held, or where no heavier load is in reach.
        swapOptions:
          type: array
          description: |
            The moves this one can be swapped for (K-964, ADR-073 #6): the catalog's alternatives, then the moves of the same
            primary muscle and kind (G6 K-35), each the current gym has the equipment for (ADR-032; any without a gym), none
            already on the day. Empty for the user's own move. This server always sends it.
          items:
            type: string
    RepRange:
      type: object
      description: |
        min < max, a range to climb in (double progression); or min = max, a fixed rep target (5 x 5, K-991): the engine
        adds load once every work set reaches it, the reps stay. A generated program always has a range. max at most 100.
      required: [min, max]
      properties:
        min:
          type: integer
          minimum: 1
        max:
          type: integer
          minimum: 1
    OwnProgram:
      type: object
      description: |
        The user's own program (K-211). Limits are keel.training's: a day's weekday is used once; exercises come from
        /v1/exercises or are the user's own moves (/v1/custom-exercises, ADR-035 Ek 1: no target, not reviewed; another
        user's move is VALIDATION_FAILED); reps.max is at least reps.min (equal: a fixed rep target, K-991) and at most 100.
      required: [days]
      properties:
        days:
          type: array
          minItems: 1
          maxItems: 7
          items:
            type: object
            required: [name, exercises]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 60
              weekday:
                $ref: "#/components/schemas/Weekday"
              exercises:
                type: array
                minItems: 1
                maxItems: 20
                items:
                  type: object
                  required: [exerciseId, sets, reps]
                  properties:
                    exerciseId:
                      type: string
                    sets:
                      type: integer
                      minimum: 1
                      maximum: 20
                    reps:
                      $ref: "#/components/schemas/RepRange"
    ProgramEdit:
      type: object
      description: The program as the user edited it (PATCH /v1/program), every day in order.
      required: [days]
      properties:
        days:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: "#/components/schemas/EditedProgramDay"
    EditedProgramDay:
      type: object
      required: [exercises]
      properties:
        id:
          type: string
          format: uuid
          description: The program's day (ProgramDay.id); absent for a new day.
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: A new name; absent keeps the day's own (a new day needs one).
        weekday:
          $ref: "#/components/schemas/Weekday"
        exercises:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/EditedExercise"
    EditedExercise:
      type: object
      required: [exerciseId, sets, reps]
      properties:
        id:
          type: string
          format: uuid
          description: The program's row of the move (PlannedExercise.id); absent for a new move.
        exerciseId:
          type: string
        sets:
          type: integer
          minimum: 1
          maximum: 20
        reps:
          $ref: "#/components/schemas/RepRange"
    StartingWeights:
      type: object
      description: |
        The loads an experienced user lifts about 8 times (ADR-072 #5), in kg (ADR-029). Each becomes the first target of
        its move on every day of the current program it is planned on: the nearest load the current gym makes (ADR-032; as
        given without a gym, or without word on that equipment), at the bottom of the rep range. Each move once, planned
        in the program, and one whose load the engine progresses (a compound move; an isolation move has no target).
        An empty list clears the starting weights.
      required: [weights]
      properties:
        weights:
          type: array
          items:
            type: object
            required: [exerciseId, kg]
            properties:
              exerciseId:
                type: string
              kg:
                type: number
                exclusiveMinimum: 0
                maximum: 1000
                description: At most 2 decimals.
    ProgramRequest:
      type: object
      required: [trainingDays]
      properties:
        trainingDays:
          type: array
          description: 1 to 6 days; seven leave no rest day (G1 K-70).
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Weekday"
    NewWorkout:
      type: object
      required: [clientId, startedAt]
      properties:
        clientId:
          $ref: "#/components/schemas/ClientId"
        startedAt:
          type: string
          format: date-time
        programDayId:
          type: string
          format: uuid
    WorkoutFinish:
      type: object
      description: |
        Finishing a workout of a program day sets each planned move's next load and reps (K-217, double progression).
        The moves whose form was not clean keep their load and reps (G6 K-31); each id once, from the catalog or one of
        the user's own moves (K-424: accepted, no target to hold), else VALIDATION_FAILED.
      required: [endedAt]
      properties:
        endedAt:
          type: string
          format: date-time
        uncleanExerciseIds:
          type: array
          uniqueItems: true
          items:
            type: string
        note:
          type: string
          maxLength: 500
          description: |
            The session's note in the user's own words (K-422). Kept without outer spaces; only spaces is no note (absent).
            Over 500 characters, or a NUL character, is VALIDATION_FAILED, never cut. A later finish without a note keeps
            the one given; with one, replaces it. Never logged; not sent to an AI without its consent (V2).
        pausedSeconds:
          type: integer
          minimum: 0
          description: |
            How long the session was paused (K-998, ADR-075 #5: Pause stops the time). More than endedAt − startedAt is
            VALIDATION_FAILED. Absent: 0, or, on a later finish, the one given before.
    Workout:
      type: object
      required: [id, clientId, startedAt, sets]
      properties:
        id:
          type: string
          format: uuid
        clientId:
          $ref: "#/components/schemas/ClientId"
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        programDayId:
          type: string
          format: uuid
        note:
          type: string
          description: The session's note, given at the finish (WorkoutFinish.note).
        pausedSeconds:
          type: integer
          minimum: 0
          description: How long the session was paused, given at the finish (WorkoutFinish.pausedSeconds); 0 when never. This server always sends it.
        sets:
          type: array
          items:
            $ref: "#/components/schemas/LoggedSet"
        importedFrom:
          description: Present only on a session imported from another app's export (K-615); the engine never reads it.
          allOf:
            - $ref: "#/components/schemas/ImportSource"
        setsNextTargets:
          type: boolean
          description: |
            On a finished session of the program only: whether adding or deleting one of its sets can move a target of its
            day — a target that came from it or an older session, or a move with no target yet. The target is then derived
            again from what the session holds, with the finish's answer on form (K-432); a target a newer session set stays.
    ImportSource:
      type: string
      description: The app an imported session came from (K-615).
      enum: [STRONG, HEVY]
    WorkoutImport:
      type: object
      required: [source, workouts]
      properties:
        source:
          $ref: "#/components/schemas/ImportSource"
        workouts:
          type: array
          minItems: 1
          maxItems: 20
          description: At most import_workouts_per_request (data/parameters/import.json) sessions; each clientId once.
          items:
            $ref: "#/components/schemas/ImportedWorkout"
    ImportedWorkout:
      type: object
      required: [clientId, startedAt, endedAt, sets]
      properties:
        clientId:
          $ref: "#/components/schemas/ClientId"
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          description: Not before startedAt.
        sets:
          type: array
          minItems: 1
          maxItems: 200
          description: In the order they were done.
          items:
            $ref: "#/components/schemas/ImportedSet"
    ImportedSet:
      type: object
      description: |
        A set as the file had it, its move mapped on the phone: a catalog move or one of the user's own. The load follows
        the move's Equipment (a DUMBBELL move: one dumbbell — the phone asked how the file counted them); a BODYWEIGHT move
        is 0. No reps in reserve and no side: the file does not say.
      required: [exerciseId, setType, loadKg, reps]
      properties:
        exerciseId:
          type: string
        setType:
          type: string
          enum: [WARM_UP, WORKING]
        loadKg:
          type: number
          minimum: 0
          maximum: 1000
          description: At most 2 decimals.
        reps:
          type: integer
          minimum: 1
          maximum: 100
    WorkoutImportResult:
      type: object
      required: [imported, alreadyThere]
      properties:
        imported:
          type: integer
          minimum: 0
        alreadyThere:
          type: integer
          minimum: 0

    SetType:
      type: string
      description: |
        Only WORKING sets count toward effort and estimated 1RM (K-218). FAILURE is a set taken to failure: its rir is 0
        or absent.
      enum: [WARM_UP, WORKING, DROP, FAILURE]
    Side:
      type: string
      description: A unilateral exercise is logged per side (LEFT or RIGHT, required); any other exercise BOTH or absent.
      enum: [BOTH, LEFT, RIGHT]
    NewSet:
      type: object
      description: |
        One set. exerciseId may differ from the plan (a swap, e.g. pull-ups for lat pulldown). A
        BODYWEIGHT_PLUS_EXTERNAL exercise logs the added load in loadKg (0 without); a BODYWEIGHT exercise always 0. The
        engine adds the bodyweight. What loadKg is otherwise follows the exercise's Equipment (a DUMBBELL move: one
        dumbbell). A set its exercise cannot have (see SetType, Side) is 400.
      required: [clientId, exerciseId, setType, reps, loadKg]
      properties:
        clientId:
          $ref: "#/components/schemas/ClientId"
        exerciseId:
          type: string
        setType:
          $ref: "#/components/schemas/SetType"
        loadKg:
          type: number
          minimum: 0
          maximum: 1000
          description: At most 2 decimals.
        reps:
          type: integer
          minimum: 0
          maximum: 100
        rir:
          type: integer
          minimum: 0
          maximum: 10
          description: Reps left in the tank; absent when not given.
        side:
          $ref: "#/components/schemas/Side"
        supersetId:
          type: string
          format: uuid
          description: |
            The superset the set belongs to (K-424, ADR-035): the sets of moves done back to back carry the same id, made by
            the phone. Absent for a set on its own.
        note:
          type: string
          maxLength: 500
          description: |
            The user's own words on this set (K-422). Kept without outer spaces; only spaces is no note (absent). Over 500
            characters, or a NUL character, is VALIDATION_FAILED, never cut. Never logged; not sent to an AI without its
            consent (V2).
    NewCustomExercise:
      type: object
      required: [clientId, name, kind, load, equipment, unilateral]
      properties:
        clientId:
          $ref: "#/components/schemas/ClientId"
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed; at most 60 code points, no NUL.
        kind:
          type: string
          enum: [COMPOUND, ISOLATION]
        load:
          type: string
          enum: [EXTERNAL, BODYWEIGHT, BODYWEIGHT_PLUS_EXTERNAL]
        equipment:
          $ref: "#/components/schemas/Equipment"
        unilateral:
          type: boolean
    CustomExercise:
      allOf:
        - $ref: "#/components/schemas/NewCustomExercise"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              description: '"custom:<uuid>": what a set names it by.'
    LoggedSet:
      allOf:
        - $ref: "#/components/schemas/NewSet"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid

    WorkoutSummary:
      type: object
      required: [workoutId, liftedKg, workingSets, marks, moves, weekOf, muscles]
      properties:
        workoutId:
          type: string
          format: uuid
        moves:
          type: array
          description: |
            "What moved" (ADR-075 #7, K-1008): each move of the session, in the order first done, its best working set
            against its best in the last earlier session of the same program day (the session liftedChangePercent compares
            with), or a move that session did not have against its own last session (MoveChange). This server always sends it.
          items:
            $ref: "#/components/schemas/MoveChange"
        minutes:
          type: integer
          minimum: 0
          description: |
            The session's active time (K-998): endedAt − startedAt − pausedSeconds, in whole minutes rounded half up.
            Absent while the session is open, and once closed by itself (K-961: endedAt = startedAt, its length unknown).
        liftedKg:
          type: number
          minimum: 0
          description: Load × reps over the working sets, the load as logged (a bodyweight move's added load).
        liftedChangePercent:
          type: integer
          description: |
            liftedKg against the last earlier session of the same program day (programDayId) that has a working set done
            (at least one rep: a session of skipped sets only is none), in
            whole percent (rounded half up; negative when less). Absent without one, or when it lifted 0 kg: a program
            saved anew has new days, a new basis (ADR-075 Ek 2); the review's changes keep the days.
        workingSets:
          type: integer
          minimum: 0
          description: A one-sided move's sets count once per set, as the side that did fewer (the program's sets are per side).
        marks:
          type: array
          description: One per move of the session that set a record or its baseline, in the order first done.
          items:
            $ref: "#/components/schemas/SetMark"
        weekOf:
          type: string
          format: date
          description: The Monday of the workout's week, on the user's calendar; the muscles' shares are of this week.
        muscles:
          type: array
          description: |
            The primary muscles this session trained, with their week as it stood when the session started (later
            sessions not counted) — the one muscle map, ADR-078 #4.
          items:
            $ref: "#/components/schemas/MuscleSets"
    MoveChange:
      type: object
      description: |
        A move's best working set this session (the heaviest, then the most reps, then the fewest left; a set of no reps
        never counts; sides are one history; the load as logged, a bodyweight move's added load) against its best in the
        last earlier session of the same program day with a set done; a move that session did not have (swapped in today,
        swapped out then, added, skipped) against its own last session on any day (it has its own history, K-964). LOAD: another load, `by` the difference in kg (negative when
        lighter). REPS: the same load, `by` the difference in reps (negative when fewer). SAME: the same load and reps.
        HELD: the same load of a compound move while the weekly call holds the load. FIRST: the move has no earlier
        session at all. No estimated max (B10).
      required: [exerciseId, best, change]
      properties:
        exerciseId:
          type: string
        best:
          type: object
          required: [loadKg, reps]
          properties:
            loadKg:
              type: number
              minimum: 0
            reps:
              type: integer
              minimum: 1
        change:
          type: string
          enum: [LOAD, REPS, SAME, HELD, FIRST]
        by:
          type: number
          description: LOAD in kg, REPS in reps; absent otherwise.
    SetMark:
      type: object
      description: |
        RECORD (ADR-075 Ek 2): a working set no earlier working set of the move dominates (none at least as heavy with
        at least as many reps), its own session's earlier sets included: the first time at a load, or more reps than ever
        at a load at least that heavy. A tie is none. When several sets of the session are records, the heaviest (then
        most reps, then fewest left). Sides are one history. BASELINE: the move's first session, its best set.
      required: [exerciseId, kind, loadKg, reps]
      properties:
        exerciseId:
          type: string
        kind:
          type: string
          enum: [BASELINE, RECORD]
        loadKg:
          type: number
          minimum: 0
        reps:
          type: integer
          minimum: 1
        rir:
          type: integer
          minimum: 0
        side:
          $ref: "#/components/schemas/Side"
    MuscleSets:
      type: object
      description: |
        A primary muscle's week (the catalog's first muscle): the sets this week's program plans (a lighter week's
        fewer, a week off's none) and the working sets done (a one-sided move's once per set, as the side that did
        fewer), each a share of targetSets — weekly_sets_per_muscle, or arm_weekly_sets_min
        for an arm — capped at 1 and rounded down to 2 decimals.
      required: [muscle, plannedSets, doneSets, targetSets, plannedShare, doneShare]
      properties:
        muscle:
          type: string
        plannedSets:
          type: integer
          minimum: 0
        doneSets:
          type: integer
          minimum: 0
        targetSets:
          type: integer
          minimum: 1
        plannedShare:
          type: number
          minimum: 0
          maximum: 1
        doneShare:
          type: number
          minimum: 0
          maximum: 1
    TrainingProgress:
      type: object
      required: [weekOf, muscles, lifts, strongerLifts, trackedLifts]
      properties:
        weekOf:
          type: string
          format: date
          description: This week's Monday on the user's calendar.
        muscles:
          type: array
          description: Every muscle planned or trained this week, alphabetical.
          items:
            $ref: "#/components/schemas/MuscleSets"
        lifts:
          type: array
          description: The current program's moves with a working set, in program order.
          items:
            $ref: "#/components/schemas/LiftProgress"
        strongerLifts:
          type: integer
          minimum: 0
          description: The lifts with at least one record after their baseline ("Stronger on 4 of 5 lifts").
        trackedLifts:
          type: integer
          minimum: 0
          description: The number of lifts.
    LiftProgress:
      type: object
      required: [exerciseId, baseline, best, stronger, weeks]
      properties:
        exerciseId:
          type: string
        baseline:
          $ref: "#/components/schemas/DatedSet"
        best:
          allOf:
            - $ref: "#/components/schemas/DatedSet"
          description: The last record, or the baseline before the first one.
        stronger:
          type: boolean
          description: At least one record after the baseline (ADR-075 Ek 2).
        weeks:
          type: array
          description: Each Monday week's best set, oldest first (the strength chart).
          items:
            type: object
            required: [weekOf, loadKg, reps, held]
            properties:
              weekOf:
                type: string
                format: date
              loadKg:
                type: number
                minimum: 0
              reps:
                type: integer
                minimum: 1
              rir:
                type: integer
                minimum: 0
              held:
                type: boolean
                description: The weekly call held the load on a day of this week (K-217); always false for an isolation move.
        effort:
          $ref: "#/components/schemas/EffortLine"
    DatedSet:
      type: object
      required: [loadKg, reps, day]
      properties:
        loadKg:
          type: number
          minimum: 0
        reps:
          type: integer
          minimum: 1
        rir:
          type: integer
          minimum: 0
        day:
          type: string
          format: date
          description: The session's day on the user's calendar.
    EffortLine:
      type: object
      description: |
        The effort line's facts (ADR-078 #2), from each session's best set; the first kind that holds, in this order.
        STUCK ("Stuck at 72.5 kg for 3 sessions. Held this week."): stalled as the weekly call counts it (plateau_sessions;
        sessions logged in the app since the current program was made, imported ones not) — loadKg, sessions, held (the
        weekly call holds the load now; compound moves only). The other kinds read the whole history, imported too.
        EASIER ("Same 100 kg, now with 1 rep left."): the last session the same load and reps as the one before, with
        more left — loadKg, reps, repsLeft, repsLeftBefore. REPS_RISING: the last sessions at one load, more reps now
        than at the first — loadKg, repsGained, since (the first session at the load), sessions, weeks (whole weeks to
        the last). Absent when none holds.
      required: [kind, loadKg]
      properties:
        kind:
          type: string
          enum: [STUCK, EASIER, REPS_RISING]
        loadKg:
          type: number
          minimum: 0
        reps:
          type: integer
          minimum: 1
        sessions:
          type: integer
          minimum: 1
        held:
          type: boolean
        repsLeft:
          type: integer
          minimum: 0
        repsLeftBefore:
          type: integer
          minimum: 0
        repsGained:
          type: integer
          minimum: 1
        since:
          type: string
          format: date
        weeks:
          type: integer
          minimum: 0

    # ── check-in ─────────────────────────────────────────────────────────────────────────────────────────────
    QuestionKind:
      type: string
      description: |
        What the engine can be missing (its CheckIn) plus the scales the app asks with. Adherence is not asked: it is the
        week's consistency, counted from the logs (ADR-020 L-6). WEEK1_FEEL: "How did week 1 feel?" (ADR-077 #4).
      enum: [TRAINING, RECOVERY, SLEEP_QUALITY, ENERGY, LOOK, WAIST, APPETITE, CYCLE_STOPPED, STATE_STILL, WEEK1_FEEL]
    Question:
      type: object
      required: [kind, format, copyKey, reasonCopyKey]
      properties:
        kind:
          $ref: "#/components/schemas/QuestionKind"
        format:
          type: string
          enum: [SCALE_1_10, CHOICE, CENTIMETRES]
        choices:
          type: array
          description: CHOICE only — the allowed answers.
          items:
            type: string
        copyKey:
          type: string
        reasonCopyKey:
          type: string
          description: Why this is asked, shown next to the question (U9).
    CheckIn:
      type: object
      required: [weekOf, questions, answered]
      properties:
        weekOf:
          type: string
          format: date
          description: The check-in day of this week, in the user's time zone.
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        answered:
          type: boolean
    Answer:
      type: object
      description: One answer; exactly the field the question's format names is set.
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/QuestionKind"
        scale:
          type: integer
          minimum: 1
          maximum: 10
        choice:
          type: string
        cm:
          type: number
          exclusiveMinimum: 0
    CheckInAnswers:
      type: object
      required: [clientId, weekOf, answers]
      properties:
        clientId:
          $ref: "#/components/schemas/ClientId"
        weekOf:
          type: string
          format: date
          description: The check-in day these answers belong to (CheckIn.weekOf).
        answers:
          type: array
          items:
            $ref: "#/components/schemas/Answer"

    Prompt:
      type: object
      required: [rule, key, copyKey, choices, source]
      properties:
        rule:
          type: string
          enum: [steps_dropped, sessions_missed, loads_dropped, hunger_first_days]
        key:
          type: string
          format: date
          description: The occurrence it is asked for (its week's Monday, the first missed day, the cut's first day).
        copyKey:
          type: string
        choices:
          type: array
          items:
            type: string
        source:
          $ref: "#/components/schemas/Source"
    PromptAnswer:
      type: object
      required: [key, choice]
      properties:
        key:
          type: string
          format: date
        choice:
          type: string
    PromptReply:
      type: object
      properties:
        replyCopyKey:
          type: string
          description: The words the answer gets back, when it gets any.
    StateKind:
      type: string
      description: What life brought (L3 §4.2). Words in en.json › state.kind.<kind lowercased>.
      enum: [TRAVELING, SICK, PAIN, BUSY, NEW_GYM]
    DeclaredState:
      type: object
      required: [kind, since]
      properties:
        kind:
          $ref: "#/components/schemas/StateKind"
        since:
          type: string
          format: date
          description: Its first day, on the user's calendar.
        until:
          type: string
          format: date
          description: Its last day, when the user gave one; absent until they are back.
        busyDose:
          $ref: "#/components/schemas/BusyDose"
    BusyDose:
      type: object
      description: |
        A busy week's least dose (K-528, ADR-038 #7; H9 §2): with BUSY only — what keeps strength and muscle when the week
        holds little. A suggestion; the program's targets do not change (U2).
      required: [sessions, setsPerExercise, keepLoad]
      properties:
        sessions:
          type: integer
          minimum: 1
          description: Sessions in the week.
        setsPerExercise:
          type: integer
          minimum: 1
          description: Sets of each of the day's exercises.
        keepLoad:
          type: boolean
          description: The usual weights (intensity is what maintains).
    NewDeclaredState:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/StateKind"
        until:
          type: string
          format: date

    # ── decision (the engine's Decision, field for field — ContractTests) ────────────────────────────────────
    Consistency:
      type: object
      required: [weekOf, training, protein, steps, weighIns, planned, done, record]
      properties:
        weekOf:
          type: string
          format: date
          description: The Monday this week began.
        training:
          $ref: "#/components/schemas/ActionCount"
        protein:
          $ref: "#/components/schemas/ActionCount"
        steps:
          $ref: "#/components/schemas/ActionCount"
        weighIns:
          $ref: "#/components/schemas/ActionCount"
        planned:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: done over planned, rounded down; absent while nothing is planned.
        paused:
          type: boolean
          description: |
            Present (true) when a state was declared on a day of this week (K-516, ADR-038): the week is neither on track
            nor missed, and the record leaves it out.
        weightChange:
          $ref: "#/components/schemas/WeightChange"
        record:
          type: object
          required: [onTrackWeeks, countedWeeks, currentRun, forgivenWeeks]
          description: Weeks over since the first call; a week is on track at on_track_min_ratio (K-111). Never reset.
          properties:
            onTrackWeeks:
              type: integer
              minimum: 0
            countedWeeks:
              type: integer
              minimum: 0
            currentRun:
              type: integer
              minimum: 0
              description: On-track weeks in a row; one missed week is forgiven, two in a row end the run.
            forgivenWeeks:
              type: integer
              minimum: 0
              description: |
                The missed weeks a run forgave, over the whole record (K-608): each lone miss after an on-track week, counted
                when forgiven — never reset, never taken back by a second miss (which ends the run).
    WeightChange:
      type: object
      description: |
        The period's weight change (K-988, ADR-078 #2, Ek 1, U8): today's trend weight (the trend_display_days average
        ending today) minus the one ending on `since`, the day the record began (the first call); never one day's weigh-in.
        Below zero is a loss. `direction`: STEADY while the change is within the engine's flat_margin_kg (the scale's noise,
        as a call reads a flat week), else DOWN or UP; the app writes the sentence from it ("Down 3.8 kg."), the server
        sends none. Absent unless each window holds min_weighins_per_week weigh-ins (scaled to the window) and they do not
        overlap. Weigh-ins typed or read from Apple Health count; history imported once (IMPORT) does not.
      required: [kg, direction, since]
      properties:
        kg:
          type: number
        direction:
          type: string
          enum: [DOWN, UP, STEADY]
        since:
          type: string
          format: date
    ActionCount:
      type: object
      description: One kind of planned action this week; done is counted up to planned.
      required: [planned, done]
      properties:
        planned:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
    Decision:
      type: object
      required: [id, madeOn, action, reasons, confidence, nextReview, copyKey, application, declinable]
      properties:
        id:
          type: string
          format: uuid
        madeOn:
          type: string
          format: date
        action:
          $ref: "#/components/schemas/Action"
        reasons:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Reason"
        confidence:
          $ref: "#/components/schemas/Confidence"
        nextReview:
          type: string
          format: date
        copyKey:
          type: string
          description: Where the words for this call live in en.json.
        safety:
          type: boolean
          description: |
            Present (true) only on the hard stop, which is kept and shown as its change of phase to BULK so the record
            does not give away the answer that led to it (K-228, ADR-028 #24, GDPR Art. 9). It cannot be undone.
        readTrendKg:
          type: number
          description: |
            In the ledger (GET /v1/decisions) only: the latest weekly mean of the window the call read (K-611), so the
            ledger can say what came after it — never why. Absent when the call read no window.
        application:
          $ref: "#/components/schemas/Application"
        declinable:
          type: boolean
          description: |
            Whether "Keep last week's plan" may be offered now (K-963, ADR-077 #3), decided by the server: the latest call,
            PENDING or APPLIED, and not resting on the safety net (U13; the phone does not know its rules). False for a
            call that changes nothing, an older one, one undone or already declined. POST /v1/decisions/{id}/decline.
    DecisionBasis:
      type: object
      description: |
        The rows a call read (K-519). Weights in kilograms, unrounded (the phone rounds once, ADR-029). A row the call did
        not read is absent.
      required: [phase, weeks, answers]
      properties:
        phase:
          $ref: "#/components/schemas/Phase"
        weeks:
          type: array
          description: |
            The decision window's weeks, oldest first — only when the call read the window (the weekly spine ran); empty for
            a call that stopped before it (not enough data yet, a safety stop, a declared week, a gate).
          items:
            type: object
            required: [ends, kg]
            properties:
              ends:
                type: string
                format: date
                description: The week's last day.
              kg:
                type: number
                description: The mean of the week's weigh-ins.
        changeKgPerWeek:
          type: number
          description: From the window's first week to its latest, per week; negative is down. Absent when the window was not read.
        adherence:
          type: number
          minimum: 0
          maximum: 1
          description: The share of the planned actions done, as the call counted it.
        adherenceCount:
          type: object
          description: >-
            The planned actions and the ones done that the share is made of (K-526, ADR-041 #63). Kept by calls made since;
            absent for an older call — never made up from the share.
          required: [done, planned]
          properties:
            done:
              type: integer
              minimum: 0
            planned:
              type: integer
              minimum: 1
        answers:
          type: object
          description: The check-in answers given; one left open is absent.
          properties:
            look:
              type: string
              enum: [BETTER, SAME, WORSE]
            training:
              type: string
              enum: [IMPROVING, STABLE, DECLINING]
            recovery:
              type: string
              enum: [GOOD, POOR]
            waist:
              type: string
              enum: [DOWN, FLAT, UP]
            appetite:
              type: string
              enum: [NORMAL, GONE]
            week1Feel:
              type: string
              description: How the first week felt (ADR-077 #4), on the call that closes it, so the screen can say it back.
              enum: [TOO_MUCH, ABOUT_RIGHT, COULD_DO_MORE]
        training:
          type: object
          description: Where the most-stalled compound lift stood (K-110).
          required: [stalledSessions, weeksLoadHeld, monthsStalled, restedLastWeek, loadsBelowLastWeek, weeksPlanMissed]
          properties:
            stalledSessions:
              type: integer
            weeksLoadHeld:
              type: integer
            monthsStalled:
              type: integer
            restedLastWeek:
              type: boolean
            loadsBelowLastWeek:
              type: boolean
            weeksPlanMissed:
              type: integer
        pausedBy:
          $ref: "#/components/schemas/StateKind"
        signals:
          type: array
          description: |
            What else the data the call read says, beside the call and never changing it (K-603): the weight steady over
            the window with the waist down past its error (weight_steady_waist_down, H1 §1.6). Absent when there is none.
          items:
            $ref: "#/components/schemas/Reason"
    WhatIf:
      type: object
      required: [example, scenarios]
      properties:
        example:
          type: boolean
          enum: [true]
          description: Always true — these are the rules on example data, not the user's (K-610).
        scenarios:
          type: array
          description: Every combination of next week, in a fixed order; each the engine's call on that example week.
          items:
            type: object
            required: [when, decision]
            properties:
              when:
                type: object
                required: [trend, adherence, training]
                properties:
                  trend:
                    type: string
                    enum: [TOWARD_GOAL, FLAT]
                  adherence:
                    type: string
                    enum: [ON_TRACK, UNDER]
                  training:
                    type: string
                    enum: [HOLDING, DROPPING]
              decision:
                $ref: "#/components/schemas/ExampleCall"
    Projection:
      type: object
      required: [shown]
      properties:
        shown:
          type: boolean
        reason:
          type: string
          description: |
            Only when not shown. UNDER_AGE · SAFETY_HOLD (the safety net holds the plan, U13) · TOO_EARLY (no plan yet, or first
            and last weigh-in under 28 days apart) · NO_RECENT_WEIGHT (none this week) · NO_DIRECTION (the plan does not move
            toward a goal by at least 100 kcal a day) · LOW_BMI_LOSS (under BMI 20 losing is not projected) · OUTSIDE_MODEL (a body the
            energy balance model does not reach) · NO_SAFE_SCENARIO (every scenario would lose
            faster than the weekly cap or reach under BMI 18.5).
          enum: [UNDER_AGE, SAFETY_HOLD, TOO_EARLY, NO_RECENT_WEIGHT, NO_DIRECTION, LOW_BMI_LOSS, OUTSIDE_MODEL, NO_SAFE_SCENARIO]
        todayKg:
          type: number
          description: Only when shown. Today's trend weight (7-day mean), at most 1 decimal.
        direction:
          type: string
          enum: [LOSS, GAIN]
          description: Only when shown.
        "on":
          type: string
          format: date
          description: Only when shown. The day the scenarios are for.
        scenarios:
          type: array
          description: Only when shown; one to three, in order of the share kept. A scenario that would not be safe is left out.
          items:
            type: object
            required: [adherence, lowKg, kg, highKg]
            properties:
              adherence:
                type: number
                description: The share of the time the plan is kept (0.6, 0.8, 0.95) — a behaviour, never a promised result.
              lowKg:
                type: number
                description: At most 1 decimal.
              kg:
                type: number
                description: The model's number, at most 1 decimal.
              highKg:
                type: number
                description: At most 1 decimal.
    ExampleCall:
      type: object
      description: The engine's call on an example week — a Decision without an id, a day or an application (never kept).
      required: [action, reasons, confidence, nextReview, copyKey]
      properties:
        action:
          $ref: "#/components/schemas/Action"
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/Reason"
        confidence:
          $ref: "#/components/schemas/Confidence"
        nextReview:
          type: string
          format: date
        copyKey:
          type: string
        safety:
          type: boolean
    Application:
      type: object
      description: |
        Whether the call has changed the plan (K-216). A call that changes nothing is NOT_NEEDED; appliedAt once applied,
        undoneAt once undone. DECLINED (K-963, ADR-077 #3): last week's plan was kept and the call stays on record, not
        applied; declinedAt while it is, and appliedAt with it when it had been applied before. Used after all, it is
        APPLIED again. The first week's training-day calls (ADD_TRAINING_DAY, MOVE_MISSED_SESSIONS) are NOT_NEEDED and
        not declinable: the days are the user's to pick, with the training days, not through apply (ADR-077 Ek 1).
      required: [state]
      properties:
        state:
          type: string
          enum: [NOT_NEEDED, PENDING, APPLIED, UNDONE, DECLINED]
        appliedAt:
          type: string
          format: date-time
        undoneAt:
          type: string
          format: date-time
        declinedAt:
          type: string
          format: date-time
    DecisionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
        next:
          type: string
          description: The cursor for the next (older) page; absent on the last page.
    FirstWeeks:
      type: object
      required: [week, risk, readsRisk, training]
      properties:
        training:
          type: boolean
          description: Whether the plan asks for training — the phone's words for a risky week, as the content's (K-521).
        readsRisk:
          type: boolean
          description: |
            Whether this week reads the risk at all (weeks after first_weeks_risk_from, the week just over not paused): the phone
            adds its own signal — the app not opened in the week just over, known only there (ADR-041 #66) — in the same weeks (K-521).
        week:
          type: integer
          minimum: 1
          maximum: 9
        contentKey:
          type: string
          description: The week's words in the copy file; absent in week 1 and week 9.
        firstCallOn:
          type: string
          format: date
          description: |
            The first call's day on the user's calendar (K-990, ADR-077 Ek 2): the first check-in day after the day
            onboarding finished — within seven days of it, never on it (ADR-071 #1); today
            once that day has passed without a call (the check-in is open). Absent once the first call is made. The
            phone shows it and counts the days to it; it never works it out.
        risk:
          type: array
          items:
            $ref: "#/components/schemas/Reason"
    Reason:
      type: object
      required: [rule, source]
      properties:
        rule:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        source:
          $ref: "#/components/schemas/Source"
    Source:
      type: object
      description: >-
        What kind of source a rule rests on (U14): coaching experience, the literature, or a product decision. Where it is
        written down stays on the server with the kept call, for audit (K-523, ADR-041 #72).
      required: [tag]
      properties:
        tag:
          $ref: "#/components/schemas/SourceTag"
    SourceTag:
      type: string
      enum: [EXPERIENCE, LITERATURE, PRODUCT]
    Confidence:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    Phase:
      type: string
      enum: [CUT, BULK]
    Action:
      description: What the engine decided (the engine's sealed Action); `type` names the kind, the rest is its data.
      oneOf:
        - $ref: "#/components/schemas/NoDecisionYet"
        - $ref: "#/components/schemas/Continue"
        - $ref: "#/components/schemas/AdjustCalories"
        - $ref: "#/components/schemas/IncreaseCalories"
        - $ref: "#/components/schemas/ChangeMovement"
        - $ref: "#/components/schemas/FixTraining"
        - $ref: "#/components/schemas/FixRecovery"
        - $ref: "#/components/schemas/FixAdherence"
        - $ref: "#/components/schemas/HardStop"
        - $ref: "#/components/schemas/StopLoadIncrease"
        - $ref: "#/components/schemas/Deload"
        - $ref: "#/components/schemas/FullRestWeek"
        - $ref: "#/components/schemas/MiniCut"
        - $ref: "#/components/schemas/ChangePhase"
        - $ref: "#/components/schemas/AddTrainingDay"
        - $ref: "#/components/schemas/MoveMissedSessions"
      discriminator:
        propertyName: type
        mapping:
          NO_DECISION_YET: "#/components/schemas/NoDecisionYet"
          CONTINUE: "#/components/schemas/Continue"
          ADJUST_CALORIES: "#/components/schemas/AdjustCalories"
          INCREASE_CALORIES: "#/components/schemas/IncreaseCalories"
          CHANGE_MOVEMENT: "#/components/schemas/ChangeMovement"
          FIX_TRAINING: "#/components/schemas/FixTraining"
          FIX_RECOVERY: "#/components/schemas/FixRecovery"
          FIX_ADHERENCE: "#/components/schemas/FixAdherence"
          HARD_STOP: "#/components/schemas/HardStop"
          STOP_LOAD_INCREASE: "#/components/schemas/StopLoadIncrease"
          DELOAD: "#/components/schemas/Deload"
          FULL_REST_WEEK: "#/components/schemas/FullRestWeek"
          MINI_CUT: "#/components/schemas/MiniCut"
          CHANGE_PHASE: "#/components/schemas/ChangePhase"
          ADD_TRAINING_DAY: "#/components/schemas/AddTrainingDay"
          MOVE_MISSED_SESSIONS: "#/components/schemas/MoveMissedSessions"
    NoDecisionYet:
      type: object
      description: Not enough data, or the window is not full — said, not guessed (U3).
      required: [type]
      properties:
        type:
          const: NO_DECISION_YET
    Continue:
      type: object
      required: [type]
      properties:
        type:
          const: CONTINUE
    AdjustCalories:
      type: object
      description: One calorie step on the daily target (K-107), e.g. -500 on a stalled cut, +250 on a stalled bulk.
      required: [type, kcalPerDay]
      properties:
        type:
          const: ADJUST_CALORIES
        kcalPerDay:
          type: integer
          not:
            const: 0
    IncreaseCalories:
      type: object
      description: The safety net narrowing a deficit (U13, K-104).
      required: [type, kcalPerDay]
      properties:
        type:
          const: INCREASE_CALORIES
        kcalPerDay:
          type: integer
          minimum: 1
    ChangeMovement:
      type: object
      required: [type]
      properties:
        type:
          const: CHANGE_MOVEMENT
    FixTraining:
      type: object
      required: [type]
      properties:
        type:
          const: FIX_TRAINING
    FixRecovery:
      type: object
      required: [type]
      properties:
        type:
          const: FIX_RECOVERY
    FixAdherence:
      type: object
      required: [type]
      properties:
        type:
          const: FIX_ADHERENCE
    HardStop:
      type: object
      description: "The one hard stop (U13): any deficit ends, maintenance at least, see a doctor. The engine's own kind: never kept or returned as such — a call carries it as CHANGE_PHASE to BULK with safety true (K-228)."
      required: [type]
      properties:
        type:
          const: HARD_STOP
    StopLoadIncrease:
      type: object
      required: [type]
      properties:
        type:
          const: STOP_LOAD_INCREASE
    Deload:
      type: object
      description: A lighter week; weekly sets scale by setsFactor (K-110).
      required: [type, setsFactor]
      properties:
        type:
          const: DELOAD
        setsFactor:
          type: number
          exclusiveMinimum: 0
          maximum: 1
    FullRestWeek:
      type: object
      required: [type]
      properties:
        type:
          const: FULL_REST_WEEK
    MiniCut:
      type: object
      required: [type, minWeeks, maxWeeks]
      properties:
        type:
          const: MINI_CUT
        minWeeks:
          type: integer
          minimum: 1
        maxWeeks:
          type: integer
          minimum: 1
    ChangePhase:
      type: object
      required: [type, to]
      properties:
        type:
          const: CHANGE_PHASE
        to:
          $ref: "#/components/schemas/Phase"
    AddTrainingDay:
      type: object
      description: |
        The first week's call (ADR-077 #4): every planned session done and "I could do more", so one more training day a
        week. `toDays` is the new count, one more than the user's and never below training_days_min; `idealDays` is
        training_days_ideal_min, the count it moves toward, for the words. Which day is the user's to pick.
      required: [type, toDays, idealDays]
      properties:
        type:
          const: ADD_TRAINING_DAY
        toDays:
          type: integer
          minimum: 1
        idealDays:
          type: integer
          minimum: 1
    MoveMissedSessions:
      type: object
      description: |
        The first week's call (ADR-077 #4): most of the week's sessions didn't happen, so the days that were missed move
        to days that fit; the number of training days stays. `missed` are the planned weekdays without a session, in the
        week's order; the user picks where they go.
      required: [type, missed]
      properties:
        type:
          const: MOVE_MISSED_SESSIONS
        missed:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Weekday"
    Targets:
      type: object
      description: |
        What the user follows today; each a plan number set by calls (ADR-020 L-13). Protein does not depend on calories
        and is always there; carbs and fat are absent when no split fits the target (the macro floors moved with a
        heavier trend or a birthday after the target was set). Before the first estimate there is no calorie target:
        GET /v1/targets is NOT_FOUND, and an apply or undo (a training call) answers with the steps and training days only.
      required: [stepsPerDay, trainingSessionsPerWeek]
      properties:
        targetKcal:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
        stepsPerDay:
          type: integer
        trainingSessionsPerWeek:
          type: integer
    StartingTarget:
      type: object
      description: |
        Where the plan's calories start (K-114, ADR-072 #6): the target is one number (U5: a target may be), the maintenance
        estimate it comes from is a range (U5), and the scale corrects it over observationDays (the engine's
        maintenance_observation_days for the user's sex) before the first calorie call.
      required: [targetKcal, maintenanceKcal, observationDays]
      properties:
        targetKcal:
          type: integer
          minimum: 0
        maintenanceKcal:
          $ref: "#/components/schemas/KcalRange"
        observationDays:
          type: integer
          minimum: 1

    # ── coach ────────────────────────────────────────────────────────────────────────────────────────────────
    CoachQuestion:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 2000
        decisionId:
          type: string
          format: uuid
          description: The call the question is about, if any.
    CoachAnswer:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [MODEL, DETERMINISTIC]
          description: |
            MODEL — the model classified the message (topic, and rule when the topic is about the call); the app says it in
            its own copy (ADR-043 #76): coach.topic.<topic>, and only when a rule is present decision.rule.<rule> then
            coach.answer.stands — a topic not about the call (HEALTH, OFF_TOPIC) says its own sentence and nothing of the
            call standing (U6: a doctor comes first). The model writes nothing the user reads. DETERMINISTIC — the engine's
            own words (copyKey).
        topic:
          type: string
          enum: [LESS, MORE, LATER, HUNGER, DOUBTS_DATA, FEELS_FINE, WORRY, FRUSTRATED, HEALTH, WHY, OFF_TOPIC]
          description: What the message is about, in MODEL mode only.
        rule:
          type: string
          description: |
            Which of the call's own rules answers the message (one of its reasons), in MODEL mode when the topic is about the
            call; absent for HEALTH and OFF_TOPIC.
        copyKey:
          type: string
          description: The engine's own words, in DETERMINISTIC mode (data/copy/en.json › coach.answer.*).
        call:
          $ref: "#/components/schemas/CoachCall"
    MealWords:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 500
    MealPhoto:
      type: object
      required: [image]
      properties:
        image:
          type: string
          format: byte
          description: A JPEG or PNG, base64, at most 1024 px a side and 2,500,000 bytes, its metadata dropped by the app (V1).
    MealDraft:
      type: object
      required: [mode, items]
      properties:
        mode:
          type: string
          enum: [MODEL, DETERMINISTIC]
        items:
          type: array
          items:
            $ref: "#/components/schemas/MealDraftItem"
    MealDraftItem:
      type: object
      description: |
        A food as the model read it, how much in the user's own measure, and the database's foods for it — never what it
        holds (U1), never a measure turned into grams by the model (ADR-004). From a photo (K-514) the amount is grams by
        eye with certainty ESTIMATED. The app sends `amount` as it is to /v1/food-estimates with the food the user picks
        (a measure that is not one of its servings asks for grams there).
      required: [food, amount, confident, candidates]
      properties:
        food:
          type: string
          description: The model's words for the food — no digit, no forbidden phrase.
        amount:
          $ref: "#/components/schemas/Amount"
        confident:
          type: boolean
          description: A food's name holds every word as a whole word — the first candidate is the pick; otherwise the user picks one (U5).
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/FoodMatch"
    FoodMatch:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        brand:
          type: string
    CoachCall:
      type: object
      description: The call the answer is about, as it stands (U2) — its words, and when new data looks at it again.
      required: [decisionId, copyKey, nextReview]
      properties:
        decisionId:
          type: string
          format: uuid
        copyKey:
          type: string
        nextReview:
          type: string
          format: date
