name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Gradle build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test (pending specs excluded, ADR-009)
        run: ./gradlew build --console=plain

  mobile:
    name: Mobile (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run check

  tooling:
    name: Tooling (git guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Git guard table tests (ADR-019)
        run: python3 tools/test_git_guard.py
