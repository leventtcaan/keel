parameters:
  - key: weekly_loss_cap_kg
    value: 1.0
    unit: kg_per_week
    tag: tecrube
    source: "arastirma/ham/guray/G2-kilo-verme.md#K-17"
    note: "Mutlak tavan. Yüzde tavanıyla birlikte uygulanır: min(1 kg, VA × weekly_loss_cap_pct_bodyweight)."
  - key: weekly_loss_cap_pct_bodyweight
    value: 0.01
    unit: ratio
    tag: literatur
    source: "arastirma/ham/H3-bosluk-literatur.md#B3"
    note: "Hafif kişide 1 kg tavan literatürün %43 üstüne çıkıyor (H3 Ç1); yüzde kolu kadında da bağlayıcı (J1 A7). Güray tavanını bozmaz, altında kalır."
  - key: bmr_floor_enabled
    value: true
    unit: boolean
    tag: tecrube
    source: "arastirma/ham/guray/G2-kilo-verme.md#K-11"
    note: "Kalori hedefi BMR'nin altına inmez."
  - key: rapid_loss_narrow_pct
    value: 0.08
    unit: ratio
    tag: literatur
    source: "arastirma/ham/J1-cinsiyet.md#C6"
    note: "rapid_loss_window_weeks penceresinde vücut ağırlığının %8'inden fazla kayıp → açık daraltılır + uyarı (J1 C6 ikinci kademe). Hard stop DEĞİL (ADR-020 L-1); tek hard stop adet kaybı bildirimi."
  - key: rapid_loss_window_weeks
    value: 8
    unit: weeks
    tag: literatur
    source: "arastirma/ham/J1-cinsiyet.md#C6"
  - key: loss_cap_sparse_max_span_weeks
    value: 5
    unit: weeks
    tag: urun
    source: "arastirma/ham/H1-olcum.md#3.4"
    note: "SEÇİM, ürün (K-1226, ADR-091 Ek 4 devamı); türetilen kısım gürültü payı. Haftada 4'ten az tartıda kayıp tavanı (loss_rate_cap, loss_rate_cap_bodyweight; G2 K-17, H3 Ç1) 1..bu kadar hafta geriye bakar: kenar haftaların trendi arasındaki kayıp, k·tavan + NoiseMargin(kenar tartı sayıları) değerini AŞARSA güvenlik kararı (gürültü payı = ADR-020 L-10 türetiminin n1, n2'ye genellemesi, 1,96·0,42·√(1/n1+1/n2); alıntı değil). k hafta geriye bakınca haftalık pay 1/k'ya düşer: 2+2 tartıda tek haftada 0,82 kg pay tavanın 0,2 kg üstündeki sabit kaybı gizler, 5 haftada 0,16 kg/hafta kalır. 5 = decision_window_max_weeks − 1: karar penceresi seyrek veride en çok bu kadar haftalık adım okur (K-1204). Yoğun veride (son iki haftanın her biri min_weighins_per_week) kural değişmez, payı yoktur. Sekiz haftalık kayıp (rapid_loss) tartı sayısına hiç bağlı değildir, seyrekte zaten çalışır."
  - key: lea_threshold_kcal_per_kg_ffm
    by_sex: {male: 25, female: 30}
    unit: kcal_per_kg_ffm_per_day
    tag: literatur
    source: "arastirma/ham/J1-cinsiyet.md#L2.1"
    note: "IOC 2023 (J1 C6). Enerji mevcudiyeti = (plan kalorisi − egzersiz) / yağsız kütle. Altında: açığı EA bu çizgiye çıkacak kadar daralt + uyar. Erkek 25 (J1 C6 '~9-25', L2.1 kodu) — ADR-020 L-2."
  - key: ea_warning_kcal_per_kg_ffm
    by_sex: {male: 30, female: 35}
    unit: kcal_per_kg_ffm_per_day
    tag: literatur
    source: "arastirma/ham/J1-cinsiyet.md#L2.1"
    note: "Uyarı çizgisi: karar değişmez, uygulama uyarır ve izler. Kadında <35'te bile progesteron düşüklüğü pilot verisi (J1 C6). ADR-020 L-2."
  - key: ea_adequate_kcal_per_kg_ffm
    value: 45
    unit: kcal_per_kg_ffm_per_day
    tag: literatur
    source: "arastirma/ham/J1-cinsiyet.md#C6"
  - key: deficit_stop_fat_proxy_pct
    by_sex: {male: 8, female: 18}
    unit: percent_internal_only
    tag: literatur
    source: "arastirma/ham/J1-cinsiyet.md#L2.1"
    note: "YALNIZ İÇ DEĞİŞKEN (U4). L-4, ADR-027 #1: iç yağ tahmini bunun altındaysa açık durur (J1 L2.1 'deficit'i durdur, maintenance öner'). Motorda bakım bir yön değil (03 §2.1); surplus çizgisinin (erkek 12, kadın 22) çok altı → faz bulk'a döner, güvenlik ağında haftanın ilk adımında. Zayıf kanıtlı sağlık eşiği (m1-kural-haritasi), Levent onayladı."
  - key: bulk_ceiling_fat_proxy_pct
    by_sex: {male: 20, female: 30}
    unit: percent_internal_only
    tag: tecrube
    source: "arastirma/ham/guray/G6-eski-arsiv.md#K-7"
    note: "YALNIZ İÇ DEĞİŞKEN — kullanıcıya asla sayı olarak gösterilmez (U4). Göbek testi proxy'si (G6 K-9). Kadın +10 puan ofseti J1 B3."
  - key: fat_first_fat_proxy_pct
    by_sex: {male: 25, female: 35}
    unit: percent_internal_only
    tag: tecrube
    source: "arastirma/ham/guray/G4-ilerleme-metabolik.md#K-10"
    note: "YALNIZ İÇ DEĞİŞKEN (U4). Güray: >%25'te konan kas görünmez, >%30 kesinlikle bulk yasak → önce yağ ver (G4 K-10, G4 K-4 '%99 önce yağ verir'; 03 §2.1). Kadın +10 puan ofseti J1 B1 [literatür, güçlü]."
  - key: surplus_below_fat_proxy_pct
    by_sex: {male: 12, female: 22}
    unit: percent_internal_only
    tag: tecrube
    source: "arastirma/03-guray-karar-omurgasi.md#2.1"
    note: "YALNIZ İÇ DEĞİŞKEN (U4). Giriş kapısı: <%12 → surplus; %12-25 hedef ve tercihe göre (03 §2.1). G6 K-8'in %15-20 bandı bir tercih bandıdır (kuru görünmek isteyen alt sınıra oturur), zorunlu geçiş değil. Kadın +10 puan J1 B1; 22, J1 B3'ün '18-20 altına inerken uyar' eşiğinin üstünde."
