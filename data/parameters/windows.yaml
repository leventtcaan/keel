    source: "arastirma/ham/H1-olcum.md"
    note: "Ölç sık, yorumla seyrek — Güray da haftalık değişimi yorumlamayı reddediyor (03 §8)."
  - key: evaluation_window_days
    value: 90
    unit: days
    tag: tecrube
    source: "arastirma/ham/guray/G1-antrenman.md#K-25"
    note: "Gelişim 3 ayda değerlendirilir; literatür destekliyor (H3 Ç7)."
  - key: min_weighins_per_week
    value: 4
    unit: weighins_per_week
    tag: literatur
    source: "arastirma/ham/H1-olcum.md#3.4"
    note: "TÜRETİLMİŞ, Levent onayı bekliyor — araştırmada doğrudan sayı yok. Girdi: H1 §3.4, ardışık iki günün farkının SD'si %0,53 (80 kg'da 0,42 kg). Temkinli varsayım: tek tartı gürültüsü ≤0,42 kg (bağımsız okumada ≈0,30 olurdu; günler korelasyonlu olduğu için √n kazancı iyimser). Karşılaştırma: pencerenin ilk ve son haftasının ortalaması (erkekte 14 gün arayla). n=4 → farkın %95 hata payı 1,96·0,42·√(2/4) ≈ 0,58 kg ≈ 0,3 kg/hafta; n=2 → 0,82 kg, yavaş kaybı sabitten ayıramaz. Gürültü kiloyla ölçeklenir (120 kg: ≈0,44 kg/hafta). Kod her haftada ister (türetmeden katı): orta haftasız trend yönü kırılgan."
