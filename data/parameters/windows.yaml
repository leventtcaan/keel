parameters:
  - key: trend_display_days
    value: 7
    unit: days
    tag: literatur
    source: "arastirma/ham/H1-olcum.md#3.4"
  - key: decision_window_days
    by_sex: {male: 21, female: 28}
    unit: days
    tag: literatur
    source: "arastirma/ham/J1-cinsiyet.md#D1"
    note: "Kadında 28 gün döngü sinyalini matematiksel olarak sıfırlar (7 günde %90'ı geçiyor). Erkekte 2-3 hafta; 1 hafta yetersiz (H3 Ç5)."
  - key: no_interpretation_days
    value: 14
    unit: days
    tag: literatur
    source: "arastirma/ham/H1-olcum.md#3.4"
    note: "Ölç sık, yorumla seyrek — Güray da haftalık değişimi yorumlamayı reddediyor (03 §8)."
  - key: evaluation_window_days
    value: 90
    unit: days
    tag: tecrube
    source: "arastirma/ham/guray/G1-antrenman.md#K-25"
    note: "Gelişim 3 ayda değerlendirilir; literatür destekliyor (H3 Ç7)."
  - key: min_weighins_per_week
    value: 4
    unit: weighins_per_week
    tag: literatur
    source: "arastirma/ham/H1-olcum.md#3.4"
    note: "TÜRETİLMİŞ, ADR-020 ile onaylandı — araştırmada doğrudan sayı yok. Girdi: H1 §3.4, ardışık iki günün farkının SD'si %0,53 (80 kg'da 0,42 kg). Temkinli varsayım: tek tartı gürültüsü ≤0,42 kg (bağımsız okumada ≈0,30 olurdu; günler korelasyonlu olduğu için √n kazancı iyimser). Karşılaştırma: pencerenin ilk ve son haftasının ortalaması (erkekte 14 gün arayla). n=4 → farkın %95 hata payı 1,96·0,42·√(2/4) ≈ 0,58 kg ≈ 0,3 kg/hafta; n=2 → 0,82 kg, yavaş kaybı sabitten ayıramaz. Gürültü kiloyla ölçeklenir (120 kg: ≈0,44 kg/hafta). Kod her haftada ister (türetmeden katı): orta haftasız trend yönü kırılgan."
  - key: on_track_min_ratio
    value: 0.7
    unit: ratio
    tag: tecrube
    source: "arastirma/ham/guray/G2-kilo-verme.md#K-60"
    note: "Planın %70'ini yapan başarılı sayılır (Güray K-60). Tutarlılık sayısında haftanın 'on track' eşiği. K-106 omurgasının uyum eşiği de budur (ADR-020 L-6: uyum = tutarlılık oranı)."
  - key: adherence_fix_below
    value: 0.5
    unit: ratio
    tag: tecrube
    source: "arastirma/ham/guray/G2-kilo-verme.md#K-60"
    note: "Uyum bunun altındaysa kaloriye dokunulmaz, uyum çözülür (Güray: '<%50 yetersiz'). on_track_min_ratio ile arası da kaloriye dokunmaz, daha yumuşak metinle uyum (ADR-020 L-9); kalori ancak ≥ on_track_min_ratio'da."
  - key: flat_margin_kg
    value: 0.58
    unit: kg
    tag: literatur
    source: "arastirma/ham/H1-olcum.md#3.4"
    note: "TÜRETİLMİŞ (ADR-020 L-10). Karar penceresinin ilk ve son haftasının ortalama farkı bu payı hedef yönde aşmıyorsa kilo 'sabit' sayılır. min_weighins_per_week ile aynı hesap: 1,96 · 0,42 · √(2/4) ≈ 0,58 kg. Erkekte 14 gün arayla ≈ 0,3 kg/hafta ve üstü 'hareket'. Güray'da plato tanımı yok (G2 K-64 notu). 'Kilo sabit' sinyali (K-603) de bu payı kullanır: ilk ve son hafta farkı payı iki yönde de aşmıyorsa."
  - key: what_if_trend_step_margins
    value: 1.25
    unit: margins
    tag: urun
    source: "arastirma/ham/L3-ozellik-boslugu.md#5"
    note: "TÜRETİLMİŞ, ürün (K-610, L3 Y3 'Kararı ne değiştirir?'). Bulk'ta örnek verinin 'hedefe doğru' haftası son haftanın ortalamasından flat_margin_kg'nin bu katı kadar yukarıda: 1 kat eşikte kalır (pay aşılmalı, ADR-020 L-10; bulk 'durdu' okunur), 1,25 spine'ın 'hareket' dediği en küçük açık adım. Cut'ta kullanılmaz (what_if_cut_step_of_loss_cap). Yalnız örnek veri; gerçek karara girmez."
  - key: what_if_cut_step_of_loss_cap
    value: 0.5
    unit: ratio
    tag: urun
    source: "arastirma/ham/L3-ozellik-boslugu.md#5"
    note: "TÜRETİLMİŞ, ürün (K-610 incelemesi). Cut'ta örnek 'hedefe doğru' haftası haftalık kayıp tavanının (min(weekly_loss_cap_kg, weekly_loss_cap_pct_bodyweight × kilo), G2 K-17, H3 B3) bu payı kadar aşağıda: hiçbir kiloda güvenlik ağına değmez (sabit adım 73 kg altında tavanı aşıyordu), cut'ın 'bu hafta hareket' payını (ADR-027 #0) geçer — 80 kg'da 0,4 kg, 62 kg'da 0,31 kg. Yalnız örnek veri."
  - key: flat_wait_weeks
    value: 1
    unit: weeks
    tag: tecrube
    source: "arastirma/ham/guray/G2-kilo-verme.md#K-64"
    note: "Cut: pencere hedef yönde değil ama son haftaya gürültü payı içinde kalan önceki hafta sayısı bunu aşmıyorsa (kilo yalnız bir haftadır aynı), bel yukarı gitmiyorsa ve uyum yüksekse bir hafta daha beklenir — 'iki haftalık düşüş birden gelir'. Ölçüm ADR-021."
  - key: dense_weighins_per_week
    value: 6
    unit: weighins_per_week
    tag: literatur
    source: "arastirma/ham/H1-olcum.md#3.4"
    note: "TÜRETİLMİŞ (K-112): her haftası en az bu kadar tartılı bir pencerede kilo kararı HIGH güvenle verilir, min_weighins_per_week ile bu arası MEDIUM. Aynı hesap: n=6 → iki haftalık ortalama farkının payı 1,96·0,42·√(2/6) ≈ 0,48 kg (n=4'te 0,58)."
  - key: training_days_min
    value: 3
    unit: days_per_week
    tag: tecrube
    source: "arastirma/ham/guray/G6-eski-arsiv.md#K-36"
    note: "3 gün taban (G6 K-36 '3 minimum'; G7 K-79 'taban 3', bağımsız kaynak). Motorun önerisi hiçbir girdide bunun altına inmez (ADR-077, ADR-073 #2: program incelemesi günü bu sayının altına indirmez); kullanıcının kendi seçimi serbest."
  - key: training_days_ideal_min
    value: 4
    unit: days_per_week
    tag: tecrube
    source: "arastirma/ham/guray/G6-eski-arsiv.md#K-36"
    note: "4-5 gün ideal (G6 K-36 '4 ve 5'; G7 K-79 'optimum 4-5', bağımsız kaynak). 1. hafta ayarı (ADR-077 #4, R4): her planlı seans yapıldı, 'I could do more', yeni başlamayan ve gün bunun altındaysa bir gün eklenir; yeni başlayana 3 yeter (G6 K-36), deneyim bilinmiyorsa eklenmez."
  - key: missed_sessions_in_a_row
    value: 2
    unit: sessions
    tag: tecrube
    source: "arastirma/ham/guray/G5-surec-supplement.md#T-4"
    note: "Proaktif soru (K-512, ADR-039): programın bu kadar planlı günü geçip ilkinden beri tek seans yoksa. Güray: 'ard arda 2 antrenman kaçırma' → içsel motivasyon tavsiyesi verme, dışsal taahhüt (sabit saat). Hiç seans kaydedilmemişse sorulmaz (U3, U7)."
  - key: hunger_question_days
    value: 2
    unit: days
    tag: tecrube
    source: "arastirma/ham/guray/G5-surec-supplement.md#T-2"
    note: "Proaktif soru (K-512): bir açık (cut) planın ilk bu kadar günü açlık sorulur; 'hiç aç değilim' başarı sayılmaz — açlık tipik olarak 3-4. günde ve ilk ağır bacak antrenmanından sonra gelir (Güray). Güray'ın agresif protokolünden; ılımlı açıkta da erken iyilik hâli geçicidir."
  - key: first_weeks
    value: 8
    unit: weeks
    tag: urun
    source: "arastirma/04-faz3-urun.md#7.5"
    note: "İlk 8 hafta akışı (K-513, ADR-040): H1-H8, kişinin kendi haftası, hesabın açıldığı günden; ardından bir hafta yalnız 8. haftanın riski için açık. 8 hafta alışkanlık kurmaz (Lally) — bir sonraki bloğa devrettirir."
  - key: first_weeks_risk_from
    value: 5
    unit: weeks
    tag: tecrube
    source: "arastirma/ham/guray/G2-kilo-verme.md#K-63"
    note: "Biten kullanıcı haftası bu ve sonrası (akışın sonuna kadar) iken risk okunur, yani 6-9. haftalarda (K-513, ADR-040): G2 K-63 kritik uyum penceresi 5.-8. hafta; I1 F2 risk skoru 5. haftada devreye girer."
