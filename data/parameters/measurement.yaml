parameters:
  - key: whtr_threshold
    value: 0.5
    unit: ratio
    tag: literatur
    source: "arastirma/ham/H1-olcum.md#1.3"
    note: "NICE NG246; öz-ölçüm için önerilmiş; cinsiyetten bağımsız (J1 B4). Güray cm eşiği vermiyor — boşluk."
  - key: waist_cm_elevated
    by_sex: {male: 94, female: 80}
    unit: cm
    tag: literatur
    source: "arastirma/ham/J1-cinsiyet.md#B4"
    note: "IDF Europid. İkincil eşik; birincil WHtR."
  - key: waist_measurement_error_cm
    value: 1.0
    unit: cm
    tag: literatur
    source: "arastirma/ham/H1-olcum.md#1.2"
    note: "Bel trendi (WaistTrend) bu hatayı aşınca DOWN/UP. 'Kilo sabit, bel düştü' sinyali (K-603, H1 §1.6) aynı eşiği kullanır: yeni eşik yok."
  - key: waist_signal_min_span_days
    value: 14
    unit: days
    tag: literatur
    source: "arastirma/ham/H1-olcum.md#1.5"
    note: "H1 §1.5: beklenen bel hızı 0,25-0,4 cm/hafta, öz-ölçüm hatası ±1 cm → haftalık bel değişimi gürültü; 2-4 haftada bir ölçülmeli. 'Kilo sabit, bel düştü' sinyali (K-603) pencerede ilk ve son bel ölçümü en az bu kadar arayla değilse söylenmez (§1.6: tek ölçüme dayanma). Alt uç (2 hafta) seçildi. Spine'ın bel kuralı (G2 K-64) bundan etkilenmez."
  - key: weight_daily_noise_sd_kg
    value: 0.42
    unit: kg
    tag: literatur
    source: "arastirma/ham/H1-olcum.md#3.4"
  - key: photo_min_detectable_fat_mass_kg
    value: 1.2
    unit: kg
    tag: literatur
    source: "arastirma/ham/H1-olcum.md#2.2"
    note: "Profesyonel tarayıcıda 1,2-1,5 kg; telefon bundan iyi olamaz."
  - key: photo_interval_weeks
    value: 4
    unit: weeks
    tag: literatur
    source: "arastirma/ham/H1-olcum.md#2.5"
    note: "Bel, fotoğraf ve kilo trendi üç bağımsız hesapta aynı sabite çıkıyor."
  - key: rfm_intercept_pct
    value: 64
    unit: percent_internal_only
    tag: literatur
    source: "arastirma/ham/H8-yag-tahmini.md#A1"
    note: "YALNIZ İÇ DEĞİŞKEN (U4). Relative Fat Mass = 64 − 20 × boy/bel + 12 × cinsiyet (Woolcott & Bergman 2018, DXA'ya karşı, NHANES n=12.581 + 3.456). Belirsizlik: IQR erkek 4,2, kadın 4,9 puan (H8 A3). Nokta tahmin olarak okunur: faz kapısı, L-4 ve LEA tabanının büyüklüğü (H8 A3; LEA'da kullanımı DURUM soru 22)."
  - key: rfm_height_to_waist_pct
    value: 20
    unit: percent_internal_only
    tag: literatur
    source: "arastirma/ham/H8-yag-tahmini.md#A1"
    note: "RFM'de boy/bel katsayısı (puan / oran)."
  - key: rfm_female_offset_pct
    value: 12
    unit: percent_internal_only
    tag: literatur
    source: "arastirma/ham/H8-yag-tahmini.md#A1"
    note: "RFM'de cinsiyet terimi: 12 × cinsiyet (erkek 0, kadın 1) — yalnız kadında eklenir."
  - key: rfm_plausible_min_pct
    by_sex: {male: 2, female: 10}
    unit: percent_internal_only
    tag: literatur
    source: "arastirma/ham/J1-cinsiyet.md#B2"
    note: "YALNIZ İÇ DEĞİŞKEN (U4). Esansiyel yağın alt ucu (ACE: erkek %2-5, kadın %10-13). RFM bunun altındaysa bel yanlış girilmiştir (90 yerine 9, inç cm diye): tahmin yok sayılır, kırpılmaz — sıfırın altı bir yağ 'yağsız kütle > kilo' der ve LEA tabanını uydurur (K-224 review)."
  - key: rfm_energy_margin_pct
    by_sex: {male: 5, female: 6}
    unit: percent_internal_only
    tag: literatur
    source: "arastirma/ham/H8-yag-tahmini.md#A3"
    note: "YALNIZ İÇ DEĞİŞKEN (U4). TÜRETİLMİŞ (H8 A3): Woolcott & Bergman 2018'in kesinliği IQR erkek 4,2, kadın 4,9 puan → σ ≈ 3,1 / 3,6 → %90 bant ≈ ±5 / ±6 puan. LEA ağı ve tabanı RFM'i bu kadar düşük okur (daha az yağ → daha çok yağsız kütle → daha yüksek taban; Levent (c), ADR-028 #22, K-230); en az rfm_plausible_min_pct. Faz kapısı ve L-4 nokta tahminle kalır."
  - key: look_level_first_pct
    by_sex: {male: 10, female: 20}
    unit: percent_internal_only
    tag: tecrube
    source: "arastirma/04-faz3-urun.md#Ö-4"
    note: "YALNIZ İÇ DEĞİŞKEN (U4). Referans görünüşün ilk seviyesi. Ö-4: %12 fit, %15-20 bant, %20 tavan (göbek testi, G6 K-9); kadın +10 puan (J1 B1). Kullanıcı sayı değil görsel seçer (H8 B)."
  - key: look_level_step_pct
    value: 5
    unit: percent_internal_only
    tag: tecrube
    source: "arastirma/04-faz3-urun.md#Ö-4"
    note: "Seviyeler arası 5 puan: Ö-4 bantlarını (12 / 15-20 / 20+) ayırabilecek en kaba adım; görsel bir tahminin kendi belirsizliğinden ince değil."
  - key: look_levels
    value: 7
    unit: levels
    tag: tecrube
    source: "arastirma/04-faz3-urun.md#Ö-4"
    note: "Erkekte %10-40, kadında %20-50: kapının eşiklerini (surplus 12/22, tavan 20/30, önce yağ 25/35, alt sınır 8/18) kapsar."
