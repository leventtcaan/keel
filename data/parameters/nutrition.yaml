parameters:
  - key: protein_g_per_kg
    value: 2.0
    unit: g_per_kg_bodyweight
    tag: tecrube
    source: "arastirma/ham/guray/G3-kilo-alma-beslenme.md#K-18"
    note: "Toplam vücut ağırlığı üzerinden, yağsız kütle değil (G3 K-19). Kadında aynı (J1 A5)."
  - key: protein_g_per_kg_max
    value: 2.5
    unit: g_per_kg_bodyweight
    tag: tecrube
    source: "arastirma/ham/guray/G2-kilo-verme.md#K-21"
  - key: protein_g_per_kg_female_45_plus
    value: 2.2
    unit: g_per_kg_bodyweight
    tag: literatur
    source: "arastirma/ham/J1-cinsiyet.md#A5"
    note: "Güray'da kadına özel protein kuralı yok; boşluk literatürle dolduruldu."
  - key: protein_female_higher_from_age
    value: 45
    unit: years
    tag: literatur
    source: "arastirma/ham/J1-cinsiyet.md#C5"
    note: "Perimenopoz ~45'te başlar (ortalama menopoz ~51); J1 C5: ayrı soru sormadan yaş ≥45 ve kadın ile bant kaydırılır. protein_g_per_kg_female_45_plus bu yaştan itibaren."
  - key: fat_g_per_kg_min
    by_sex: {male: 0.5, female: 0.75}
    unit: g_per_kg_bodyweight
    tag: tecrube
    source: "arastirma/ham/guray/G2-kilo-verme.md#K-22"
    note: "Erkek 0,5 Güray. Kadın alt sınırı 0,7-0,8 J1 A6'dan (Güray'da kadın verisi yok); 0,75 bandın ortası."
  - key: fat_g_per_kg_max
    value: 1.0
    unit: g_per_kg_bodyweight
    tag: tecrube
    source: "arastirma/ham/guray/G3-kilo-alma-beslenme.md#K-21"
  - key: carbs_min_g_per_day
    value: 50
    unit: g_per_day
    tag: tecrube
    source: "arastirma/03-guray-karar-omurgasi.md#2.3"
    note: "Güray tabanı 50-100 g. Literatür bu kalori/set aralığında karbonhidratın performansa etkisini göstermiyor (H3 B-EK); alt uç seçildi, sıkışma Reason olarak raporlanır."
  - key: fiber_g_per_day
    by_sex: {male: 38, female: 25}
    unit: g_per_day
    tag: literatur
    source: "arastirma/ham/H3-bosluk-literatur.md#B11"
    note: "Mutlak hedef; açıkta kaloriye oranlanmaz. Güray lifi gram değil sebze hacmiyle kuruyor (G7) — gram hedefi literatürden."
  - key: cut_step_min_kcal
    value: 500
    unit: kcal_per_day
    tag: tecrube
    source: "arastirma/ham/guray/G7-whisper-arsiv.md#K-97"
    note: "Literatür %5-10 (100-250 kcal) diyor (H3 B3). Güray: 300-400 ölçüm gürültüsü. Çelişkide Güray kazanır. Adım hiç kısaltılmaz: enerji tabanı (LEA) adımı keserse kalori sabit kalır, BMR ya da makro tabanı keserse hareket artar (K-107). Açık karbdan çıkar (kart, 03 §2.3); G7 K-117 'yağdan ver' çelişkisi DURUM'da."
  - key: bulk_step_kcal
    value: 250
    unit: kcal_per_day
    tag: tecrube
    source: "arastirma/ham/guray/G3-kilo-alma-beslenme.md#K-10"
    note: "Tamamı karbonhidrattan (G6 K-16)."
  - key: calorie_change_min_wait_weeks
    value: 2
    unit: weeks
    tag: literatur
    source: "arastirma/ham/H3-bosluk-literatur.md#B3"
    note: "Güray: 2 hafta durağanlıktan sonra artış (G3 K-10) — literatürle uyumlu."
  - key: gain_rate_ideal_kg_per_month
    by_sex: {male: 1.0, female: 0.5}
    unit: kg_per_month
    tag: tecrube
    source: "arastirma/ham/guray/G3-kilo-alma-beslenme.md#K-11"
    note: "Kadın değeri ×0,5 J1 A8'den — kanıt ZAYIF (uzman modeli, RCT değil)."
  - key: gain_rate_max_kg_per_month
    by_sex: {male: 2.0, female: 1.0}
    unit: kg_per_month
    tag: tecrube
    source: "arastirma/ham/guray/G3-kilo-alma-beslenme.md#K-11"
    note: "Haftada ~0,5 kg tavanla uyumlu (G6 K-12). Kadın ×0,5 (J1 A8, zayıf kanıt)."
  - key: maintenance_observation_days
    by_sex: {male: 14, female: 28}
    unit: days
    tag: tecrube
    source: "arastirma/ham/guray/G2-kilo-verme.md#K-8"
    note: "Kadın değeri 28: J1 D1 (döngü sinyali 28 günde sıfırlanır) ve H3 Ç5, ADR-020 L-7 ile Güray'ın 1-2 haftasının yerine; erkek değeri Güray. Başlangıç hedefi (formül tahmini) bu kadar gün değişmez; kilo sabitse o kalori kişinin bakımıdır (K-8 'gözlem formülü yener'). Erkek 14: Güray 1-2 hafta, literatür en az 2 (H3 B3); tam iki haftalık döngü (H6 A4). Kadın 28: döngü sinyali (J1 D1, H3 Ç5) — ADR-020 L-7."
  - key: resting_kcal_per_kg
    value: 10
    unit: kcal_per_kg_per_day
    tag: literatur
    source: "arastirma/ham/H6-baslangic-kalori.md#A1"
    note: "Mifflin-St Jeor 1990 sadeleştirilmiş form: 10·kg + 6,25·cm − 5·yaş + sabit. Gerçek (şu anki) kilo. Yalnız başlangıç tahmini ve BMR tabanı için; gözlem kazanır (G2 K-8, ADR-020 L-7)."
  - key: resting_kcal_per_cm
    value: 6.25
    unit: kcal_per_cm_per_day
    tag: literatur
    source: "arastirma/ham/H6-baslangic-kalori.md#A1"
  - key: resting_kcal_per_year
    value: 5
    unit: kcal_per_year_per_day
    tag: literatur
    source: "arastirma/ham/H6-baslangic-kalori.md#A1"
    note: "Yaşla çıkarılır."
  - key: resting_kcal_offset
    by_sex: {male: 5, female: -161}
    unit: kcal_offset_per_day
    tag: literatur
    source: "arastirma/ham/H6-baslangic-kalori.md#A5"
    note: "Mifflin'de kadın için tek fark sabit terim (A5). Menopoz terimi yok; gözlem yakalar."
  - key: activity_factor_inactive
    value: 1.4
    unit: activity_factor
    tag: literatur
    source: "arastirma/ham/H6-baslangic-kalori.md#A3"
    note: "NASEM 2023 tipik değerleri (DLW ölçümlü). Popüler 1,2-1,9 setinin birincil kaynağı yok ve 1,2 ölçülmüş serbest yaşam PAL'inin altında (H6 A3-d)."
  - key: activity_factor_low_active
    value: 1.6
    unit: activity_factor
    tag: literatur
    source: "arastirma/ham/H6-baslangic-kalori.md#A3"
  - key: activity_factor_active
    value: 1.75
    unit: activity_factor
    tag: literatur
    source: "arastirma/ham/H6-baslangic-kalori.md#A3"
  - key: activity_factor_very_active
    value: 2.05
    unit: activity_factor
    tag: literatur
    source: "arastirma/ham/H6-baslangic-kalori.md#A3"
  - key: activity_factor_unknown
    value: 1.6
    unit: activity_factor
    tag: literatur
    source: "arastirma/ham/H6-baslangic-kalori.md#A3"
    note: "Aktivite bilinmiyorsa: sedanter Batılı yetişkinde ölçülmüş modal PAL 1,60 (Black 1996, FAO); kitle direnç antrenmanı yapıyor, 1,4 büyük olasılıkla düşük kalır. Aktivite sorusunun nasıl sorulacağı ürün kararı (DURUM)."
  - key: maintenance_estimate_error
    value: 0.15
    unit: ratio
    tag: literatur
    source: "arastirma/ham/H6-baslangic-kalori.md#A4"
    note: "TÜRETİLMİŞ. Formül tahmini aralık olarak gösterilir (U5): ±%15. RMR ±%10 ve PAL ±%8-10 birlikte ≈ ±%13 (H6 A4, türetilmiş); sporcuda Mifflin daha kötü (A2). TİPİK YAYILIM, KESİN SINIR DEĞİL: ~5 kişiden 1'i RMR'de ±%10 dışında, obezde %21'e kadar eksik tahmin (A4). K-115 kayıt sapması aralığında da kullanılır; bu kişilerde o aralık yanılabilir, bu yüzden metin iki okumayı birden söyler (kayıt ya da tahminimiz)."
  - key: bulk_stall_weeks
    value: 2
    unit: weeks
    tag: tecrube
    source: "arastirma/ham/guray/G3-kilo-alma-beslenme.md#K-10"
    note: "Bulk: kilo bu kadar hafta artmadıysa (son haftaya gürültü payı içinde kalan önceki hafta sayısı, ADR-021) kalori artar (+bulk_step_kcal, karbonhidrattan); daha kısasında beklenir."
  - key: mini_cut_after_bulk_months
    value: 5
    unit: months
    tag: tecrube
    source: "arastirma/ham/guray/G7-whisper-arsiv.md#K-102"
    note: "Mini cut tetikleyicisi: 5-6 ay bulk + iştah durdu (eskiden yediğini bile yiyemiyor, zorla yiyor). Alt ucu alındı."
  - key: mini_cut_weeks_min
    value: 4
    unit: weeks
    tag: tecrube
    source: "arastirma/ham/guray/G7-whisper-arsiv.md#K-102"
    note: "4-6 haftalık defisit: ilk 1-2 hafta açlık yok, 3-4. haftada iştah geri gelir (iştah reseti)."
  - key: mini_cut_weeks_max
    value: 6
    unit: weeks
    tag: tecrube
    source: "arastirma/ham/guray/G7-whisper-arsiv.md#K-102"
  - key: energy_per_kg_weight_change
    value: 7700
    unit: kcal_per_kg_weight_change
    tag: literatur
    source: "arastirma/ham/H6-baslangic-kalori.md#A4"
    note: "Kilo değişiminden enerji dengesi: 7700 kcal/kg (3500 kcal/lb). Hall 2008: yalnız ~30 kg üstü yağ kütlesinde tutar, zayıf kişide gereken açığı fazla tahmin eder — yalnız kayıt sapmasını öğrenmekte kullanılır (K-115), kalori kararlarında değil (kararlar tartıdan, adımlarla)."
  - key: logging_bias_daily_smoothing
    value: 0.1
    unit: ratio
    tag: literatur
    source: "arastirma/ham/H1-olcum.md#3.4"
    note: "Hacker's Diet EWMA katsayısı (α = 0,1, ≈20 günlük etkin pencere), kilo trendi için. Kayıt sapmasına aynı hafıza süresi uygulanır (bu aktarım bizim seçimimiz; H1 sapmadan söz etmiyor): bir pencere, öncekinden bu yana geçen gün kadar ağırlık alır, 1 − 0,9^gün — erkekte 21 günde ≈0,89 (eski tahminden ~1/9 kalır), kadında 28 günde ≈0,95 (~1/19). Atlanan pencere daha çok zaman demektir. MacroFactor'ın ~30 günde olgunlaşan harcama tahmini (H1 §3.4) bu hafıza süresiyle uyumlu."
  - key: logging_bias_min_windows
    value: 2
    unit: windows
    tag: urun
    source: "arastirma/ham/H6-baslangic-kalori.md#A4"
    note: "SEÇİM, TÜRETİLMEDİ (Levent onayı bekliyor). Tek pencerede kilodan alım çıkarmanın bireysel hatası ±118-272 kcal (Thomas 2010, Sanghvi 2015; H6 A4); kaç pencerenin yeteceğine dair sayı kaynakta yok. İki, bir sapmanın tekrarlandığını gösteren en küçük sayı: en yeni iki pencerenin her biri tek başına, formül hatası ve tartı payının ötesinde, aynı yönde göstermeli."
  - key: min_logged_days_per_week
    value: 4
    unit: days_per_week
    tag: urun
    source: "arastirma/ham/H1-olcum.md#3.4"
    note: "SEÇİM, TÜRETİLMEDİ (Levent onayı bekliyor). H1 §3.4 tartı gürültüsü hakkında, yemek kaydı hakkında değil; araştırmada yemek kaydı için doğrudan sayı yok. min_weighins_per_week ile aynı sayı (haftanın yarısından fazlası) aktarıldı. Kaydı olmayan gün 0 kcal sayılmaz, ortalamaya girmez."
