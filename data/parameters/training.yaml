parameters:
  - key: target_rir_max
    value: 1
    unit: reps_in_reserve
    tag: tecrube
    source: "arastirma/ham/guray/G1-antrenman.md#K-5"
    note: "Çalışma setleri RIR 0-1. Eski arşivde RIR 1-2 (G6 K-40) — 2026 görüşü geçerli."
  - key: e1rm_epley_divisor
    value: 30
    unit: reps
    tag: literatur
    source: "arastirma/ham/H3-bosluk-literatur.md#B15"
    note: "Epley: e1RM = yük × (1 + tükenişe kadar tekrar / 30). Tükenişe kadar tekrar = tekrar + RIR. Bir eğilim metriği, mutlak kuvvet iddiası değil."
  - key: e1rm_max_reps_to_failure
    value: 10
    unit: reps
    tag: literatur
    source: "arastirma/ham/H3-bosluk-literatur.md#B15"
    note: "Mayhew 2008: denklemler 2-10 tekrarda en iyi; Reynolds 2006: yüksek tekrarda doğruluk düşer. Tekrar + RIR bunu aşan setten e1RM üretilmez."
  - key: rep_range_compound_min
    value: 6
    unit: reps
    tag: tecrube
    source: "arastirma/ham/guray/G1-antrenman.md#K-21"
    note: "Bileşikte 6-8 (K-21); omuz presinde 10'a kadar; yeni başlayana 8-10 (K-20). Program 6-10 verir: çift progresyonun tırmanacağı bir aralık (H3 B4)."
  - key: rep_range_compound_max
    value: 10
    unit: reps
    tag: tecrube
    source: "arastirma/ham/guray/G1-antrenman.md#K-21"
  - key: rep_range_isolation_min
    value: 8
    unit: reps
    tag: tecrube
    source: "arastirma/ham/guray/G1-antrenman.md#K-21"
    note: "İzolasyonda 8-12; 12-15'i aşmak için sebep yok (K-21)."
  - key: rep_range_isolation_max
    value: 12
    unit: reps
    tag: tecrube
    source: "arastirma/ham/guray/G1-antrenman.md#K-21"
  - key: arm_weekly_sets_min
    value: 6
    unit: sets_per_week
    tag: tecrube
    source: "arastirma/ham/guray/G1-antrenman.md#K-61"
    note: "Biceps ve triceps haftada 6-8 work set, iki seansa bölünmüş (K-61). Hammer/reverse curl ön kol sayılır (K-67). Tek günlük şablonda tutmaz (seans başı ≤5, K-10)."
  - key: weekly_sets_per_muscle
    value: 10
    unit: sets_per_week
    tag: tecrube
    source: "arastirma/ham/guray/G1-antrenman.md#K-11"
    note: "Bant 4-12/15 (G1 K-12). 5 yılda değişen tek şey: ~20'den ~10'a."
  - key: sets_per_session_per_muscle_min
    value: 2
    unit: sets
    tag: tecrube
    source: "arastirma/ham/guray/G1-antrenman.md#K-10"
  - key: sets_per_session_per_muscle_max
    value: 5
    unit: sets
    tag: tecrube
    source: "arastirma/ham/guray/G1-antrenman.md#K-10"
  - key: frequency_per_muscle_per_week
    value: 2
    unit: sessions_per_week
    tag: tecrube
    source: "arastirma/ham/guray/G1-antrenman.md#K-22"
  - key: default_training_days_per_week
    value: 4
    unit: days_per_week
    tag: literatur
    source: "arastirma/ham/H3-bosluk-literatur.md#B8"
    note: "4 gün upper/lower × 2 = seans başına 5 set. Güray 4-5 gün ideal diyor (G7 K-79) — uyumlu."
  - key: load_increment_upper_kg
    value: 2.5
    unit: kg
    tag: literatur
    source: "arastirma/ham/H3-bosluk-literatur.md#B4"
    note: "Uygulayıcı konsensüsü, meta-analiz yok. İleri seviyede mikro plaka 0,5-1,25 kg."
  - key: load_increment_lower_kg
    value: 5.0
    unit: kg
    tag: literatur
    source: "arastirma/ham/H3-bosluk-literatur.md#B4"
  - key: load_jump_max_steps
    value: 2
    unit: load_steps
    tag: urun
    source: "arastirma/ham/L3-ozellik-boslugu.md#5"
    note: "TÜRETİLMİŞ, ürün kararı (Levent, ADR-037 #38 b). §5 Y7: motorun artışı salonda mümkün en yakın yüke yuvarlanır, mümkün değilse tekrar artışına çevrilir. En yakın ağır yük son yükün üstünde motor adımının (hedef − son) bu katından uzaksa 'mümkün değil' sayılır: seyrek rafta 10 → 20 kg dambıl +%100 sıçramaydı. Kaynaklı bir sıçrama sınırı yok. Tutma şöyle biter (ADR-041 #55): son yükteki setlerin her biri ağır yükte aralığın altına eşdeğer olunca (Epley, H3 B15) sıçranır."
  - key: busy_min_sessions_per_week
    value: 1
    unit: sessions_per_week
    tag: literatur
    source: "arastirma/ham/H9-donus-minimum-doz.md#§2.1"
    note: "Yoğun hafta minimum dozu (K-524, ADR-038 #7). Bickel 2011: haftada 1 seans 20-35 yaşta kuvveti ve kas kütlesini 32 hafta korudu; Rønnestad 2011 (profesyonel): haftada 1 korudu, 2 haftada 1 korumadı (H9 §2.4). Güray G1 K-22 ile çelişmez: '1/hafta mantıksız ama atrofi yaratmaz' — gelişim için 2, koruma için 1. TÜRETİLMİŞ: tek bir haftaya uygulamak (çalışmalar 8-32 hafta; kısa süre daha kolay korunur)."
  - key: busy_min_sets_per_exercise
    value: 1
    unit: sets
    tag: literatur
    source: "arastirma/ham/H9-donus-minimum-doz.md#§2.1"
    note: "Egzersiz başına 1 set (Bickel 2011 1/9 doz; Graves 1988, H9 §2.2). Birim çalışmanınki: egzersiz başına, kas başına değil. Güray G1 K-9: tek set hakkın varsa o seti tükenişe götür — Bickel'in seti de istemli yorgunluğa kadar. TÜRETİLMİŞ: üst vücuda genelleme (Bickel ve Graves yalnız alt vücut)."
  - key: busy_min_keep_load
    value: true
    unit: boolean
    tag: literatur
    source: "arastirma/ham/H9-donus-minimum-doz.md#§2.5"
    note: "Yük (göreli yoğunluk) düşürülmez: Spiering 2021 'yoğunluk anahtar değişken'; Bickel 2011 idame dozunu aynı 8-12RM ile yaptı; Mujika & Padilla 2000 (H9 §1.6)."
  - key: busy_min_older_age
    value: 60
    unit: years
    tag: literatur
    source: "arastirma/ham/H9-donus-minimum-doz.md#§2.1"
    note: "Bickel 2011'in 60-75 yaş grubu: 1/9 doz kuvveti korudu, kas boyutunu korumadı. Sınır çalışmanın grup sınırı."
  - key: busy_min_sessions_per_week_older
    value: 2
    unit: sessions_per_week
    tag: literatur
    source: "arastirma/ham/H9-donus-minimum-doz.md#§2.5"
    note: "Spiering 2021 (derleme): yaşlıda kas boyutu için 'haftada 2 seansa kadar'. Düşük güven: derlemenin birincil dayanağı okunamadı (H9 §2.5)."
  - key: busy_min_sets_per_exercise_older
    value: 2
    unit: sets
    tag: literatur
    source: "arastirma/ham/H9-donus-minimum-doz.md#§2.5"
    note: "Spiering 2021: yaşlıda 'egzersiz başına 2-3 set'; alt sınır 2. Düşük güven (H9 §2.5)."
  - key: load_progression_compound_only
    value: true
    unit: boolean
    tag: tecrube
    source: "arastirma/ham/guray/G6-eski-arsiv.md#K-33"
    note: "İzolasyon hareketlerinde yük takibi yapılmaz."
  - key: technique_gate_required
    value: true
    unit: boolean
    tag: tecrube
    source: "arastirma/ham/guray/G6-eski-arsiv.md#K-31"
    note: "O hafta form kusursuz değilse ertesi hafta yük eklenmez."
  - key: stagnation_deload_months
    value: 3
    unit: months
    tag: tecrube
    source: "arastirma/ham/guray/G7-whisper-arsiv.md#K-69"
  - key: deload_volume_factor
    value: 0.5
    unit: ratio
    tag: tecrube
    source: "arastirma/ham/guray/G7-whisper-arsiv.md#K-68"
    note: "Merdiven: önce artışı bırak → hacmi yarıya → tam çöküşte 1 hafta tam mola (K-70). Takvimsel deload yok (K-66)."
  - key: deload_load_reduction_min
    value: 0.30
    unit: ratio
    tag: tecrube
    source: "arastirma/03-guray-karar-omurgasi.md#7.1"
    note: "Alternatif deload: yükü %30-40 düşürüp kasa odaklan (G6)."
  - key: deload_load_reduction_max
    value: 0.40
    unit: ratio
    tag: tecrube
    source: "arastirma/03-guray-karar-omurgasi.md#7.1"
  - key: plateau_sessions
    value: 3
    unit: sessions
    tag: literatur
    source: "arastirma/ham/H3-bosluk-literatur.md#B5"
    note: "Antrenman platosu: aynı egzersizde 3 ardışık seans ne tekrar ne yük artışı (H3 B5). Kanıt: uzman görüşü, RCT'li eşik yok — ADR-020 ile onaylandı. Güray K-68 merdivenin ilk basamağını tetikler."
  - key: overtraining_missed_plan_weeks
    value: 2
    unit: weeks
    tag: tecrube
    source: "arastirma/ham/guray/G7-whisper-arsiv.md#K-73"
    note: "Overtraining = planlanan antrenmanı planlandığı gibi yapamamak (K-73, ikili test). Tedavisi 1 hafta TAM mola (K-70). Güray sayı vermiyor; tek kaçan hafta tesadüf olabilir, iki hafta üst üste = sinyal (ADR-020 L-12)."
