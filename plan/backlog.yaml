# keel backlog — TEK KAYNAK (ADR-002).
# GitHub Issues + Project bu dosyadan üretilir: python3 tools/sync_backlog.py --dry-run | --apply
# GitHub'da başlık/kapsam elle değiştirilmez; önce bu dosya değişir.
# Alanlar: id · title · milestone · module · type (feature|spike|chore|test|docs|human) · size (S|M|L)
#          status (todo|doing|done) · depends_on · why · acceptance · tests · refs · learn
# Kural: acceptance boş olan görev başlatılamaz (skill gorev-baslat). L boyutlu görev başlamadan bölünür.

schema: 1

milestones:
  - {id: M0, title: "Temel", goal: "Agent'ın saçmalamadığı, unutmadığı bir depo; iskelet ve CI yeşil"}
  - {id: M1, title: "Karar motoru çekirdeği", goal: "Güray omurgası + literatür, saf Java, tablo testleriyle kanıtlı"}
  - {id: M2, title: "Backend temel servisler", goal: "Motoru gerçek veriyle besleyen API"}
  - {id: M3, title: "Mobil kabuk", goal: "C dilinde, offline-first, sözleşmeden tipli iskelet"}
  - {id: M4, title: "Günlük akış", goal: "Kullanıcının günü ~40 saniye"}
  - {id: M5, title: "Karar anları + koç", goal: "Karar kartı, gerekçe, itiraza dayanan koç"}
  - {id: M6, title: "İlerleme", goal: "Gelişimi kanıtla göstermek"}
  - {id: M7, title: "Abonelik", goal: "Satın alma, yetki, kota"}
  - {id: M8, title: "Uyum ve yasal", goal: "Yasal metinler, silme, App Store uyumu"}
  - {id: M9, title: "Beta", goal: "Dağıtım, TestFlight, başvurulu kohort, öncü göstergeler"}
  - {id: M10, title: "Lansman", goal: "İsim, ASO, mağaza, lansman günü"}
  - {id: M11, title: "Lansman sonrası", goal: "Maliyeti görünsün diye listede duran, ilk yayında olmayan işler"}

