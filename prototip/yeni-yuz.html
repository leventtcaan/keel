<title>Keel Yeni Yüz Prototipi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: prototype chrome (screen index + review sheet, Turkish, follows the viewer's theme) around one phone.
   The phone owns its own theme (ADR-069: light by default, in-app picker) and its own accent (RUBİN or SAHA, L2 §8). */
:root{
  --c-bg:#ECECE8; --c-panel:#FFFFFF; --c-fg:#18181B; --c-muted:#5D5D64; --c-line:#D7D7D2; --c-chip:#F1F1EE;
  --c-ok:#1D7A3B; --c-over:#B42318; --c-bezel:#0B0B0C; --c-focus:#2B59C3;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --pbar-h:52px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--c-bg:#0E0E10;--c-panel:#18181B;--c-fg:#ECECEE;--c-muted:#A2A2AA;--c-line:#2D2D33;--c-chip:#232328;--c-ok:#5CC57D;--c-over:#FF8B7E;--c-bezel:#2A2A2F;--c-focus:#8FB0FF;color-scheme:dark}
}
:root[data-theme="dark"]{--c-bg:#0E0E10;--c-panel:#18181B;--c-fg:#ECECEE;--c-muted:#A2A2AA;--c-line:#2D2D33;--c-chip:#232328;--c-ok:#5CC57D;--c-over:#FF8B7E;--c-bezel:#2A2A2F;--c-focus:#8FB0FF;color-scheme:dark}

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--c-bg);color:var(--c-fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c-focus);outline-offset:2px}

/* ---------- chrome ---------- */
.proto{display:grid;grid-template-columns:340px minmax(0,1fr);height:100%}
.index{overflow-y:auto;background:var(--c-panel);border-right:1px solid var(--c-line);padding-block:20px 32px;padding-inline:20px;display:flex;flex-direction:column;gap:18px}
.ihead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ihead h1{margin:0;font:800 26px/1 var(--f-display);text-transform:uppercase}
.iclose{display:none;border:1px solid var(--c-line);background:var(--c-chip);border-radius:6px;min-height:40px;padding-inline:14px}
.ilead{margin:0;color:var(--c-muted);font-size:14px}
.ctrls{display:grid;gap:10px}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.cseg{display:flex;border:1px solid var(--c-line);border-radius:6px;overflow:hidden}
.cseg button{border:0;background:none;min-height:36px;padding-inline:12px;font-size:13px;font-weight:600;color:var(--c-muted)}
.cseg button[aria-pressed="true"]{background:var(--c-fg);color:var(--c-panel)}
.flow h2{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--c-muted)}
.flow ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.item{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;border:0;background:none;text-align:left;border-radius:6px;padding:7px 8px;min-height:40px}
.item:hover{background:var(--c-chip)}
.item[aria-current="true"]{background:var(--c-chip);box-shadow:inset 0 0 0 1px var(--c-line)}
.item .nm{min-width:0;font-size:14px}
.item .nm small{display:block;color:var(--c-muted);font-size:11.5px}
.wc{font-size:12px;font-variant-numeric:tabular-nums;color:var(--c-muted);white-space:nowrap}
.wc.ok{color:var(--c-ok)} .wc.over{color:var(--c-over);font-weight:700}
.vd{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;font-size:11px;font-weight:800;border:1px dashed var(--c-line);color:var(--c-muted)}
.vd.keep{background:var(--c-ok);border:0;color:var(--c-panel)}
.vd.change{background:var(--c-fg);border:0;color:var(--c-panel)}
.vd.drop{background:var(--c-over);border:0;color:var(--c-panel)}
.ibtn{border:1px solid var(--c-line);background:var(--c-chip);border-radius:6px;min-height:42px;padding-inline:14px;font-weight:600;font-size:14px}
.general{display:grid;gap:8px}
.general label{font-size:13px;font-weight:700}
.general textarea,.rv textarea{width:100%;min-height:84px;border:1px solid var(--c-line);border-radius:6px;background:var(--c-panel);padding:10px;resize:vertical}
.istat{margin:0;font-size:12.5px;color:var(--c-muted)}

.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:auto;padding-block:16px;padding-inline:16px;min-width:0}
.pbar{width:390px;max-width:100%;height:var(--pbar-h);display:flex;align-items:center;gap:8px;border:1px dashed var(--c-line);border-radius:10px;padding-inline:6px;background:var(--c-panel)}
.pbtn{border:0;background:var(--c-chip);border-radius:6px;min-height:40px;padding-inline:12px;font-size:13.5px;font-weight:700;white-space:nowrap}
.pbtn.rvb{background:var(--c-fg);color:var(--c-panel)}
.pbinfo{flex:1;min-width:0;display:grid;line-height:1.15;text-align:center}
.pbinfo b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbinfo span{font-size:12px;font-variant-numeric:tabular-nums;color:var(--c-muted)}
.pbinfo span.ok{color:var(--c-ok)} .pbinfo span.over{color:var(--c-over);font-weight:700}

.rv{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.rvbox{width:min(460px,100%);background:var(--c-panel);color:var(--c-fg);border-radius:14px 14px 0 0;padding-block:18px 26px;padding-inline:18px;display:grid;gap:12px;padding-bottom:calc(26px + env(safe-area-inset-bottom,0px))}
.rvbox h2{margin:0;font:800 24px/1.05 var(--f-display);text-transform:uppercase}
.rvbox p{margin:0;color:var(--c-muted);font-size:13.5px}
.rvbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rvbtns button{min-height:52px;border-radius:6px;border:1.5px solid var(--c-line);background:var(--c-panel);font-weight:700}
.rvbtns button[aria-pressed="true"][data-v="keep"]{background:var(--c-ok);border-color:var(--c-ok);color:var(--c-panel)}
.rvbtns button[aria-pressed="true"][data-v="change"]{background:var(--c-fg);border-color:var(--c-fg);color:var(--c-panel)}
.rvbtns button[aria-pressed="true"][data-v="drop"]{background:var(--c-over);border-color:var(--c-over);color:var(--c-panel)}
.rvrow{display:flex;gap:8px;justify-content:flex-end}

/* ---------- phone ---------- */
.phone{
  --bg:#FFFFFF; --surface:#F3F3F1; --line:#E3E3DF; --ink:#0E0E0E; --muted:#5B5B60; --faint:#8C8C92;
  --block:#0E0E0E; --block-fg:#FFFFFF; --block-muted:#B3B3B9; --block-line:#2C2C30;
  --accent:#B0129A; --on-accent:#FFFFFF; --accent-text:#B0129A; --accent-ink:#F07BE0; --accent-soft:#F7E7F4;
  --warn:#D12F1F; --glass:rgba(250,250,248,.82); --scrim:rgba(14,14,14,.36); --cam:#0A0A0A; --cam-fg:#F4F4F2;
  --check-a:#E6E6E2; --check-b:#F7F7F5;
  width:390px;height:min(844px,calc(100vh - 110px));min-height:600px;max-width:100%;
  border-radius:46px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);
  box-shadow:0 0 0 11px var(--c-bezel),0 30px 70px rgba(0,0,0,.28);font-family:var(--f-body);
}
.phone[data-mode="dark"]{
  --bg:#141416; --surface:#1E1E21; --line:#2F2F34; --ink:#F3F3F1; --muted:#A7A7AD; --faint:#7D7D84;
  --block:#F3F3F1; --block-fg:#0E0E0E; --block-muted:#56565C; --block-line:#D5D5D1;
  --accent:#F07BE0; --on-accent:#0E0E0E; --accent-text:#F07BE0; --accent-ink:#B0129A; --accent-soft:#3B1C36;
  --warn:#FF6B5A; --glass:rgba(30,30,33,.82); --scrim:rgba(0,0,0,.55); --check-a:#2A2A2E; --check-b:#1E1E21;
  color-scheme:dark;
}
.phone[data-accent="saha"]{--accent:#0B7F05;--accent-text:#0B7F05;--accent-ink:#9BE7A6;--accent-soft:#E2F2E1}
.phone[data-accent="saha"][data-mode="dark"]{--accent:#9BE7A6;--on-accent:#0E0E0E;--accent-text:#9BE7A6;--accent-ink:#0B7F05;--accent-soft:#17301A}

.app{position:absolute;inset:0;background:var(--bg);color:var(--ink);overflow:hidden;font-size:16px;line-height:1.4}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-block:22px 128px;padding-inline:20px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.notabs{padding-bottom:28px}
.num,.tnum{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.title{margin:0;font:800 34px/1 var(--f-display);text-transform:uppercase;letter-spacing:.005em}
.navtop{display:grid;grid-template-columns:minmax(44px,1fr) auto minmax(44px,1fr);align-items:center;gap:8px;min-height:44px;margin-inline:-8px}
.navtop .iconbtn{justify-self:start}
.navtop h1{margin:0;text-align:center;font:800 24px/1 var(--f-display);text-transform:uppercase}
.navtop .side{font-size:13.5px;color:var(--muted);justify-self:end;white-space:nowrap;padding-right:8px}
.iconbtn{width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--ink);display:grid;place-items:center}
.iconbtn.surf{background:var(--surface)}
h2.h{margin:0;font-size:15px;font-weight:700}
.fine{margin:0;font-size:13.5px;color:var(--muted)}
.center{text-align:center}

.btn{min-height:50px;border-radius:6px;border:0;font-weight:700;font-size:16px;padding-inline:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sm{min-height:44px;font-size:15px;padding-inline:16px}
.btn.wide{width:100%}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.line{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.tlink{border:0;background:none;color:var(--accent-text);font-weight:600;font-size:15px;min-height:44px;padding-inline:4px}
.tlink.muted{color:var(--muted)}
.dock{position:sticky;bottom:0;margin-top:auto;padding-top:12px;background:var(--bg);display:grid;gap:8px}
.dock.two{grid-template-columns:1fr 1fr}

/* onboarding */
.obtop{display:flex;align-items:center;gap:10px;margin-inline:-8px}
.steps{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-right:12px}
.steps span{height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--ink)}
.q{margin:6px 0 0;font:700 34px/1.02 var(--f-display);text-wrap:balance}
.why{margin:-8px 0 0;color:var(--muted);font-size:15.5px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;min-height:64px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:14px 16px;display:grid;gap:2px;font-size:17px;font-weight:600}
.opt small{font-size:14px;font-weight:400;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.lbl{margin:0;font-size:14px;font-weight:600;color:var(--muted)}
.dchips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dchip{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:15px;color:var(--ink)}
.dchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-radius:6px;background:var(--surface);padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:4px;min-height:40px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.infer{margin:0;padding:12px 14px;border-radius:6px;background:var(--surface);font-weight:600}
.fields{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:14px;font-weight:600;color:var(--muted)}
.inbox{display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--line);min-height:48px}
.inbox input{flex:1;min-width:0;border:0;background:none;font-size:22px;font-weight:600;padding:0;outline-offset:4px}
.inbox span{color:var(--muted);font-weight:600}
.ftext{font-size:13px;color:var(--muted);border-left:0;margin:0;padding:12px;border-radius:6px;background:var(--surface)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;font-weight:600}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(20px)}

.prep{display:grid;gap:16px;margin-top:40px}
.prep li{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600;opacity:.28;transition:opacity .3s}
.prep li.on{opacity:1}
.prep ol{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.tick{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.prep li.on .tick{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* the call block: the inverse of the ground (L2 §8) */
.block{background:var(--block);color:var(--block-fg);border-radius:6px;padding:16px 18px 16px;display:grid;gap:10px}
.block .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--block-muted);font-size:13.5px;min-height:28px}
.blink{border:0;background:none;color:var(--block-fg);font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:2px;min-height:44px;margin-block:-8px;padding-inline:4px}
.label{margin:0;font:800 46px/.92 var(--f-display);text-transform:uppercase;text-wrap:balance}
.block .line{margin:0;font-size:16.5px;line-height:1.35}
.block .acc{color:var(--accent-ink);font-weight:700}
.block .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--block-line);padding-top:10px;font-size:14.5px}
.block .foot b{font:700 20px/1 var(--f-display)}
.block .status{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.counted{display:flex;gap:8px;flex-wrap:wrap}
.counted span{border:1px solid var(--block-line);border-radius:4px;padding:5px 9px;font-size:13.5px}

/* home */
.weekhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted);margin-bottom:-8px}
.weekhead b{color:var(--ink);font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.mark{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;position:relative;color:transparent}
.mark.planned{border-style:dashed;border-color:var(--faint)}
.mark.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mark.logged::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink)}
.mark.today{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--accent)}
.day.is-today{color:var(--ink)}
.todo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.todo .k{font-size:13.5px;color:var(--muted)}
.todo .v{font-size:18px;font-weight:700}
.food{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:none;color:var(--ink);padding:0;min-height:44px;text-align:left}
.food .k{font-size:15px;color:var(--muted)}
.food .v{font-size:17px;font-weight:700}

/* tab bar: the system layer (neutral glass), + beside it */
.tabbar{position:absolute;left:14px;right:14px;bottom:16px;display:flex;align-items:center;gap:10px;z-index:5}
.tabs{flex:1;display:flex;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);border-radius:34px;height:64px;padding:5px}
.tab{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;border-radius:28px}
.tab[aria-current="page"]{color:var(--ink);background:var(--surface)}
.fab{width:64px;height:64px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}

/* lists and sections */
.sect{display:grid;gap:10px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding-block:8px;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.rows .t{display:grid;gap:1px;min-width:0}
.rows .t b{font-weight:600}
.rows .t span{font-size:13.5px;color:var(--muted)}
.rows .r{display:flex;align-items:center;gap:8px;flex:none;font-weight:600}
.rowbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:none;color:var(--ink);text-align:left;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.rowbtn .rv2{color:var(--muted);display:flex;align-items:center;gap:4px;font-size:15px}
.big{font:800 34px/1 var(--f-display)}
.tag{display:inline-block;border-radius:4px;padding:2px 7px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent-text)}
.tag.ink{background:var(--surface);color:var(--ink)}
.banner{display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;border-radius:6px;background:var(--surface);color:var(--ink);padding:12px 14px;min-height:52px;font-weight:600}
.banner svg{flex:none}
.dcards{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.dcard{border:1.5px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:10px}
.dcard.today{border-color:var(--ink)}
.dcard .dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dcard .dh b{font:700 22px/1 var(--f-display);text-transform:uppercase;margin-right:6px}
.dcard .done{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;font-weight:600}
.moves{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14.5px;color:var(--muted)}
.moves li{display:flex;justify-content:space-between}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.grid12 span{aspect-ratio:1;border-radius:4px;background:var(--ink)}
.grid12 span.forg{background:none;box-shadow:inset 0 0 0 1.5px var(--ink)}
.grid12 span.open{background:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.grid12 span.now{background:none;box-shadow:inset 0 0 0 1.5px var(--accent)}
.empty{margin:0;padding:12px 14px;border-radius:6px;background:var(--surface);font-size:14.5px;color:var(--muted)}
.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.targets div{background:var(--surface);border-radius:6px;padding:10px 12px;display:grid;gap:2px}
.targets b{font:700 22px/1 var(--f-display)}
.targets span{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}

/* sheet, toast */
.sheetwrap{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 20px 30px;display:grid;gap:4px}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);justify-self:center;margin-bottom:8px}
.prow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--ink);text-align:left;min-height:62px;font-size:18px;font-weight:600;border-radius:6px;padding-inline:4px}
.prow .ic{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.prow small{display:block;font-size:13.5px;font-weight:400;color:var(--muted)}
.prow.minor{min-height:50px;font-size:15.5px;color:var(--muted)}
.prow.minor .ic{background:none;width:44px}
.sheet hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.sheet h2{margin:2px 0 0;font:700 26px/1.05 var(--f-display)}
.toast{position:absolute;left:14px;right:14px;bottom:96px;z-index:40;background:var(--ink);color:var(--bg);border-radius:6px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px;font-weight:600}
.toast.proto{background:var(--surface);color:var(--ink);border:1.5px dashed var(--faint)}
.toast button{border:0;background:none;color:inherit;font-weight:800;min-height:36px;text-decoration:underline}

/* weigh */
.scale{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:8px;margin-top:40px}
.step{width:64px;height:64px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-size:30px;font-weight:500;display:grid;place-items:center}
.wnum{display:flex;align-items:baseline;justify-content:center;gap:6px}
.wnum .num{font:800 84px/1 var(--f-display)}
.wnum span:last-child{font-size:20px;font-weight:700;color:var(--muted)}

/* meal */
.search{display:flex;gap:8px}
.search .inbox{flex:1;background:var(--surface);border:0;border-radius:6px;padding-inline:12px}
.search input{font-size:16px;font-weight:500}
.kc{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.addc{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--ink);display:grid;place-items:center}

/* camera-like views */
.cam{background:var(--cam);color:var(--cam-fg);border-radius:6px;position:relative;display:grid;place-items:center;overflow:hidden}
.cam .frame{position:absolute;inset:18%;border-radius:6px}
.cam .frame::before,.cam .frame::after{content:"";position:absolute;width:28px;height:28px;border:3px solid var(--cam-fg)}
.cam .frame::before{top:0;left:0;border-right:0;border-bottom:0}
.cam .frame::after{bottom:0;right:0;border-left:0;border-top:0}
.cam p{position:relative;margin:0;font-weight:600}
.protobtn{border:1.5px dashed var(--faint);background:none;color:var(--ink);border-radius:6px;min-height:44px;padding-inline:14px;font-weight:600;font-size:14px}

/* workout */
.wtop{display:flex;justify-content:space-between;align-items:center;margin-inline:-4px}
.wtime{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.mdots{display:flex;gap:6px}
.mdots span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.mdots span.on{background:var(--ink)}
.mname{margin:0;font:800 38px/1 var(--f-display);text-transform:none}
.target{margin:-6px 0 0;font-weight:600}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 54px 44px 44px 50px;align-items:center;gap:6px;min-height:56px;border-radius:6px;padding-inline:8px 6px;background:var(--surface)}
.set.hd{background:none;min-height:20px;font-size:12px;color:var(--muted);font-weight:600}
.set .no{font-weight:700;color:var(--muted)}
.set .last{font-size:13px;color:var(--muted)}
.set .val{font:700 22px/1 var(--f-display);text-align:center}
.rir{width:44px;height:40px;border-radius:4px;border:1.5px solid var(--line);background:var(--bg);font-weight:700}
.ck{width:50px;height:44px;border-radius:6px;border:1.5px solid var(--line);background:var(--bg);color:var(--muted);display:grid;place-items:center}
.set.done{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line)}
.set.done .ck{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rest{display:flex;justify-content:space-between;align-items:center;border-radius:6px;background:var(--ink);color:var(--bg);padding:10px 14px;font-weight:700}
.rest .wtime{font-size:26px}
.rest button{border:0;background:none;color:inherit;text-decoration:underline;font-weight:700;min-height:40px}

/* summary */
.sumhead{display:grid;gap:4px}
.sumhead .big{font-size:64px}

/* call */
.reasons{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.reasons li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15.5px}
.reasons li::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--ink);margin-top:7px;justify-self:center}
.cchips{display:flex;gap:8px;flex-wrap:wrap}
.cchips span{background:var(--surface);border-radius:4px;padding:6px 10px;font-size:14px;font-weight:600}
.meta2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meta2 div{border-top:1.5px solid var(--ink);padding-top:8px;display:grid;gap:2px}
.meta2 span{font-size:12.5px;color:var(--muted)}
.meta2 b{font-weight:700}
.changes{margin:0;padding:12px 14px;border-radius:6px;background:var(--accent-soft);font-size:15px}
.changes b{color:var(--accent-text)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btnrow .btn{padding-inline:10px}

/* reasoning */
.rules{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.rules li{display:grid;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.rules li:last-child{border-bottom:0;padding-bottom:0}
.rules p{margin:0}
.src{justify-self:start;font-size:12px;font-weight:700;border-radius:4px;padding:2px 7px;background:var(--surface);color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding-bottom:6px}
.tbl td{padding-block:8px;border-top:1px solid var(--line)}
.ifs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ifs li{display:grid;gap:3px;padding:10px 12px;border-radius:6px;background:var(--surface);font-size:14.5px}
.ifs b{font-weight:700}

/* share */
.sharewrap{display:grid;justify-items:center;gap:12px}
.card916{width:236px;aspect-ratio:9/16;max-width:100%;border-radius:10px;padding:22px 18px 16px;display:flex;flex-direction:column;gap:12px;background:#0E0E0E;color:#FFFFFF;position:relative;overflow:hidden}
.card916 .cl{font:800 50px/.9 var(--f-display);text-transform:uppercase;margin:0;text-wrap:balance}
.card916 .cline{margin:0;font-size:14px;line-height:1.3;color:#D8D8DC}
.card916 .cstat{margin-top:auto;display:grid;gap:10px}
.card916 .cstat div{display:grid;gap:1px}
.card916 .cstat b{font:800 30px/1 var(--f-display)}
.card916 .cstat span{font-size:12px;color:#B8B8BE}
.card916 .cfoot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #2E2E33;padding-top:8px;font-size:11px;color:#B8B8BE}
.card916 .cfoot b{font:800 16px/1 var(--f-display);color:#FFFFFF}
.card916 .cacc{color:var(--card-acc)}
.card916.sticker{background:repeating-conic-gradient(var(--check-a) 0 25%,var(--check-b) 0 50%) 0 0/16px 16px;color:#FFFFFF}
.card916.sticker .cl,.card916.sticker .cstat b,.card916.sticker .cfoot b{text-shadow:0 0 1px #000,0 1px 2px #000,0 0 8px rgba(0,0,0,.6)}
.card916.sticker .cline,.card916.sticker .cstat span,.card916.sticker .cfoot{color:#FFFFFF;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.7)}
.card916.sticker .cfoot{border-top-color:rgba(255,255,255,.5)}

/* welcome */
.welcome{min-height:100%;display:flex;flex-direction:column;gap:18px}
.wm{font:800 30px/1 var(--f-display);letter-spacing:.01em}
.demo{margin-top:14px;transform:rotate(-1.2deg)}
.hero-h{margin:auto 0 0;font:800 50px/.95 var(--f-display);text-wrap:balance}
.lead{margin:-6px 0 0;font-size:17px;color:var(--muted)}
.apple{background:var(--ink);color:var(--bg)}
.legal{margin:0;font-size:12px;color:var(--muted);text-align:center}

/* paywall */
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:20px 1fr;column-gap:12px;padding-bottom:16px;position:relative}
.tl li::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--bg);margin-top:3px;position:relative;z-index:1}
.tl li:first-child::before{background:var(--accent);border-color:var(--accent)}
.tl li::after{content:"";position:absolute;left:6px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl .tc{display:grid;gap:2px}
.tl b{font-size:15px}
.tl span{font-size:15px;color:var(--muted)}
.plans{display:grid;gap:8px}
.plan{display:flex;justify-content:space-between;align-items:center;width:100%;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-height:58px;padding-inline:14px;font-weight:600;text-align:left}
.plan[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.plan span{color:var(--muted);font-weight:500}
.leglinks{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:12.5px}
.leglinks button{border:0;background:none;color:var(--muted);text-decoration:underline;min-height:32px}

/* settings */
.sgroup{display:grid;gap:2px}
.sgroup h2{margin:0 0 2px;font-size:13px;font-weight:700;color:var(--muted)}
.danger{color:var(--warn)!important}

@media (max-width:820px){
  .proto{grid-template-columns:minmax(0,1fr)}
  .index{position:fixed;inset:0;z-index:60;transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .index.open{transform:none}
  .iclose{display:inline-block}
  .stage{padding:0;gap:0;justify-content:flex-start}
  .pbar{width:100%;border-radius:0;border-width:0 0 1px 0}
  .phone{width:100%;flex:1;height:auto;min-height:0;border-radius:0;box-shadow:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem('keel-proto-' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('keel-proto-' + k, JSON.stringify(v)); } catch {} },
};

/* ---------- icons (stroke, currentColor) ---------- */
const sv = (d, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  back: sv('<path d="M15 18l-6-6 6-6"/>', 24),
  chev: sv('<path d="M9 18l6-6-6-6"/>', 16),
  gear: sv('<circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>'),
  plus: sv('<path d="M12 5v14M5 12h14"/>', 28),
  check: sv('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 18),
  scale: sv('<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8.5 9.5a5 5 0 0 1 7 0M12 9.5l1.5-1.5"/>'),
  meal: sv('<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2.2 1.3-3 4-3 7h3"/>'),
  bar: sv('<path d="M3 10v4M6.5 7v10M17.5 7v10M21 10v4M6.5 12h11"/>'),
  barcode: sv('<path d="M4 6v12M7.5 6v12M11 6v12M13.5 6v12M17 6v12M20 6v12"/>'),
  share: sv('<path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>', 20),
  pause: sv('<path d="M9 5v14M15 5v14"/>'),
  x: sv('<path d="M6 6l12 12M18 6L6 18"/>'),
  week: sv('<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 3v3M16 3v3"/>'),
  trend: sv('<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>'),
  info: sv('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>', 20),
  minus: sv('<path d="M5 12h14"/>', 26),
  plus2: sv('<path d="M12 5v14M5 12h14"/>', 26),
  cam: sv('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),
};

/* ---------- state ---------- */
const S = {
  scenario: 'd1', mode: store.get('mode', 'light'), accent: store.get('accent', 'rubin'),
  screen: 'welcome', stack: [], sheet: null, under: null, toast: null, startView: false,
  ob: { goal: null, program: null, days: ['MON', 'WED', 'FRI'], sessions: '2-3', units: 'metric', sex: 'male', activity: null, consent: null },
  prep: 0, remMon: false, trialRem: false, plan: 'year',
  weight: 80.2, d1Weight: 84.0, d1Weighs: 0, healthAsked: false,
  checkin: null, kept: { d1: false, w12: false }, share: { fmt: 'card', best: true },
  life: { kind: null, len: 'back' }, scanned: false,
  wo: { move: 0, done: {}, rir: {} }, restEnd: 0, woStart: Date.now() - 24 * 60000,
  counts: store.get('counts', {}), verdicts: {},
};

/* ---------- persona data (prototype; every number from the engine's own rules, see prototip/envanter.md) ---------- */
const WEEK = [['MON', 'M', 'Monday'], ['TUE', 'T', 'Tuesday'], ['WED', 'W', 'Wednesday'], ['THU', 'T', 'Thursday'], ['FRI', 'F', 'Friday'], ['SAT', 'S', 'Saturday'], ['SUN', 'S', 'Sunday']];
const SHORT = { MON: 'Mon', TUE: 'Tue', WED: 'Wed', THU: 'Thu', FRI: 'Fri', SAT: 'Sat', SUN: 'Sun' };
const MOVES = [
  { name: 'Back squat', sets: 3, kg: 100, reps: 6, rir: 2, last: '97.5 × 6' },
  { name: 'Bench press', sets: 3, kg: 72.5, reps: 8, rir: 2, last: '72.5 × 8', held: true },
  { name: 'Cable row', sets: 3, kg: 60, reps: 10, rir: 2, last: '57.5 × 10' },
  { name: 'Romanian deadlift', sets: 3, kg: 90, reps: 8, rir: 2, last: '87.5 × 8' },
  { name: 'Lateral raise', sets: 2, kg: 10, reps: 12, rir: 1, last: '10 × 11' },
];
const WEIGHT12 = [84.1, 84.0, 83.6, 83.1, 82.8, 82.4, 82.0, 81.7, 81.3, 81.0, 80.6, 80.2];
const BENCH = [65, 67.5, 67.5, 70, 70, 72.5, 72.5, 72.5, 72.5];
const SQUAT = [80, 82.5, 85, 87.5, 90, 92.5, 95, 97.5, 100];
const RDL = [70, 72.5, 75, 77.5, 80, 82.5, 85, 87.5, 90];

const CALLS = {
  w12: {
    date: 'Mon, Dec 28', label: 'Hold the weight',
    line: 'Bench stays at <span class="acc tnum">72.5 kg</span>. Everything else climbs.',
    applied: "In this week's plan", keptMsg: "You're keeping last week's plan. The call stays on record.",
    reasons: ['Bench: 72.5 × 8 for 3 weeks, last sets at RIR&nbsp;0.', 'Other lifts still climb. Food stays: weight is on pace.'],
    chips: ['Sessions 3/3', 'Weigh-ins 6/7'], conf: 'Medium', next: 'Mon, Jan 4',
    changes: '<b>Changes it:</b> 8 reps at RIR 1 → weight goes up.', keep: "Keep last week's plan",
    chart: () => lineChart(BENCH, { h: 92, lo: 62.5, hi: 75, flatFrom: 5, labels: ['65', '72.5'] }),
    share: { line: 'Bench stalled 3 weeks. One more week at 72.5.' },
  },
  d1: {
    date: 'Mon, Oct 19', label: '2 days, not 3',
    line: 'Wed didn\'t happen. Next week: <span class="acc">Mon and Fri</span>.',
    applied: "In next week's plan", keptMsg: "You're keeping 3 days. The call stays on record.",
    reasons: ['A plan that fits gets done first.', "Food and weight aren't judged yet: day 8 of 14."],
    chips: ['Sessions 2/3', 'Weigh-ins 5/7'], conf: 'Medium', next: 'Mon, Oct 26',
    changes: '<b>Changes it:</b> two weeks with both days done → Wednesday comes back.', keep: 'Keep 3 days',
    chart: () => sessionsChart(),
    share: { line: 'Two days that happen beat three that don\'t.' },
  },
};

/* ---------- small renderers ---------- */
function lineChart(vals, { h = 110, lo, hi, flatFrom = -1, labels = [], area = false } = {}) {
  const w = 340, padL = 34, padR = 14, padT = 12, padB = 14;
  const min = lo ?? Math.min(...vals), max = hi ?? Math.max(...vals);
  const x = i => padL + i * (w - padL - padR) / (vals.length - 1);
  const y = v => padT + (1 - (v - min) / (max - min)) * (h - padT - padB);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const flat = flatFrom >= 0 ? vals.slice(flatFrom).map((v, i) => `${x(i + flatFrom).toFixed(1)},${y(v).toFixed(1)}`).join(' ') : '';
  const last = vals.length - 1;
  const a = area ? `<polygon points="${x(0)},${h - padB} ${pts} ${x(last)},${h - padB}" fill="var(--surface)"/>` : '';
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Chart">${a}
    <line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" stroke="var(--line)" stroke-width="1"/>
    <polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${flat ? `<polyline points="${flat}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>` : ''}
    <circle cx="${x(last)}" cy="${y(vals[last])}" r="5" fill="var(--accent)"/>
    ${labels[0] ? `<text x="${padL - 6}" y="${y(vals[0]) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${labels[0]}</text>` : ''}
    ${labels[1] ? `<text x="${padL - 6}" y="${y(vals[last]) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${labels[1]}</text>` : ''}
  </svg>`;
}
function spark(vals, flatFrom = -1) {
  const w = 72, h = 26, min = Math.min(...vals), max = Math.max(...vals);
  const x = i => 2 + i * (w - 4) / (vals.length - 1), y = v => 3 + (1 - (v - min) / ((max - min) || 1)) * (h - 6);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const flat = flatFrom >= 0 ? vals.slice(flatFrom).map((v, i) => `${x(i + flatFrom).toFixed(1)},${y(v).toFixed(1)}`).join(' ') : '';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${flat ? `<polyline points="${flat}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>` : ''}<circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="3" fill="var(--accent)"/></svg>`;
}
function sessionsChart() {
  const days = [['Mon', 1], ['Wed', 0], ['Fri', 1]];
  return `<div class="week" style="grid-template-columns:repeat(3,1fr)" aria-label="Sessions this week: Monday done, Wednesday not, Friday done">${days.map(([d, ok]) => `<div class="day"><span class="mark ${ok ? 'done' : 'planned'}">${ok ? I.check : ''}</span><span>${d}</span></div>`).join('')}</div>`;
}

const d1 = () => S.scenario === 'd1';

function weekStrip() {
  const today = d1() ? 'MON' : 'FRI';
  const state = d1()
    ? { MON: 'planned', WED: 'planned', FRI: 'planned' }
    : { MON: 'done', TUE: 'logged', WED: 'done', THU: 'logged', FRI: 'planned' };
  if (d1() && S.d1Weighs > 0) state.MON = 'planned logged';
  const head = d1()
    ? `<div class="weekhead"><span>Week <b class="tnum">1</b></span><span>Counts by week, never by day</span></div>`
    : `<div class="weekhead"><span>Week <b class="tnum">12</b></span><span><b class="tnum">11/12</b> weeks on track</span></div>`;
  return head + `<div class="week" role="list" aria-label="This week">${WEEK.map(([k, l, full]) => {
    const st = state[k] || '';
    const label = full + (st.includes('done') ? ', trained' : st.includes('logged') ? ', logged' : st.includes('plan') ? ', planned' : '') + (k === today ? ', today' : '');
    return `<div class="day ${k === today ? 'is-today' : ''}" role="listitem" aria-label="${label}"><span class="mark ${st} ${k === today ? 'today' : ''}">${st.includes('done') ? I.check : ''}</span><span data-nc>${l}</span></div>`;
  }).join('')}</div>`;
}

}

function updateBar() {
  const id = S.sheet || S.screen; const sc = SCREENS[id];
  $('#pb-name').textContent = `${sc.n} · #${id}`;
  const n = countWords();
  if (sc.t != null) S.counts[ckey(id)] = n;
  store.set('counts', S.counts);
  const el = $('#pb-count');
  el.className = sc.t == null ? '' : n <= sc.t ? 'ok' : 'over';
  el.textContent = sc.t == null ? `${n} kelime (hedef yok)` : `${n} / ${sc.t} kelime · ${n <= sc.t ? 'hedefte' : 'fazla'}`;

function countWords() {
  const id = S.sheet || S.screen; const sc = SCREENS[id]; const app = $('#app');
  let root, limit = Infinity;
  if (S.sheet) root = $('.sheet', app);
  else if (sc.countRoot) root = $(sc.countRoot, app);
  else { root = $('#scr'); const b = root.getBoundingClientRect(); limit = b.top + root.clientHeight; }
  if (!root) return 0;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const range = document.createRange();
  let n = 0, node;
  while ((node = walker.nextNode())) {
    const p = node.parentElement;
    if (!p || p.closest('[data-nc],[data-legal],.tabbar,svg,script,style')) continue;
    const m = node.textContent.match(/[A-Za-z][A-Za-z'’\-]*/g); if (!m) continue;
    range.selectNodeContents(node); const r = range.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) continue;
    if (r.top >= limit) continue;
    n += m.length;
  }
  return n;
}
function measureAll() {
  const saved = { screen: S.screen, sheet: S.sheet, scenario: S.scenario, stack: [...S.stack], prep: S.prep, toast: S.toast };
  S.toast = null; S.prep = 3;
  for (const f of FLOWS) for (const id of f.items) {
    S.scenario = f.sc;
    if (SCREENS[id].sheet) { S.sheet = id; S.screen = SCREENS[id].under || 'home'; } else { S.sheet = null; S.screen = id; }
    renderSilently();
    if (SCREENS[id].t != null) S.counts[ckey(id, f.sc)] = countWords();
  }
  Object.assign(S, saved);
  store.set('counts', S.counts);
  render(true);
}
function renderSilently() {
  applyPhone();
  const sc = SCREENS[S.screen];
  $('#app').innerHTML = `<div class="scr ${sc.tabs ? '' : 'notabs'}" id="scr">${sc.r()}</div>${sc.tabs ? tabbar() : ''}${S.sheet ? `<div class="sheetwrap">${SCREENS[S.sheet].r()}</div>` : ''}`;
}

/* ---------- navigation ---------- */
function go(id, { replace = false, reset = false } = {}) {
  if (!SCREENS[id]) return toast('Bu ekran çizilmedi.', true);
  if (SCREENS[id].sheet) { S.sheet = id; S.toast = null; return render(); }
  if (reset) S.stack = []; else if (!replace) S.stack.push(S.screen);
  S.screen = id; S.sheet = null; S.toast = null;
  if (id === 'ob-preparing') S.prep = 0;
  if (id === 'workout') { S.wo = { move: 0, done: {}, rir: {} }; S.restEnd = 0; }
  if (id === 'barcode') S.scanned = false;
  closeIndexMobile();
  render(true);
}
function back() {
  if (S.sheet) { S.sheet = null; return render(); }
  S.screen = S.stack.pop() || (S.screen.startsWith('ob-') ? 'welcome' : 'home');
  S.startView = false; S.toast = null;
  render(true);
}
function toast(text, proto = false, undo = false) {
  S.toast = { text, proto, undo }; render();
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, proto ? 3200 : 2600);
}
function runPrep() {
  clearTimeout(prepTimer);
  if (S.prep >= 3) { prepTimer = setTimeout(() => { if (S.screen === 'ob-preparing') go('ob-start', { replace: true }); }, 900); return; }
  prepTimer = setTimeout(() => { if (S.screen !== 'ob-preparing') return; S.prep += 1; render(); }, 700);
}
function tickWorkout() {
  const el = $('#wtime'); if (!el) return;
  const s = Math.floor((Date.now() - S.woStart) / 1000) % 5400;
  el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}
function paintRest() {
  const slot = $('#restslot'); if (!slot) return;
  const left = Math.max(0, Math.round((S.restEnd - Date.now()) / 1000));
  slot.innerHTML = left > 0 ? `<div class="rest" role="timer" aria-label="Rest"><span>Rest</span><span class="wtime tnum">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</span><button type="button" data-act="skiprest">Skip</button></div>` : '';
}
setInterval(() => { if (S.screen === 'workout') { tickWorkout(); paintRest(); } }, 1000);

/* ---------- actions ---------- */
const ACT = {
  back, home: () => go('home', { reset: true }),
  plus: () => go('plus'), closesheet: (v, e) => { if (e.target.classList.contains('sheetwrap')) { S.sheet = null; render(); } },
  signin: () => { S.scenario = 'd1'; go('ob-goal'); },
  pick: (v, e, el) => {
    S.ob[el.dataset.key] = v; render();
    const next = { goal: 'ob-program', program: 'ob-days', activity: 'ob-preparing' }[el.dataset.key];
    setTimeout(() => go(next), 220);
  },
  day: v => { const i = S.ob.days.indexOf(v); i >= 0 ? S.ob.days.splice(i, 1) : S.ob.days.push(v); S.ob.days.sort((a, b) => WEEK.findIndex(w => w[0] === a) - WEEK.findIndex(w => w[0] === b)); render(); },
  sess: v => { S.ob.sessions = v.replace('–', '-'); render(); },
  sex: v => { S.ob.sex = v; render(); },
  consent: v => { S.ob.consent = v; if (v === 'yes') go('ob-about'); else render(); },
  remmon: (v, e, el) => { S.remMon = el.checked; if (el.checked) toast('iOS asks for notifications here.', true); },
  trialrem: () => { S.trialRem = !S.trialRem; render(); if (S.trialRem) toast('iOS asks for notifications here (ADR-058 #105).', true); },
  plan: v => { S.plan = v; render(); },
  trial: () => { S.scenario = 'd1'; S.d1Weighs = 0; S.healthAsked = false; toast('Apple’s purchase sheet opens here.', true); setTimeout(() => go('home', { reset: true }), 900); },
  startview: () => { S.startView = true; go('ob-start'); },
  toweigh: () => { S.sheet = null; go('weigh'); },
  w: v => { const k = d1() ? 'd1Weight' : 'weight'; S[k] = Math.round((S[k] + Number(v)) * 10) / 10; render(); },
  saveweigh: () => {
    if (d1() && !S.healthAsked) { S.sheet = 'health-jit'; return render(); }
    finishWeigh();
  },
  health: v => { S.healthAsked = true; S.sheet = null; if (v === 'yes') toast('Apple’s Health permission sheet opens here.', true); setTimeout(finishWeigh, v === 'yes' ? 1200 : 0); },
  logmeal: v => { go('home', { reset: true }); toast(v, false, true); },
  untoast: () => { S.toast = null; render(); },
  scan: () => { S.scanned = true; render(); },
  set: v => { S.wo.done[v] = !S.wo.done[v]; if (S.wo.done[v]) S.restEnd = Date.now() + 150000; render(); },
  rir: v => { const m = MOVES[S.wo.move]; const cur = S.wo.rir[v] ?? m.rir; S.wo.rir[v] = (cur + 1) % 5; render(); },
  skiprest: () => { S.restEnd = 0; paintRest(); },
  nextmove: () => { S.wo.move += 1; S.restEnd = 0; render(true); },
  ci: v => { S.checkin = v; render(); },
  keep: v => { S.kept[v] = !S.kept[v]; render(); },
  fmt: v => { S.share.fmt = v; render(); },
  best: (v, e, el) => { S.share.best = el.checked; render(); },
  ret: v => { go('home', { reset: true }); toast(v); },
  lk: v => { S.life.kind = v; render(); },
  ll: v => { S.life.len = v; render(); },
  pause: () => { go('home', { reset: true }); toast('This week is paused.'); },
  mode: v => { S.mode = v; store.set('mode', v); render(); },
  kept: v => toast(v, true),
  proto: v => toast(v, true),
};
function finishWeigh() {
  if (d1()) { S.d1Weighs += 1; go('home', { reset: true }); toast('Saved. Trend shows after 7 weigh-ins.'); }
  else { go('home', { reset: true }); toast('Saved · 7-day average 80.3 kg'); }
}

$('#app').addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-act],[data-tab]'); if (!el || el.disabled || el.matches('input[type=checkbox]')) return;
  if (el.dataset.tab) { S.stack = []; S.screen = el.dataset.tab; S.sheet = null; S.toast = null; return render(true); }
  if (el.dataset.go) { if (el.dataset.go === 'ob-start') S.startView = false; return go(el.dataset.go, { replace: !!el.dataset.replace }); }
  const f = ACT[el.dataset.act]; if (f) f(el.dataset.val, e, el);
});
$('#app').addEventListener('change', e => {
  const el = e.target.closest('input[type=checkbox][data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (f) f(el.dataset.val, e, el);
});

/* ---------- chrome events ---------- */
function closeIndexMobile() { $('#index').classList.remove('open'); }
$('#pb-index').addEventListener('click', () => $('#index').classList.add('open'));
$('#iclose').addEventListener('click', closeIndexMobile);
$('#flows').addEventListener('click', e => {
  const b = e.target.closest('[data-open]'); if (!b) return;
  const id = b.dataset.open; S.scenario = b.dataset.sc; S.toast = null; S.startView = false;
  if (SCREENS[id].sheet) { S.screen = SCREENS[id].under || 'home'; S.sheet = id; S.stack = []; closeIndexMobile(); render(true); }
  else { S.stack = id === 'home' ? [] : ['home']; S.screen = id; S.sheet = null; if (id === 'ob-preparing') S.prep = 0; if (id === 'workout') S.wo = { move: 0, done: {}, rir: {} }; closeIndexMobile(); render(true); }
});
$('#c-sc').addEventListener('click', e => { const b = e.target.closest('[data-sc]'); if (!b) return; S.scenario = b.dataset.sc; render(); });
$('#c-mode').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (!b) return; S.mode = b.dataset.mode; store.set('mode', S.mode); render(); });
$('#c-acc').addEventListener('click', e => { const b = e.target.closest('[data-acc]'); if (!b) return; S.accent = b.dataset.acc; store.set('accent', S.accent); render(); });
$('#measure').addEventListener('click', measureAll);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (S.mode === 'system') applyPhone(); });

/* ---------- verdicts: artifact db, else this browser only ---------- */
let DB = null, VCOL = null;
function setStat(t) { $('#dbstat').textContent = t; }
async function saveVerdict(id, data) {
  const doc = { screen: id, name: SCREENS[id.split('.')[0]]?.n || 'Genel', scenario: id.includes('.') ? id.split('.')[1] : '', ...data, at: new Date().toISOString() };
  S.verdicts[id] = doc;
  if (VCOL) { await VCOL.doc(id).set(doc); return 'db'; }
  store.set('verdicts', S.verdicts); return 'local';
}
(async () => {
  S.verdicts = store.get('verdicts', {});
  renderIndex();
  try { DB = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { DB = null; }
  if (!DB) { setStat('Kayıtlar yalnız bu tarayıcıda (veritabanına ulaşılamadı). Bitince "kopyala" ile bana yapıştır.'); return; }
  VCOL = DB.collection('verdicts');
  setStat('Kayıtlar artifact veritabanında: bana doğrudan ulaşır.');
  VCOL.onSnapshot(snap => {
    S.verdicts = {}; snap.docs.forEach(d => { S.verdicts[d.id] = d.data(); });
    renderIndex();
  }, () => { VCOL = null; setStat('Veritabanı bağlantısı koptu; kayıtlar bu tarayıcıda.'); });
})();

let rvId = null, rvPick = null;
$('#pb-review').addEventListener('click', () => {
  const id = S.sheet || S.screen; rvId = vkey(id); const v = S.verdicts[rvId]; rvPick = v?.verdict || null;
  $('#rv-title').textContent = SCREENS[id].n;
  $('#rv-sub').textContent = `#${id}${SCREENS[id].scen ? ' · ' + (S.scenario === 'd1' ? 'ilk gün' : '12. hafta') : ''}`;
  $('#rv-note').value = v?.note || ''; $('#rv-stat').textContent = '';
  $$('#rv-btns button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === rvPick)));
  $('#rv').hidden = false; $('#rv-note').focus();
});
$('#rv-btns').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; rvPick = b.dataset.v; $$('#rv-btns button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
$('#rv-cancel').addEventListener('click', () => { $('#rv').hidden = true; });
$('#rv').addEventListener('click', e => { if (e.target.id === 'rv') $('#rv').hidden = true; });
$('#rv-save').addEventListener('click', async () => {
  if (!rvPick) { $('#rv-stat').textContent = 'Önce birini seç: kalsın, değiştir ya da gitsin.'; return; }
  $('#rv-stat').textContent = 'Kaydediliyor…';
  try { const where = await saveVerdict(rvId, { verdict: rvPick, note: $('#rv-note').value.trim() }); $('#rv-stat').textContent = where === 'db' ? 'Kaydedildi.' : 'Bu tarayıcıya kaydedildi.'; renderIndex(); setTimeout(() => { $('#rv').hidden = true; }, 500); }
  catch (err) { $('#rv-stat').textContent = 'Kaydedilemedi (' + (err && err.code || 'hata') + '). Tekrar dene ya da "kopyala"yı kullan.'; }
});
$('#gensave').addEventListener('click', async () => {
  const note = $('#gen').value.trim();
  try { await saveVerdict('genel', { verdict: 'note', note }); setStat(VCOL ? 'Genel not kaydedildi.' : 'Genel not bu tarayıcıya kaydedildi.'); } catch { setStat('Genel not kaydedilemedi.'); }
});
$('#copyall').addEventListener('click', async () => {
  const lines = Object.entries(S.verdicts).sort().map(([k, v]) => `${k} · ${v.verdict}${v.note ? ' · ' + v.note : ''}`);
  const text = lines.length ? lines.join('\n') : 'Henüz değerlendirme yok.';
  try { await navigator.clipboard.writeText(text); setStat('Kopyalandı (' + lines.length + ' satır).'); }
  catch { $('#gen').value = text; $('#gen').select(); setStat('Panoya yazılamadı; metin "Genel not" kutusunda seçili.'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#rv').hidden) $('#rv').hidden = true; });

render(true);
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(measureAll, 150));
})();
</script>
