# Local development against compose.yaml's PostgreSQL (no password; it trusts 127.0.0.1):
# SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/keel
    username: keel
# Local sign-in: a placeholder bundle ID until the real one is set; the session key is still from the environment:
# export KEEL_SESSION_SECRET=$(openssl rand -base64 32)
# and RevenueCat's webhook signing secret (any value locally; the real one is in RevenueCat's dashboard, ADR-056):
# export KEEL_REVENUECAT_WEBHOOK_SECRET=$(openssl rand -hex 32)
# RevenueCat's secret API key (K-704) is optional locally: not set, the REST refresh is off
# (one warning at start) and the customer's deletion completes without it (it waits for a key only in production). A real key (sk_…, from the dashboard) is KEEL_REVENUECAT_API_KEY.
keel:
  # Development: the fake coach model and no Sign in with Apple key are allowed (K-907).
  production: false
  apple:
    client-id: app.keel.local
