spring:
  application:
    name: keel
  # The contract's types, strictly (K-205 review): a number is not an enum ("sex": 1 is not FEMALE), a fraction is not
  # an integer (180.7 is not 180), a string is not a number ("180"). Jackson 3.1.5 names (checked in the jar).
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  # The database comes from the environment (V5: no credentials in the repository). For local development the
  # `local` profile (application-local.yml) points at compose.yaml's container; tests use Testcontainers.
  datasource:
    url: ${KEEL_DB_URL}
    username: ${KEEL_DB_USER}
    password: ${KEEL_DB_PASSWORD}
  # Flyway runs every migration in db/migration when the application starts (K-202). Modulith's registry table comes
  # from V1 (ADR-023); Modulith's own schema creation is off by default and stated here so it stays off.
  flyway:
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      # A publication a listener never finished (a restart mid-way, a listener that never started) is failed after
      # this long and resent by DeletionRetry (K-214 review); on a restart every unfinished one is resent at once.
      # Module listeners are deletes and upserts: running one twice changes nothing.
      republish-outstanding-events-on-restart: true
      staleness:
        published: 10m
        processing: 10m
# Identity (K-203, ADR-011). The app's bundle ID and the session key come from the environment (V5); Apple's issuer
# and key set are Apple's published values. Access tokens live minutes, refresh tokens weeks.
keel:
  apple:
    client-id: ${KEEL_APPLE_CLIENT_ID}
    issuer: https://appleid.apple.com
    jwks-uri: https://appleid.apple.com/auth/keys
  session:
    secret: ${KEEL_SESSION_SECRET}
    access-ttl: 15m
    refresh-ttl: 60d
  # What any request may ask for (ADR-024 §13): a longer range is a client bug or an abuse, not a need (the engine
  # reads 90 days at most, evaluation_window_days); years outside a life's data would break the store or the arithmetic.
  api:
    max-range-days: 400
    earliest-year: 1900
    latest-year: 2200
  # Who can hold an account (K-225, ADR-027 #13): adults only, one age everywhere so a launch has no country table.
  profile:
    adult-age: 18
  # What a measurement can be (K-206, contract): a real body.
  measurement:
    max-weight-kg: 500
    max-waist-cm: 300
  # What a set can be (K-210, K-218): the heaviest loads people move (a leg press) stay well under this; a set is at most
  # 100 reps (a long calf-raise set stays under); reps in reserve end at 10 (the RIR scale's 0-10, Helms 2016, H3 B15).
  training:
    max-load-kg: 1000
    max-reps: 100
    max-rir: 10
    # A program the user brings (K-211): what a real one never exceeds (the templates plan 2-4 sets, 4-8 moves a day).
    max-planned-sets: 20
    max-day-exercises: 20
    max-day-name: 60
    # A note on a set or a session (K-422): a few sentences ("left shoulder pinched on the last rep"), not a diary.
    max-note: 500
    # A move of the user's own (K-424, ADR-035): a name like the catalog's, and enough of them for any gym's odd machines.
    custom-exercise:
      max-name: 60
      max-count: 100
    # A gym (K-414, ADR-032; contract GymInput): a heavy rack goes to 100 kg dumbbells by 1-2.5 kg steps; 20 plate sizes
    # cover kg and lb sets together; a gym or two per place the user trains.
    gym:
      max-name: 60
      max-plates: 20
      max-dumbbells: 100
      max-machines: 100
      max-bar-kg: 100
      max-dumbbell-kg: 200
      max-plate-kg: 100
      max-step-kg: 100
      gyms: 10
  # Food search and estimates (K-208): a page of results, a query of a few words, a meal's items, and no item over 5 kg.
  nutrition:
    default-search-results: 20
    max-search-results: 50
    max-query-length: 100
    max-items: 50
    max-grams: 5000
    # A recipe (K-413, ADR-034): the portions it makes, and a meal's portions of it, at most 50; its name at most 80.
    max-portions: 50
    max-recipe-name: 80
    # Recipes a user keeps: each is estimated again whenever the list is read (ADR-034).
    max-recipes: 100
  # Deletion (K-214, V6): failed module deletions are resent once a minute old, every 5 minutes; every module deletes
  # again 10 minutes after the DELETE, for a write already in flight (a request runs seconds, never minutes).
  privacy:
    second-pass-after: 10m
    sweep-every: 1m
    retry-after: 1m
    retry-every: 5m
  # The language model the coach uses (K-503, ADR-004, ADR-042): an adapter the server has, the model, the output limit
  # and the provider's list prices per million tokens. "fake" until a provider is chosen (K-511; ADR-041: no real call,
  # no spending yet) — it sends nothing anywhere. The AI consent names the provider (keel.consent.third-party-ai).
  coach:
    provider: fake
    # Who the calls go to, as the AI consent names it (V2); the fake sends nowhere.
    provider-name: none
    model: fake
    max-output: 400 # tokens
    input-price-per-million: 0
    output-price-per-million: 0
  # The consent texts the app shows now (data/copy/en.json › consent.*, K-204); "-draft" until the product owner approves.
  consent:
    versions:
      HEALTH_DATA: 2-draft
      APPLE_HEALTH: 1-draft
      THIRD_PARTY_AI: 1-draft
# V3 (K-215): failures are logged by SafeLog, by type and code location only. The container's and Spring MVC's own
# loggers would print an exception's message, which may hold what the request carried; and the fallback error body
# never repeats the path.
server:
  error:
    include-path: never
    include-message: never
    include-exception: false
    include-stacktrace: never
logging:
  level:
    "[org.apache.catalina.core.ContainerBase.[Tomcat].[localhost].[/].[dispatcherServlet]]": off
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: off
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: off
    # Logs a failed module listener with the exception's message at INFO; SafeLog writes it instead (BackgroundFailures).
    org.springframework.modulith.events.support.CompletionRegisteringAdvisor: warn
