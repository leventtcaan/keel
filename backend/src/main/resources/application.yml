spring:
  application:
    name: keel
  # The contract's types, strictly (K-205 review): a number is not an enum ("sex": 1 is not FEMALE), a fraction is not
  # an integer (180.7 is not 180), a string is not a number ("180"). Jackson 3.1.5 names (checked in the jar).
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  # The database comes from the environment (V5: no credentials in the repository). For local development the
  # `local` profile (application-local.yml) points at compose.yaml's container; tests use Testcontainers.
  datasource:
    url: ${KEEL_DB_URL}
    username: ${KEEL_DB_USER}
    password: ${KEEL_DB_PASSWORD}
  # Flyway runs every migration in db/migration when the application starts (K-202). Modulith's registry table comes
  # from V1 (ADR-023); Modulith's own schema creation is off by default and stated here so it stays off.
  flyway:
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
# Identity (K-203, ADR-011). The app's bundle ID and the session key come from the environment (V5); Apple's issuer
# and key set are Apple's published values. Access tokens live minutes, refresh tokens weeks.
keel:
  apple:
    client-id: ${KEEL_APPLE_CLIENT_ID}
    issuer: https://appleid.apple.com
    jwks-uri: https://appleid.apple.com/auth/keys
  session:
    secret: ${KEEL_SESSION_SECRET}
    access-ttl: 15m
    refresh-ttl: 60d
  # The consent texts the app shows now (data/copy/en.json › consent.*, K-204); "-draft" until the product owner approves.
  consent:
    versions:
      HEALTH_DATA: 1-draft
      APPLE_HEALTH: 1-draft
      THIRD_PARTY_AI: 1-draft
# V3 (K-215): failures are logged by SafeLog, by type and code location only. The container's and Spring MVC's own
# loggers would print an exception's message, which may hold what the request carried; and the fallback error body
# never repeats the path.
server:
  error:
    include-path: never
    include-message: never
    include-exception: false
    include-stacktrace: never
logging:
  level:
    "[org.apache.catalina.core.ContainerBase.[Tomcat].[localhost].[/].[dispatcherServlet]]": off
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: off
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: off
