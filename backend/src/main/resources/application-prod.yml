# The server on the VPS (K-907, K-901): SPRING_PROFILES_ACTIVE=prod, over application.yml. Secrets and the database come
# from the environment as everywhere (V5); here only what production changes. ProductionProfileTests reads this file.
keel:
  # As without a profile (application.yml), stated here too: a missing Sign in with Apple key (AppleAccounts) or the fake
  # coach model (LanguageModelConfiguration) stops the start.
  production: true
  # The AI is off in the beta (ADR-064 #5): the coach says what the engine wrote. keel.consent.third-party-ai stays unset,
  # so no AI consent can be given and no call can go. TestFlight's SANDBOX purchases still count (application.yml; ADR-056 #4).
  coach:
    provider: "off"
    provider-name: none
    model: none
  # Switching the conversational coach on (ADR-092, ADR-091 Ek 5) is a deploy decision, not a code change: only after the consent text
  # is approved (ADR-020; keel.consent.versions THIRD_PARTY_AI loses "-draft") and the OpenAI project's own budget cap is set. Then,
  # in the environment (relaxed binding; V5 for the key): KEEL_OPENAI_API_KEY, KEEL_COACH_PROVIDER=openai,
  # KEEL_COACH_PROVIDERNAME=OpenAI, KEEL_COACH_MODEL=gpt-5-nano-2025-08-07, KEEL_COACH_MAXOUTPUT=600,
  # KEEL_COACH_OPENAI_REASONINGEFFORT=minimal (a model without reasoning: KEEL_COACH_OPENAI_TEMPERATURE=0.2 instead),
  # KEEL_COACH_INPUTPRICEPERMILLION and KEEL_COACH_OUTPUTPRICEPERMILLION once checked on openai.com/api/pricing — until then
  # they stay unset [doğrulanmadı] and every call counts at coach_unpriced_call_cost_usd (data/parameters/coach.yaml), and the
  # consent's provider and data (keel.consent.third-party-ai.provider / .data-types).
