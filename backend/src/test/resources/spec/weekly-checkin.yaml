# Weekly check-in specification (K-106, K-104, K-103, K-112).
# Each row is one branch of Güray's weekly decision tree or a safety/data rule, with its source.
# `given` is written in plain domain terms; K-101 turns it into a real Snapshot.
# Row order is not execution order; the engine's fixed order is in ADR-003 §4.
# Actions are the proposed vocabulary (K-101 finalizes it; renaming here is part of that task).

actions: [NO_DECISION_YET, CONTINUE, ADJUST_CALORIES, INCREASE_CALORIES, CHANGE_MOVEMENT,
          FIX_TRAINING, FIX_RECOVERY, FIX_ADHERENCE, HARD_STOP,
          STOP_LOAD_INCREASE, DELOAD, FULL_REST_WEEK, MINI_CUT,
          CHANGE_PHASE]  # K-105: the phase gate turns a bulk into a cut and ends a cut (G6 K-7/K-8, G4 K-10)

rows:
  - id: WC-01
    title: "First 14 days: no interpretation"
    given: {phase: cut, days_since_start: 10, weighins_last_7: 7, adherence: 0.95}
    expect: {action: NO_DECISION_YET, reason: data_insufficient}
    source: "arastirma/ham/H1-olcum.md#3.4"

  - id: WC-02
    title: "Decision window not full yet (female, 21 of 28 days)"
    given: {sex: female, phase: cut, days_in_window: 21, trend: flat, adherence: 0.9}
    expect: {action: NO_DECISION_YET, reason: window_not_full}
    source: "arastirma/ham/J1-cinsiyet.md#D1"

  - id: WC-03
    title: "Moving toward goal, looks better: change nothing"
    given: {phase: cut, trend: toward_goal, look: better, training: stable, adherence: 0.84}
    expect: {action: CONTINUE}
    source: "arastirma/03-guray-karar-omurgasi.md#2.4"

  - id: WC-04
    title: "Not moving toward goal, plan followed, training fine: adjust calories"
    given: {phase: cut, trend: flat, flat_weeks: 3, training: stable, adherence: 0.91}
    expect: {action: ADJUST_CALORIES, direction: down, step_param: cut_step_min_kcal}
    source: "arastirma/03-guray-karar-omurgasi.md#2.4"

  - id: WC-05
    title: "Toward goal but looks worse and training is bad: fix training first, no calorie decision"
    given: {phase: bulk, trend: toward_goal, look: worse, training: declining, adherence: 0.9}
    expect: {action: FIX_TRAINING}
    source: "arastirma/03-guray-karar-omurgasi.md#2.4"

  - id: WC-06
    title: "Training fine, recovery bad: protein, sleep"
    given: {phase: bulk, trend: toward_goal, look: worse, training: stable, recovery: poor, adherence: 0.9}
    expect: {action: FIX_RECOVERY}
    source: "arastirma/03-guray-karar-omurgasi.md#2.4"

  - id: WC-07
    title: "Everything fine but still looks worse on a bulk: genetic limit, pull calories back"
    given: {phase: bulk, trend: toward_goal, look: worse, training: stable, recovery: good, adherence: 0.9}
    expect: {action: ADJUST_CALORIES, direction: down}
    source: "arastirma/03-guray-karar-omurgasi.md#2.4"

  - id: WC-08
    title: "Weight and waist flat one week, adherence high: wait, the drop usually comes"
    given: {phase: cut, trend: flat, flat_weeks: 1, waist: flat, adherence: 0.95}
    expect: {action: NO_DECISION_YET, reason: wait_one_more_week}
    source: "arastirma/03-guray-karar-omurgasi.md#2.4"

  - id: WC-09
    title: "Adherence under 50%: do not touch calories, fix adherence"
    given: {phase: cut, trend: flat, flat_weeks: 3, adherence: 0.45}
    expect: {action: FIX_ADHERENCE}
    source: "arastirma/ham/guray/G2-kilo-verme.md#K-60"

  - id: WC-10
    title: "Losing faster than the weekly cap: raise calories"
    given: {phase: cut, bodyweight_kg: 70, weekly_loss_kg: 0.9}
    expect: {action: INCREASE_CALORIES, reason: loss_rate_cap}
    source: "arastirma/ham/guray/G2-kilo-verme.md#K-17"
    note: "Cap = min(1 kg, 1% of 70 kg = 0.7 kg) → 0.9 kg exceeds it."

  - id: WC-11
    title: "More than 8% bodyweight lost in 8 weeks: narrow the deficit and warn"
    given: {phase: cut, bodyweight_8w_ago_kg: 90, bodyweight_kg: 82}
    expect: {action: INCREASE_CALORIES, reason: rapid_loss}
    source: "arastirma/ham/J1-cinsiyet.md#C6"
    note: "ADR-020 L-1: the research says narrow + warn (J1 C6 tier 2); the only hard stop is a reported loss of the cycle (WC-22)."

  - id: WC-12
    title: "A calorie cut would go under BMR: change movement instead"
    given: {phase: cut, trend: flat, flat_weeks: 3, adherence: 0.91, training: stable, calories_after_step_below_bmr: true}
    expect: {action: CHANGE_MOVEMENT, reason: bmr_floor}
    source: "arastirma/ham/guray/G2-kilo-verme.md#K-11"

  - id: WC-13
    title: "Training performance falling on a cut: red flag, no calorie cut"
    given: {phase: cut, trend: flat, flat_weeks: 3, adherence: 0.9, training: declining}
    expect: {action: FIX_TRAINING, reason: performance_red_flag}
    source: "arastirma/ham/guray/G7-whisper-arsiv.md#K-98"

  - id: WC-14
    title: "Bulk stalled for 2 weeks: +250 kcal, all from carbs"
    given: {phase: bulk, trend: flat, flat_weeks: 2, training: stable, adherence: 0.9}
    expect: {action: ADJUST_CALORIES, direction: up, step_param: bulk_step_kcal, macro: carbs}
    source: "arastirma/ham/guray/G3-kilo-alma-beslenme.md#K-10"

  - id: WC-15
    title: "User pushes back with no new data: decision unchanged"
    given: {phase: cut, trend: toward_goal, look: better, training: stable, adherence: 0.84, user_pushback: true, new_data: false}
    expect: {action: CONTINUE}
    source: "docs/anayasa.md#U2"
    note: "U2 — the same Snapshot must produce the same Decision."

  - id: WC-16
    title: "Load stalled on a compound: stop adding load before anything else"
    given: {lift: bench, stalled_sessions: 3, adherence: 0.9}
    expect: {action: STOP_LOAD_INCREASE}
    source: "arastirma/ham/guray/G7-whisper-arsiv.md#K-68"

  - id: WC-17
    title: "Stalled after stopping load increases: deload (half the sets)"
    given: {lift: bench, stalled_sessions: 5, load_increase_stopped: true}
    expect: {action: DELOAD, volume_factor_param: deload_volume_factor}
    source: "arastirma/ham/guray/G7-whisper-arsiv.md#K-68"

  - id: WC-18
    title: "Planned sessions not done as planned two weeks running: one full week off"
    given: {plan_missed_weeks: 2}
    expect: {action: FULL_REST_WEEK, reason: plan_missed}
    source: "arastirma/ham/guray/G7-whisper-arsiv.md#K-73"
    note: "ADR-020 L-12: K-73's two-way test (plan kept / not kept), two weeks in a row; the old 0.4 ratio had no source. Treatment K-70."

  - id: WC-19
    title: "Three months without progress: deload signal on its own"
    given: {months_without_progress: 3}
    expect: {action: DELOAD}
    source: "arastirma/ham/guray/G7-whisper-arsiv.md#K-69"

  - id: WC-20
    title: "Appetite gone on a bulk: mini cut"
    given: {phase: bulk, appetite: gone, forcing_food: true}
    expect: {action: MINI_CUT}
    source: "arastirma/ham/guray/G7-whisper-arsiv.md#K-102"

  - id: WC-21
    title: "Plan leaves too little energy after training: narrow the deficit"
    given: {sex: male, phase: cut, bodyweight_kg: 80, fat_proxy_pct: 25, target_kcal: 1800, exercise_kcal: 400}
    expect: {action: INCREASE_CALORIES, reason: low_energy_availability}
    source: "arastirma/ham/J1-cinsiyet.md#L2.1"
    note: "(1800 − 400) / (80 × 0.75) = 23.3 kcal/kg fat-free mass, under the male line 25 (ADR-020 L-2)."

  - id: WC-22
    title: "Loss of the menstrual cycle reported: the one hard stop"
    given: {sex: female, phase: cut, menstrual_loss_reported: true}
    expect: {action: HARD_STOP, reason: menstrual_loss_reported}
    source: "arastirma/ham/J1-cinsiyet.md#C6"
    note: "Cut stops, maintenance, see a doctor (ADR-020 L-1). The answer is used for this decision only (GDPR Art. 9)."

  - id: WC-23
    title: "Can't lift last week's loads any more (off a cut): food and sleep, not a deload"
    given: {phase: bulk, lift: bench, loads_below_last_week: true}
    expect: {action: FIX_RECOVERY, reason: loads_regressed}
    source: "arastirma/ham/guray/G7-whisper-arsiv.md#K-68"
    note: "ADR-020 L-12: rung 3 of K-68 ('not fatigue; check food and sleep one by one')."
