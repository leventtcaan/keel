# Test-only values (loaded next to the main application.yml, tests only). Not secrets: a made-up bundle ID and a
# session key that signs nothing outside these tests.
keel:
  # Tests are development: the fake model, and Apple's key only where a test sets it (K-907).
  production: false
  apple:
    client-id: app.keel.test
  session:
    secret: dGVzdC1vbmx5IHNlc3Npb24ga2V5LCBzaWducyBub3RoaW5nIHJlYWwh
  # The third-party AI the server would send to (the real one is chosen in K-511); consent binds to it.
  # A failed deletion is resent at once when a test asks (DeletionRetryTests).
  privacy:
    retry-after: 0s
  # RevenueCat's webhook (K-701): a signing secret that signs nothing outside these tests (TestWebhooks signs with it).
  subscription:
    revenuecat:
      webhook-secret: test-only revenuecat signing secret
  consent:
    third-party-ai:
      provider: Example AI
      data-types: [meal photo, meal note, coach question]
  # The fake model (K-503), with values that show they come from here.
  coach:
    provider: fake
    provider-name: Example AI
    model: test-model
    max-output: 300 # tokens
    input-price-per-million: 0.10
    output-price-per-million: 0.40
    data-types:
      explain: coach question
      parse-meal: meal note
      photo-meal: meal photo
    # A question is a few sentences (contract CoachQuestion.text); a reply three short ones (data/coach/explain.md).
    max-question-chars: 2000
    max-reply-chars: 400
    # A meal in words (K-504): a few sentences; what a meal holds; a food in a few words; foods offered for each.
    meal:
      max-text-chars: 500
      max-items: 20
      max-food-chars: 100
      candidates: 5
      # Words no food is looked up by: they are in half the database's names ("and" is in "Candies", "Sandwich").
      stop-words: [and, with, the, of, some, my, a, an, in, on, or, plus]
    # A meal photo (K-514, V1): at most 1024 px a side (the app shrinks it, K-408), and so at most this many bytes — a
    # 1024 px PNG of a plate is under 2 MB; what the server sends on is its own JPEG at this quality, no metadata.
    photo:
      max-side: 1024
      max-bytes: 2500000
      jpeg-quality: 0.85
