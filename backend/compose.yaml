# Local PostgreSQL for development (K-202, ADR-020): `docker compose up -d` in backend/, then run the application with
# the `local` profile. The image is the one in gradle/libs.versions.toml (postgres-image; VersionCatalogTests checks).
# Host port 55432, not 5432: a PostgreSQL installed on the machine often holds 5432.
# The password is for this local container only; a deployed database takes its credentials from the environment (V5).
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: keel
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel-local-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - keel-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel -d keel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  keel-postgres:
