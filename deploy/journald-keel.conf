# /etc/systemd/journald.conf.d/zz-keel.conf (K-901, ADR-065): every log on the server, the containers' included
# (compose.yaml sends them to journald), is deleted after LOG_KEEP_DAYS (retention.env; tools/test_deploy.py keeps them
# equal). Named after Ubuntu's syslog.conf so it applies last: nothing is copied to syslog. MaxRetentionSec deletes only
# closed files, so a file closes each day (the default is a month).
[Journal]
MaxRetentionSec=14day
MaxFileSec=1day
ForwardToSyslog=no
