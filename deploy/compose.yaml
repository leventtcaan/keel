# The server on the VPS (K-901, ADR-065). Run from /opt/keel through deploy/kc (the project directory is /opt/keel, so its
# .env holds the secrets — deploy/env.example lists their names; V5). Images by version and digest (K6); the backend's is
# the one deploy/release.sh tags `current` (K-902 builds it in CI).
name: keel

x-logging: &logging
  # journald keeps every container's log LOG_KEEP_DAYS days (deploy/journald-keel.conf).
  logging:
    driver: journald

services:
  postgres:
    # The version catalog's release (backend/gradle/libs.versions.toml › postgres-image; tools/test_deploy.py).
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    # Its log never holds a row or a statement (V3): a failed insert's DETAIL shows the row's values, health data among
    # them; the statement shows what was sent. Terse keeps the error itself.
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic"]
    environment:
      POSTGRES_DB: keel
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: ${KEEL_DB_PASSWORD:?KEEL_DB_PASSWORD is not set in /opt/keel/.env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel -d keel"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Only on the internal network: no port on the host, no way out.
    networks: [internal]
    <<: *logging

  backend:
    image: keel-backend:current
    restart: unless-stopped
    env_file: [.env]
    environment:
      # The VPS profile (K-907): the Apple key required, the coach off.
      SPRING_PROFILES_ACTIVE: prod
      KEEL_DB_URL: jdbc:postgresql://postgres:5432/keel
      KEEL_DB_USER: keel
      # FoodData Central's releases, imported at start (ADR-008; the same release again changes nothing).
      KEEL_FDC_IMPORT_DIR: /fdc
    volumes:
      - ./fdc:/fdc:ro
    depends_on:
      postgres:
        condition: service_healthy
    # The heap is 75% of this (deploy/backend.Dockerfile); PostgreSQL and Caddy share the rest.
    mem_limit: 1g
    # Internal to reach PostgreSQL; edge to be reached by Caddy and to call Apple (sign-in keys, revocation).
    networks: [internal, edge]
    <<: *logging

  caddy:
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    restart: unless-stopped
    environment:
      KEEL_DOMAIN: ${KEEL_DOMAIN:?KEEL_DOMAIN is not set in /opt/keel/.env}
    # The only ports the server opens to the internet (HTTP for the certificate and the redirect, HTTPS, HTTP/3).
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [backend]
    networks: [edge]
    <<: *logging

networks:
  internal:
    internal: true
  edge: {}

volumes:
  postgres:
  caddy-data:
  caddy-config:
